<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>廠區</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fde'/%3E%3Cpath d='M12 50V28l12 8v-8l12 8v-8l12 8V14h6v36z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
/* 廠區: the week's plan as a factory board — one card per point in stage columns, flow left to right (suppliers
   outside the fence, 暫存區, the stations, assembly, 訂單). Clicking a card opens it over the board as a bigger card with
   the same head. One kind of card and one kind of row everywhere: a row with a done and a need reads 「done／need」 with a
   thin bar under it. Light palette only; every colour is set here in :root, the andon lights' included. */
:root {
  color-scheme: light;
  --bg: #e7ebef; --panel: #fff; --panel-2: #f3f5f7; --ink: #18222c; --muted: #566472;
  --line: #cbd3db; --dot: #d3dae1; --ctl: #b6c0ca; --plate: #2a3642; --accent: #2f6fde;
  --track: #e1e6eb; --fill: #56657a;
  --grade-green: #2a7a3b; --grade-blue: #2560b0; --grade-purple: #7840c0; --grade-pink: #b0307a; --grade-orange: #a8530c;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Noto Sans TC", ui-monospace, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  /* the andon lights: each a lamp, a text colour and a tint; .ok .wait .bad .idle switch them for whatever they sit on */
  --st: #66727f; --st-lamp: #a3adb8; --st-soft: #edf0f3; --bad-text: #c73636; --ok-text: #1f7a45;
}
.ok { --st: #1f7a45; --st-lamp: #2fa35f; --st-soft: #e3f4ea; }
.wait { --st: #8a5a00; --st-lamp: #f0b429; --st-soft: #fcf1d6; }
.bad { --st: #c73636; --st-lamp: #e04848; --st-soft: #fde7e7; }
.idle { --st: #66727f; --st-lamp: #a3adb8; --st-soft: #edf0f3; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scrollbar-gutter: stable; }
html:has(dialog[open]) { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
button, input, select { font: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
.grade-綠 { color: var(--grade-green); } .grade-藍 { color: var(--grade-blue); } .grade-紫 { color: var(--grade-purple); }
.grade-粉 { color: var(--grade-pink); } .grade-橙 { color: var(--grade-orange); }
.muted { color: var(--muted); }

.top { background: var(--plate); color: #fff; }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px var(--gutter-r) 10px var(--gutter-l); display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.top h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.top h1 small { font-size: 13px; font-weight: 400; color: #b4bfca; }
.top h1 .ver { padding: 1px 8px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 3px; font-family: var(--mono); font-size: 12px; }
.top nav { margin-left: auto; display: flex; gap: 6px; }
.top nav a, .top nav .nav-btn { color: #fff; text-decoration: none; padding: 6px 12px; border: 0; border-radius: 4px; background: rgba(255, 255, 255, .1); font-size: 14px; cursor: pointer; }
.top nav a:hover, .top nav .nav-btn:hover { background: rgba(255, 255, 255, .2); }

main { max-width: 1440px; margin: 0 auto; padding: 16px var(--gutter-r) 48px var(--gutter-l); display: grid; gap: 16px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
.box-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px; border-bottom: 2px solid var(--plate); }
.box-head h2 { font-size: 18px; }
.box-head h3 { font-size: 15px; }
.box-head .muted { font-size: 13px; }
.box-head.sub { border-top: 1px solid var(--line); border-bottom: 0; }
.loading, .fail { padding: 24px 16px; }

/* the summary: the week's figures in a row, each opening where it comes from; a done／need one has the rows' bar */
.summary { display: flex; flex-wrap: wrap; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.kpi { color: inherit; text-align: left; display: grid; align-content: center; padding: 8px 18px; border: 0; border-right: 1px solid var(--line); background: none; }
button.kpi { cursor: pointer; }
button.kpi:hover { background: var(--panel-2); }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi b { font-family: var(--mono); font-size: 18px; line-height: 1.35; }
.kpi .m-bar { min-width: 96px; margin-top: 5px; }
.kpi.bad { box-shadow: inset 0 3px 0 var(--st-lamp); }
.kpi.bad b { color: var(--bad-text); }
.kpi.edit { margin-left: auto; border-right: 0; border-left: 1px solid var(--line); }
.hint { flex: 1 1 100%; margin: 0; padding: 5px 18px 6px; font-size: 12px; color: var(--muted); background: var(--panel-2); border-top: 1px solid var(--line); }
.stepper { display: inline-flex; margin-top: 2px; }
.stepper .btn { min-width: 40px; border-radius: 0; }
.stepper .btn:first-child { border-radius: 4px 0 0 4px; }
.stepper .btn:last-child { border-radius: 0 4px 4px 0; }
.stepper input { width: 52px; min-height: 36px; text-align: center; font-family: var(--mono); font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--ctl); border-left: 0; border-right: 0; border-radius: 0; }

/* the board: a floor grid, the stage titles as flow arrows; wide, 廠外 takes two columns of cards */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-left: auto; font-size: 12px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.board { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 14px; padding: 16px; background-color: #eef1f4; background-image: linear-gradient(#dde3e9 1px, transparent 1px), linear-gradient(90deg, #dde3e9 1px, transparent 1px); background-size: 20px 20px; }
.stage { display: grid; gap: 10px; align-content: start; min-width: 0; }
.stage > h3 { color: #fff; background: var(--plate); font-size: 13px; font-weight: 700; letter-spacing: .12em; padding: 5px 14px 5px 18px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 8px 50%); }
.stage.s-out > h3 { padding-left: 10px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); }
.cards { display: grid; gap: 10px; align-content: start; }
.s-out .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* a card: its head (tower light, name, its light on the line under the name), its rows, a foot */
.c { color: inherit; text-align: left; width: 100%; display: flex; flex-direction: column; padding: 0; margin: 0; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 1px 0 rgba(24, 34, 44, .06); }
.c:hover { border-color: #8fa6c2; box-shadow: 0 4px 14px rgba(24, 34, 44, .12); }
.c-head { display: grid; grid-template-columns: 10px minmax(0, 1fr); grid-template-areas: "light name" "light state"; column-gap: 9px; align-items: center; }
.c .c-head { padding: 7px 10px 6px; background: var(--st-soft); border-top: 3px solid var(--st-lamp); border-bottom: 1px solid var(--line); }
.c-name { grid-area: name; min-width: 0; font-size: 15px; font-weight: 700; line-height: 1.35; }
.c-state { grid-area: state; font-size: 12px; font-weight: 700; line-height: 1.5; color: var(--st); }
/* the tower light: red, yellow, green; the one lit is the card's light, none for 無使用 */
.light { grid-area: light; display: grid; gap: 2px; align-self: center; }
.lg .light { display: inline-grid; }
.light i { display: block; width: 10px; height: 7px; border-radius: 2px; background: #cdd4db; }
.bad .light i:nth-child(1), .wait .light i:nth-child(2), .ok .light i:nth-child(3) { background: var(--st-lamp); box-shadow: 0 0 6px var(--st-lamp); }
.c-body { display: grid; padding: 4px 10px 7px; }
/* a row: a name on the left, a number on the right; one with a done and a need has a thin bar under it, the number
   and the bar slate while under way, green with ✓ once met, red for a material the week is short of (異常) */
.m { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 10px; padding: 3px 0; font-size: 13px; line-height: 1.5; }
.m-l { min-width: 0; }
.m-v { font-family: var(--mono); font-size: 12.5px; font-weight: 500; text-align: right; white-space: nowrap; }
.m-bar { grid-column: 1 / -1; display: block; height: 3px; margin: 3px 0 1px; border-radius: 2px; background: var(--track); overflow: hidden; }
.m-bar i { display: block; height: 100%; border-radius: 2px; background: var(--fill); }
.m-sub { grid-column: 1 / -1; margin-top: 2px; font-size: 12px; color: var(--muted); }
.m.met .m-v { color: var(--ok-text); }
.m.met .m-bar i { background: #2fa35f; }
.m.short { color: var(--bad-text); }
.m.short .m-bar i { background: #e04848; }
.m.none .m-v, .m.none .m-l { color: var(--muted); }
/* what a card's numbers are, in small type over its rows */
.m-head { display: flex; justify-content: flex-end; font-size: 11px; letter-spacing: .04em; color: var(--muted); }
.cut { display: block; margin: 4px 0 2px; border-top: 1px dashed #9aa6b2; }
.foot { margin-top: auto; padding: 5px 10px; background: var(--panel-2); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
/* a station's places on its card: a small light each — 做好 and 等開工 yellow, 做中 green, 排隊 faint green, empty dashed */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; padding: 7px 0 3px; }
.strip i { display: block; height: 9px; border-radius: 2px; background: var(--st-lamp); }
.strip i.queued { opacity: .45; }
.strip i.empty { background: transparent; border: 1px dashed #9aa6b2; }
.no, .wish-n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 3px; background: var(--plate); color: #fff; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.q { font-family: var(--mono); font-size: 13px; margin-left: 4px; }
.st { font-size: 12px; font-weight: 700; color: var(--st); display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.lamp { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--st-lamp); flex: none; }
.cutnote { color: var(--bad-text); }

/* the card that opens over the board (and the forms): the same head, the middle scrolls, the foot stays put — along
   the flow on the left, the card's own action on the right */
.modal { padding: 0; border: 0; background: transparent; color: var(--ink); width: min(560px, calc(100vw - 32px)); max-width: none; max-height: none; overflow: visible; }
.modal.wide { width: min(900px, calc(100vw - 32px)); }
.modal::backdrop { background: rgba(24, 34, 44, .5); }
.modal[open] { animation: fade .14s ease-out; }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .modal[open] { animation: none; } }
.mc { display: flex; flex-direction: column; max-height: min(88vh, 800px); background: var(--panel); border-radius: 8px; overflow: hidden; border-top: 4px solid var(--st-lamp); box-shadow: 0 24px 60px rgba(24, 34, 44, .35); }
.mc.plain { border-top-color: var(--plate); }
.mc-head { flex: none; padding: 8px 12px 12px 18px; background: var(--st-soft); border-bottom: 1px solid var(--line); }
.mc.plain .mc-head { background: var(--panel-2); }
.mc-top { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.mc-kind { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.mc-x { margin-left: auto; width: 34px; height: 34px; border: 0; border-radius: 4px; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
.mc-x:hover { background: rgba(24, 34, 44, .08); color: var(--ink); }
.mc .c-head { grid-template-columns: 12px minmax(0, 1fr); column-gap: 10px; margin-top: 2px; }
.mc .c-name, .mc-title { font-size: 20px; }
.mc .c-state { font-size: 13px; }
.mc .light i { width: 12px; height: 9px; }
.mc-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.mc-body.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.mc-body.cols > .col + .col { border-left: 1px solid var(--line); }
.mc-foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; background: var(--panel-2); border-top: 1px solid var(--line); }
.mc-nav { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.mc-act { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 10px; margin-left: auto; }
.mc-act .note { margin: 0; font-size: 12px; }
/* a station's card is one screen high and never scrolls as a whole: 設備 on the left, 排程 and 已完成 share the right
   and scroll inside (on a narrow screen it is as tall as it needs) */
@media (min-width: 761px) {
  .modal.station .mc { height: min(88vh, 800px); }
  .modal.station .mc-body.cols { overflow: hidden; align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .modal.station .col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .modal.station .col > .sec { flex: none; }
  .modal.station .col > .sec.grow { flex: 3 1 0; min-height: 0; display: flex; flex-direction: column; }
  .modal.station .col > .sec.grow ~ .sec.grow { flex-grow: 2; }
  .modal.station .sec.grow > .list5 { flex: 1 1 auto; min-height: 0; max-height: none !important; }
  .modal.station .sec.grow > :not(.list5) { flex: none; }
}

/* inside a card: sections, rows (the same row as on the board, a size up), notes */
.sec { padding: 14px 18px; }
.sec + .sec { border-top: 1px solid var(--line); }
.sec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; padding-left: 8px; border-left: 3px solid var(--plate); font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--plate); }
.sec-h .meta { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; letter-spacing: .04em; color: var(--muted); }
.sub-h { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.sec-h + .sub-h { margin-top: 0; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.note0 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.note.pad { margin: 0; padding: 10px 16px 14px; }
.sec.alert { background: var(--st-soft); }
.sec.alert .sec-h { color: var(--st); border-left-color: var(--st-lamp); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.tips { margin: 0; padding-left: 18px; font-size: 14px; }
.tips li { margin: 3px 0; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.bad-text { color: var(--bad-text); font-weight: 700; }
.tag { display: inline-flex; align-items: center; padding: 0 6px; margin-left: 6px; border-radius: 3px; font-size: 11px; font-weight: 700; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); vertical-align: 1px; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rows .m { padding: 6px 0; font-size: 14px; }
.rows .m-l { font-weight: 500; }
.rows .m-l small { font-weight: 400; color: var(--muted); }
.rows .m-v { font-size: 13px; }
.rows .m.act { align-items: center; }
.rows .m.dish .m-l { font-size: 15px; font-weight: 700; }
.rows .m.dish:not(:first-child) { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.rows .m.in { margin-left: 14px; }
/* a station's places and the batches still to put in: every one the same 48px, empty or not, so nothing shifts as they
   fill — 做好 (to collect) and 等開工 yellow, 做中 green, 排隊 a green frame, an empty place hatched */
.slots { display: grid; gap: 6px; align-content: start; }
.list5 { overflow-y: auto; overscroll-behavior: contain; }
.slot { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 10px; height: 48px; padding: 0 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.slot.ok, .slot.wait { background: var(--st-soft); border-color: color-mix(in srgb, var(--st-lamp) 50%, var(--line)); }
.slot.queued { background: var(--panel); }
.slot .no { justify-self: center; }
.slot .what { min-width: 0; font-size: 14px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .what small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--st); overflow: hidden; text-overflow: ellipsis; }
.slot.empty { background: repeating-linear-gradient(135deg, #f4f6f8 0 7px, #eaedf1 7px 14px); border-style: dashed; }
.slot.empty .no { background: #a9b3bd; }
.slot.empty .what { color: var(--muted); font-size: 13px; font-weight: 400; }
.slot.seq { grid-template-columns: 16px 24px minmax(0, 1fr) auto; }
.slot .mv { display: inline-flex; gap: 4px; }
.slot.drop { outline: 2px dashed var(--accent); outline-offset: 1px; }
.slot.dragging { opacity: .35; }
.slot.ghost { position: fixed; z-index: 50; margin: 0; pointer-events: none; box-shadow: 0 6px 18px rgba(24, 34, 44, .22); }
.grip { color: #9aa5b1; text-align: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.slot.dragging .grip { cursor: grabbing; }
/* 訂單: the wish list — number, dish ×count and 完成, its light under the dish */
.ords { list-style: none; margin: 0; padding: 0; }
.ord { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-areas: "no nm act" "no st act"; gap: 2px 12px; align-items: center; padding: 10px 0; }
.ord + .ord { border-top: 1px dotted var(--dot); }
.ord .no { grid-area: no; align-self: start; margin-top: 1px; }
.ord .nm { grid-area: nm; font-size: 15px; font-weight: 700; min-width: 0; }
.ord .st { grid-area: st; }
.ord .act, .ord > .btn { grid-area: act; justify-self: end; min-width: 56px; }
/* the forms: a block per character or group, a row per item with its number at the end */
.bm-char { border: 0; margin: 0 0 4px; padding: 0; min-width: 0; }
.bm-char legend { padding: 0; margin: 8px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--plate); }
.bm-row, .set-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dotted var(--dot); }
.set-row { gap: 12px; padding: 10px 0; }
.set-row .btn { flex: none; }
.bm-name { flex: 1 1 auto; min-width: 0; }
.bm-name small { display: block; font-size: 12px; color: var(--muted); }
.bm-row > .muted { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
input.have { width: 76px; min-height: 34px; padding: 4px 8px; font-family: var(--mono); font-size: 14px; text-align: right; color: var(--ink); background: #fff; border: 1px solid var(--ctl); border-radius: 4px; }
select { width: 100%; min-width: 0; min-height: 34px; padding: 4px 8px; font-size: 15px; color: var(--ink); background: #fff; border: 1px solid var(--ctl); border-radius: 4px; }
/* the order form: ⠿ moves a line, ✕ takes it off, 上限 in small type under the count; nothing is kept until 完成 */
.oe-row { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) 80px 38px; gap: 6px; align-items: start; padding: 8px 0; border-bottom: 1px dotted var(--dot); background: var(--panel); }
.oe-row .wish-n { margin-top: 6px; }
.oe-grip { height: 34px; display: grid; place-items: center; border-radius: 4px; font-size: 18px; color: #9aa5b1; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.oe-grip:hover { background: var(--panel-2); color: var(--ink); }
.oe-qty input { width: 100%; }
.oe-qty small { display: block; margin-top: 2px; font-size: 12px; text-align: right; color: var(--muted); }
.oe-qty small.ord-cut { color: var(--bad-text); font-weight: 700; }
.oe-del { min-height: 34px; padding: 0; }
.oe-row.dragging { position: relative; z-index: 5; box-shadow: 0 6px 18px rgba(24, 34, 44, .22); }
.oe-row.dragging .oe-grip { cursor: grabbing; }
.oe-row.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
/* buttons: the main action dark, the rest white; blue is for links and focus only */

.btn:disabled, .btn.primary:disabled { cursor: not-allowed; color: #8d98a4; background: #eef1f4; border-color: #d3d9df; }
.btn.small { min-height: 30px; padding: 2px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding: 4px 8px; max-width: 16em; overflow: hidden; text-overflow: ellipsis; }
.btn.ghost:hover { background: rgba(47, 111, 222, .08); }

/* narrower than five columns in a row: 廠外 moves to a row of its own on top, the plant's four columns under it; on a
   phone one column after another, and the card that opens comes up from the bottom */
