<body>
<header class="top">
  <div class="top-in">
    <!-- 版本號寫死在這裡，程式沒跑起來也看得到；每次 push 前改一次 -->
    <h1>廠區 <small id="week-line"></small><small class="ver">v2026.10.27.11</small></h1>
    <nav><a href="index.html">佈告欄</a><button class="nav-btn" type="button" data-settings>設定</button></nav>
  </div>
</header>
<main id="app"><div class="box loading">讀取資料中…</div></main>
<!-- a point's card over the board, and the forms over that -->
<dialog id="point" class="modal" aria-labelledby="mc-title"></dialog>
<dialog id="sheet" class="modal" aria-labelledby="sheet-title"><form id="sheet-form" method="dialog"></form></dialog>

<script src="line-core.js"></script>
<script id="plant-script">
(() => {
  // The plant page: the week (wish list, holdings and characters) as a factory floor. Click a point to see what it
  // needs and how it stands. The plant is shown as blocks, one column per stage.
  const {
    LINE, SHOP, S, save, MAX_CHARS, esc, fmt, fmtDur, shopWeek, nameHTML, sourceText, townRank, quick, chars, charsFromBoard, held,
    allocate, makePlan, makeSchedule, progress, yieldOf, dishes, dishOptions, wireList, gathers, setBought, setDone, stepInfo,
    REC, slotsOf, setSlots, setOrder, startSlots, collectSlot, uncollect, cancelSlot, logOf,
  } = window.LineCore;
  const $ = (id) => document.getElementById(id);

  // One look for one kind of plant. The plan underneath doesn't change between themes, so a car or wafer plant only
  // needs its own words here (and its colours in the stylesheet's :root).
  const THEME = {
    words: {
      outside: '廠外', shop: '供應商', field: '自有採集', unknown: '來源待補', warehouse: '暫存區', bag: '暫存區', machine: '加工站',
      assembly: '組裝站', fg: '訂單',
    },
  };
  const W = THEME.words;
  const STATUS_TEXT = { ok: '運行', wait: '要處理', bad: '異常', idle: '無使用' };
  // What kind of point a card that opens is, over its name: the board's stage, and for 廠外 which kind of supplier.
  const KIND = {
    shop: `${W.outside}・${W.shop}`, field: `${W.outside}・${W.field}`, unknown: `${W.outside}・${W.unknown}`, bag: W.warehouse,
    warehouse: W.warehouse, machine: '加工', assembly: '組裝', fg: W.fg,
  };

  /* ---------- the plan and its points ---------- */
  let A, P, SCH, PR, PL = new Map(), NODES = [], BY = new Map(), ZONES = [], sel = null;
  // The stock is the bag alone (S.have); counts once kept per 投料區 are gone.
  delete S.zone;

  function plan() {
    A = allocate();
    P = makePlan(A);
    SCH = makeSchedule(P);
    PR = progress(A, P);
    const out = [];
    // Outside the fence: every shop selling something the wish list wants (even one whose share came to nothing, so a
    // shortage still shows where to buy), then gathering, then materials with no known source. A shop's item carries
    // its purchases (buy: each character's bought and suggested more).
    const shops = new Map(), fields = new Map(), unknown = [];
    for (const m of A.mats) {
      if (!m.need && !m.want) continue;
      for (const sh of m.buys) {
        const key = `${sh.who}|${sh.town || sh.note}`;
        if (!shops.has(key)) shops.set(key, { id: `shop:${key}`, kind: 'shop', title: sh.town ? `${sh.who}（${sh.town}）` : sh.who, town: sh.town, items: [] });
        shops.get(key).items.push({ name: m.name, qty: sh.qty, buy: sh, mat: m });
      }
      // a place to gather stays once what is wanted from it is in hand
      if (!gathers(m) && !(m.s.gather && m.need)) continue;
      if (m.s.gather) {
        const g = m.s.src.find((x) => x.kind === 'gather').text;
        if (!fields.has(g)) fields.set(g, { id: `field:${g}`, kind: 'field', title: g, items: [] });
        fields.get(g).items.push({ name: m.name, qty: m.get, mat: m });
      } else unknown.push({ name: m.name, qty: m.get, mat: m });
    }
    out.push(...[...shops.values()].sort((a, b) => townRank(a.town) - townRank(b.town)), ...fields.values());
    if (unknown.length) out.push({ id: 'unknown', kind: 'unknown', title: W.unknown, items: unknown });
    out.forEach((n) => { n.zone = 'out'; });
    // Inside: 暫存區 (a 投料區 for each station), the stations from the raw side, assembly, 訂單. 立即製作 isn't a station
    // of its own: what it makes is put on the first assembly station (or one named after its skill's station) with the
    // rest of the assembly. Every station the wish list's recipes use stays, also when nothing is left for it to make
    // (made ahead, or done): an item it no longer has batches of is added with none. So does every station the dishes'
    // kind of recipe draws on (食材加工設備 for 料理), empty when this week's dishes take nothing from it.
    const kept = new Set(P.steps.map((s) => s.name)), seen = new Set(), more = [];
    const visit = (name) => {
      const r = REC.get(name);
      if (!r || seen.has(name)) return;
      seen.add(name);
      if (!kept.has(name)) more.push({ name, r, need: 0, batches: 0, made: 0, ...stepInfo(name) });
      for (const i of r.inputs) visit(i.item);
    };
    A.rows.forEach((o) => visit(o.dish));
    const lanes = SCH.lanes.map((L) => ({ ...L, steps: [...L.steps, ...more.filter((s) => s.lane === L.name)] }));
    for (const s of more) if (!lanes.some((L) => L.name === s.lane)) lanes.push({ name: s.lane, equip: s.equip, queue: s.queue, steps: more.filter((x) => x.lane === s.lane) });
    // A station doesn't go away for being idle: the 料理 plant (食物製作台 and what feeds it) stays even with nothing on
    // the wish list, and so does the station of every other kind of dish on it.
    const kinds = new Set(['料理', ...A.rows.map((o) => REC.get(o.dish).skill)]);
    for (const k of kinds) {
      const sk = LINE.skills[k];
      if (sk && sk.equip && !lanes.some((L) => L.name === sk.equip)) lanes.push({ name: sk.equip, equip: sk.equip, queue: null, steps: [], asm: sk.secs === 0 });
    }
    for (const r of REC.values()) {
      if (!kinds.has(r.skill)) continue;
      for (const i of r.inputs) {
        const m = REC.get(i.item), x = m && !kinds.has(m.skill) ? stepInfo(i.item) : null;
        if (x && !lanes.some((L) => L.name === x.lane)) lanes.push({ name: x.lane, equip: x.equip, queue: x.queue, steps: [] });
      }
    }
    const instant = lanes.filter((L) => L.steps.length && L.steps.every((s) => s.instant)), extra = instant.flatMap((L) => L.steps);
    const stations = [];
    let asmNode = null;
    for (const L of lanes) {
      if (instant.includes(L)) continue;
      const asm = L.asm || (L.steps.length > 0 && L.steps.every(quick));
      const n = { id: `lane:${L.name}`, kind: asm ? 'assembly' : 'machine', title: L.equip || '設備待補', todo: !L.equip, lane: L, zone: 'in' };
      if (asm && !asmNode) asmNode = n;
      stations.push(n);
    }
    if (extra.length && asmNode) asmNode.lane = { ...asmNode.lane, steps: [...asmNode.lane.steps, ...extra] };
    else if (extra.length) {
      const eq = (LINE.skills[extra[0].r.skill] || {}).equip || W.assembly;
      stations.push({ id: `lane:${eq}`, kind: 'assembly', title: eq, lane: { name: eq, equip: eq, steps: extra }, zone: 'in' });
    }
    const zones = makeZones([...stations.filter((n) => n.kind === 'machine'), ...stations.filter((n) => n.kind === 'assembly')]);
    // 背包 heads 暫存區: the whole stock, and the one place it is typed in
    out.push({ id: 'bag', kind: 'bag', title: '背包', zone: 'in' }, ...zones, ...stations, { id: 'fg', kind: 'fg', title: W.fg, zone: 'in' });
    NODES = out;
    BY = new Map(NODES.map((n) => [n.id, n]));
    PL = queues();
  }

  // 暫存區: a 投料區 for each station (the processing stations first, raw side first, the assembly last). Its outs are
  // what the station makes from it — each made item's batches, or each dish — and its items what the station still
  // takes in: a processing station's batches not started yet, the assembly's dishes not in stock yet. The bag (S.have)
  // is the only stock: it is shared out down the wish list, each line's processing before its dish, and a 投料區 holds
  // what its station's share came to. Each item: need, have (the share), lack, made (an item a station makes, not one
  // to buy or gather), mat. Each out: left (still to do, batches or dishes), can (how many of those the share covers),
  // none (a dish the week can't make any of). cut lists the missing items the shop limits can't cover, on the last
  // 投料區 that takes them. A dish's out also has mats: each of its materials, what it still takes and what its own
  // share of the bag came to.
  function makeZones(stations) {
    const dishSet = new Set(A.rows.map((o) => o.dish)), made = new Set(stations.flatMap((n) => n.lane.steps.map((s) => s.name)));
    const zoneOf = new Map();
    ZONES = stations.map((n) => {
      const z = { id: `zone:${n.lane.name}`, kind: 'warehouse', title: `${n.title}投料區`, station: n, zone: 'in', asm: n.kind === 'assembly', items: [], outs: [] };
      for (const s of n.lane.steps) {
        zoneOf.set(s.name, z);
        if (z.asm ? dishSet.has(s.name) : !quick(s)) z.outs.push({ name: s.name, r: s.r, left: 0, can: 0, none: dishSet.has(s.name) && !P.dishSet.has(s.name) });
      }
      return z;
    });
    // What is still to do, line by line down the wish list: the batches processed or started count for the lines on
    // top first, and so do the dishes in stock.
    const started = new Map(PR.process.map((r) => [r.item, r.done + r.running])), stocked = new Map(PR.assemble.map((r) => [r.item, r.done]));
    const less = (map, k, n) => { const x = Math.min(n, map.get(k) || 0); map.set(k, (map.get(k) || 0) - x); return n - x; };
    const claims = [];
    for (const o of A.rows) {
      if (!o.n) continue;
      const units = less(stocked, o.dish, o.n);
      for (const s of P.steps) {
        const b = o.batches.get(s.name) || 0;
        if (!b || s.name === o.dish) continue;
        const left = quick(s) ? (units ? b : 0) : less(started, s.name, b);
        if (left) claims.push({ z: zoneOf.get(s.name), name: s.name, r: s.r, n: left, out: left });
      }
      const r = REC.get(o.dish);
      if (units) claims.push({ z: zoneOf.get(o.dish), name: o.dish, r, n: Math.ceil(units / yieldOf(r)), out: units });
    }
    // The bag shared out in that order.
    const bag = new Map();
    for (const c of claims) {
      if (!c.z) continue;
      for (const i of c.r.inputs) {
        if (!bag.has(i.item)) bag.set(i.item, held(i.item));
        const want = i.qty * c.n, got = Math.min(want, bag.get(i.item));
        bag.set(i.item, bag.get(i.item) - got);
        let it = c.z.items.find((x) => x.name === i.item);
        if (!it) c.z.items.push(it = { name: i.item, need: 0, have: 0, made: made.has(i.item), mat: A.mats.find((m) => m.name === i.item) });
        it.need += want;
        it.have += got;
        const o = c.z.asm && c.z.outs.find((x) => x.name === c.name);
        if (o) {
          const m = (o.mats || (o.mats = new Map())).get(i.item) || { need: 0, have: 0 };
          m.need += want;
          m.have += got;
          o.mats.set(i.item, m);
        }
      }
    }
    // How many of each out its 投料區's share covers, in the same order.
    for (const z of ZONES) {
      const pool = new Map(z.items.map((i) => [i.name, i.have]));
      for (const c of claims) {
        if (c.z !== z) continue;
        const k = Math.min(c.n, ...c.r.inputs.map((i) => Math.floor((pool.get(i.item) || 0) / i.qty)));
        for (const i of c.r.inputs) pool.set(i.item, pool.get(i.item) - k * i.qty);
        const o = z.outs.find((x) => x.name === c.name);
        if (o) { o.left += c.out; o.can += z.asm ? Math.min(c.out, k * yieldOf(c.r)) : k; }
      }
      for (const i of z.items) i.lack = i.need - i.have;
    }
    for (const z of ZONES) z.cut = new Set(z.items.filter((i) => i.lack && i.mat && i.mat.short && takers(i.name).pop() === z).map((i) => i.name));
    return ZONES;
  }
  const takers = (name) => ZONES.filter((z) => z.items.some((i) => i.name === name));
  // A 投料區's share of an item.
  const stockIn = (z, name) => { const i = z.items.find((x) => x.name === name); return i ? i.have : 0; };
  // The 投料區 an item's shortage lands on (the last that takes it), else the first.
  const zoneFor = (name) => { const z = takers(name).pop() || ZONES[0]; return z ? z.id : ''; };
  // What keeps an out from being made in full: the made items still to come (等…) and the materials short, the
  // 投料區's share against its need.
  function missText(z, o) {
    const miss = z.items.filter((i) => i.lack > 0 && o.r.inputs.some((x) => x.item === i.name));
    const wait = miss.filter((i) => i.made).map((i) => i.name);
    return [wait.length ? `等${wait.join('、')}` : '', ...miss.filter((i) => !i.made).map((i) => `${i.name} ${fmt(i.have)}／${fmt(i.need)}`)].filter(Boolean).join('・');
  }
  // An out with nothing left to put in: made, or still in the station.
  const outDone = (z, o) => { const r = !z.asm && PR.process.find((x) => x.item === o.name); return r && r.done < r.plan ? '✓ 都投料了' : '✓ 完成'; };
  // 背包: everything the stock holds or the week takes, in three groups — the raw materials the week takes, the made
  // items its stations make, and anything else still in the bag (left over from other weeks or other dishes).
  function bagGroups() {
    const dishSet = new Set(A.rows.map((o) => o.dish));
    const raw = A.mats.filter((m) => m.need || m.short).map((m) => m.name);
    const made = [...new Set(ZONES.flatMap((z) => z.station.lane.steps.map((s) => s.name)))].filter((name) => !dishSet.has(name));
    const known = new Set([...raw, ...made]);
    return { raw, made, other: Object.keys(S.have).filter((name) => held(name) && !known.has(name)) };
  }
  // An item in the bag: its share in each 投料區 that still takes it, what they need, miss and what is over.
  function bagSplit(name) {
    const zs = ZONES.map((z) => [z, z.items.find((i) => i.name === name)]).filter(([, i]) => i);
    return {
      used: zs.length > 0, parts: zs.map(([z, i]) => `${z.station.title} ${fmt(i.have)}`), need: zs.reduce((t, [, i]) => t + i.need, 0),
      lack: zs.reduce((t, [, i]) => t + i.lack, 0), over: held(name) - zs.reduce((t, [, i]) => t + i.have, 0),
    };
  }
  // Where a missing material comes from, as a link to that point: the station that makes it (with the batches it still
  // has to make), a shop with some left this week, the place to gather it, or 來源待補; a shop-only one every shop has
  // sold out of says so.
  function whereFrom(item) {
    const go = (id, text) => `<button class="link" type="button" data-go="${esc(id)}">→ ${esc(text)}</button>`;
    const m = A.mats.find((x) => x.name === item);
    if (!m) {
      if (!REC.has(item)) return '';
      const lane = stepInfo(item).lane, r = PR.process.find((x) => x.item === item), left = r ? Math.max(0, r.plan - r.done - r.running) : 0;
      return go(`lane:${lane}`, `${lane}${left ? `（還要做 ${fmt(left)} 批）` : ''}`);
    }
    const sh = m.buys.find((x) => x.per.length * SHOP.limit > x.bought);
    if (sh) return go(`shop:${sh.who}|${sh.town || sh.note}`, `${sh.who} 還能買 ${fmt(sh.per.length * SHOP.limit - sh.bought)}`);
    if (m.s.gather) { const g = m.s.src.find((x) => x.kind === 'gather').text; return go(`field:${g}`, g); }
    if (m.s.unknown) return go('unknown', '來源待補');
    return m.buys.length ? '<span class="bad-text">商店已售完</span>' : '';
  }
  // Where the stock is typed in, for the notes that point there.
  const BAG_LINK = '<button class="link" type="button" data-go="bag">背包</button>';

  /* ---------- stations' queues ---------- */
  // Clock times in this browser's time zone: 14:05, 明天 01:20, 10/28 09:00.
  const hm = (ms) => {
    const d = new Date(ms), day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(d) - day(new Date())) / 864e5), t = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    return diff === 0 ? t : diff === 1 ? `明天 ${t}` : diff === -1 ? `昨天 ${t}` : `${d.getMonth() + 1}/${d.getDate()} ${t}`;
  };
  const secsOf = (name) => { const s = P.steps.find((x) => x.name === name); return s ? s.secs : null; };
  // Every station from now: its places (`queue` of them, see slotsOf) and the batches still to put in (seq) — in the
  // order chosen, the rest raw side first. Until the places are first used this week they hold the first batches,
  // waiting for 開工 (stored false). A place's state: wait (等開工), queue (started, behind another), run, done (its time
  // is up, or isn't known). short is what the station's 投料區 lacks for the waiting batches; end is when everything
  // would be made, one batch after another (null when a time isn't known).
  function queues() {
    const now = Date.now(), out = new Map();
    for (const n of NODES) {
      if (n.kind !== 'machine') continue;
      const L = n.lane, steps = L.steps.filter((x) => !quick(x)), size = Math.max(1, L.queue || 1), stored = slotsOf(L.name);
      const left = new Map(steps.map((x) => [x.name, Math.max(0, x.batches - (Math.floor(Number(S.done.processed[x.name])) || 0))]));
      const take = (name) => { if (!(left.get(name) > 0)) return false; left.set(name, left.get(name) - 1); return true; };
      // a started batch is real; a waiting one the plan no longer wants drops out; the batches fill from the top
      const places = Array.from({ length: size }, (_, k) => (stored && stored[k]) || null);
      for (const x of places) if (x && x.at != null) take(x.name);
      places.forEach((x, k) => { if (x && x.at == null && !take(x.name)) places[k] = null; });
      const filled = places.filter(Boolean);
      places.splice(0, size, ...filled, ...Array(size - filled.length).fill(null));
      const seq = [];
      for (const name of (S.done.proc[L.name] || {}).order || []) if (take(name)) seq.push(name);
      for (const x of steps) while (take(x.name)) seq.push(x.name);
      if (!stored) for (let k = 0; k < size && seq.length; k++) places[k] = { name: seq.shift(), at: null };
      const slots = places.map((x, k) => {
        if (!x) return null;
        if (x.at == null) return { k, name: x.name, state: 'wait' };
        const secs = secsOf(x.name), end = secs == null ? null : x.at + secs * 1000;
        return { k, name: x.name, end, state: end == null || end <= now ? 'done' : x.at <= now ? 'run' : 'queue' };
      });
      // against what this station's 投料區 holds
      const need = new Map(), z = ZONES.find((x) => x.station === n), have = (item) => (z ? stockIn(z, item) : held(item));
      for (const s of slots) if (s && s.state === 'wait') for (const i of REC.get(s.name).inputs) need.set(i.item, (need.get(i.item) || 0) + i.qty);
      const short = [...need].filter(([item, qty]) => have(item) < qty).map(([item, qty]) => ({ item, lack: qty - have(item) }));
      let end = Math.max(now, ...slots.filter((s) => s && s.end != null).map((s) => s.end));
      let known = slots.every((s) => !s || s.state === 'wait' || s.end != null);
      for (const name of [...slots.filter((s) => s && s.state === 'wait').map((s) => s.name), ...seq]) { const x = secsOf(name); if (x == null) known = false; else end += x * 1000; }
      out.set(L.name, { node: n, lane: L, size, stored: !!stored, places, slots, seq, short, end: known ? end : null, busy: slots.some(Boolean) || seq.length > 0 });
    }
    return out;
  }
  // The stations together: when everything is made (null when a time isn't known).
  function procSummary() {
    const ends = [...PL.values()].filter((q) => q.busy).map((q) => q.end);
    return { busy: ends.length > 0, finish: ends.length && ends.every((x) => x != null) ? Math.max(...ends) : null };
  }

  /* ---------- statuses ---------- */
  const VERB = { processed: '已完成', assembled: '已組裝' };
  // The progress lines a point answers for.
  function rowsOf(n) {
    if (n.kind === 'shop') return PR.buy.filter((r) => `shop:${r.shop.who}|${r.shop.town || r.shop.note}` === n.id);
    if (n.kind === 'field' || n.kind === 'unknown') return PR.gather.filter((r) => n.items.some((i) => i.name === r.item));
    if (n.kind === 'machine') return PR.process.filter((r) => r.step.lane === n.lane.name);
    if (n.kind === 'assembly' || n.kind === 'fg') return PR.assemble;
    return [];
  }
  const tally = (rows) => [rows.reduce((t, r) => t + Math.min(r.done, r.plan), 0), rows.reduce((t, r) => t + r.plan, 0)];
  // [colour key, short text] for a point: red for a shortage or missing data, otherwise how far this week's actuals
  // have got — grey not started, yellow under way or ready to do, green done.
  // Andon lights: ok (green) 運行 — running, or a 投料區 with everything in hand to run; wait (yellow) 要處理 — stopped
  // until someone acts (可開工, 可組裝); bad (red) 異常; idle (grey) 無使用 — not in use, which takes in what is done (✓) as well.
  function statusOf(n) {
    // 背包: how many of the things the week still takes it is short of.
    if (n.kind === 'bag') {
      const g = bagGroups(), use = [...g.raw, ...g.made].filter((name) => bagSplit(name).used), short = use.filter((name) => bagSplit(name).lack > 0).length;
      if (!use.length) return ['idle', '沒有要用的料'];
      return short ? ['wait', `還缺 ${fmt(short)} 樣`] : ['ok', '這週的料都有'];
    }
    // A shop: every character's limit used up means it has nothing left to sell this week, 已售完 — not a job done.
    if (n.kind === 'shop') {
      const per = n.items.flatMap((i) => i.buy.per), B = per.reduce((t, x) => t + x.bought, 0), L = per.length * SHOP.limit;
      if (n.items.some((i) => i.mat.short)) return ['bad', B >= L ? '已售完仍缺' : '異常'];
      return B >= L ? ['idle', '已售完'] : B ? ['wait', '買了一些'] : ['idle', '還沒買'];
    }
    // Gathering: what the stock still lacks after the shops' share.
    if (n.kind === 'field' || n.kind === 'unknown') {
      const left = n.items.reduce((t, i) => t + i.mat.get, 0);
      if (!left) return ['idle', n.kind === 'field' ? '✓ 已採齊' : '✓ 已取得'];
      if (n.kind === 'unknown') return ['bad', '來源待補'];
      return ['wait', `還要採 ${fmt(left)}`];
    }
    if (n.kind === 'machine' && n.lane.steps.some((s) => s.secs == null)) return ['bad', '時間待補'];
    // A station: running only while a batch is under way; a batch to collect (領料) or waiting for 開工 (and whether the
    // 投料區 has what they take) needs someone.
    if (n.kind === 'machine') {
      const q = PL.get(n.lane.name), has = (st) => q.slots.some((s) => s && s.state === st);
      if (!q || !q.busy) return ['idle', rowsOf(n).length ? '✓ 加工完成' : '這週不用加工'];
      if (has('run') || has('queue')) return ['ok', '做中'];
      if (has('done')) return ['wait', '可領料'];
      if (has('wait')) return ['wait', q.short.length ? '等料' : '可開工'];
      return ['idle', '設備空著'];
    }
    // A 投料區: how much of what its station still has to do its share of the bag covers — all of it at once, some, or
    // none yet, told as how many batches (dishes) can be made of how many still to do; 缺料 when a missing item is one
    // the shop limits can't cover, or a dish can't be made at all this week.
    if (n.kind === 'warehouse') {
      const left = n.outs.reduce((t, o) => t + o.left, 0), can = n.outs.reduce((t, o) => t + o.can, 0), none = n.outs.some((o) => o.none);
      if (!n.outs.length) return ['idle', '不用備料'];
      if (!left && !none) return ['idle', '✓ 完成'];
      if (n.cut.size || none) return ['bad', '缺料'];
      if (n.outs.every((o) => o.can >= o.left)) return ['ok', n.asm ? '全部可以一次製作' : '全部可以一次加工'];
      return [can ? 'ok' : 'idle', n.asm ? `可以製作 ${fmt(can)}／${fmt(left)} 份` : `可以加工 ${fmt(can)}／${fmt(left)} 批`];
    }
    // 訂單: how many of the dishes are done
    if (n.kind === 'fg') {
      const all = PR.assemble.length, done = PR.assemble.filter((r) => r.done >= r.plan).length;
      if (!all) return ['idle', '沒有訂單'];
      return done >= all ? ['idle', '✓ 全部完成'] : [done ? 'ok' : 'idle', `完成 ${fmt(done)}／${fmt(all)} 道`];
    }
    // A food station: as soon as one dish not done yet has all its materials (the card's ✓ 可以組裝), 可組裝 — yellow,
    // someone has to go and make it.
    if (n.kind === 'assembly') {
      const z = ZONES.find((x) => x.station === n);
      if (z && z.outs.some((o) => o.left && o.can >= o.left)) return ['wait', '可組裝'];
    }
    const rows = rowsOf(n);
    if (!rows.length) return ['idle', n.kind === 'assembly' ? '沒有訂單' : '—'];
    const [d, p] = tally(rows);
    if (d >= p) return ['idle', `✓ ${{ machine: '加工完成', assembly: '組裝完成' }[n.kind] || `完成 ${fmt(d)}`}`];
    if (d > 0) return ['ok', `${VERB[rows[0].kind]} ${fmt(d)}／${fmt(p)}`];
    if (n.kind === 'assembly') return PR.assemble.every((r) => r.ready) ? ['wait', '可組裝'] : PR.process.some((p) => p.done < p.plan) ? ['idle', '等加工'] : ['wait', '等料'];
    return ['idle', '未開始'];
  }

  /* ---------- rows: one kind for the board's cards, the card that opens and the tables ---------- */
  // A row is a name on the left and a number on the right. One with a done and a need reads 「done／need unit」 — done
  // first, a full-width slash, the unit last (materials have none) — with a thin bar under it: slate while under way,
  // green with ✓ once met, red for a material the week is short of (異常). A row that only knows what is left
  // (還要採 N) has no bar.
  const LIGHT = '<span class="light" aria-hidden="true"><i></i><i></i><i></i></span>';
  const barOf = (f) => `<span class="m-bar" aria-hidden="true"><i style="width:${Math.round(Math.max(0, Math.min(1, f)) * 100)}%"></i></span>`;
  const rowHTML = (tag, label, value, { cls = '', f = null, sub = '' } = {}) => `<${tag} class="m${cls ? ` ${cls}` : ''}">${label == null ? '' : `<span class="m-l">${label}</span>`}<span class="m-v">${value}</span>${f == null ? '' : barOf(f)}${sub ? `<span class="m-sub">${sub}</span>` : ''}</${tag}>`;
  const meterHTML = (tag, label, done, need, { unit = '', short = false, sub = '', cls = '' } = {}) => {
    const met = done >= need;
    return rowHTML(tag, label, `${met ? '✓ ' : ''}${fmt(done)}／${fmt(need)}${unit ? ` ${unit}` : ''}`,
      { cls: [cls, met ? 'met' : short ? 'short' : ''].filter(Boolean).join(' '), f: need ? done / need : 1, sub });
  };
  const rowsHTML = (list) => (list.length ? `<ul class="rows">${list.join('')}</ul>` : '');
  const sec = (title, meta, inner, cls = '') => `<section class="sec${cls ? ` ${cls}` : ''}">${title ? `<h3 class="sec-h"><span>${title}</span>${meta ? `<span class="meta">${meta}</span>` : ''}</h3>` : ''}${inner}</section>`;
  const subh = (title) => `<h4 class="sub-h">${title}</h4>`;
  // A food station's dishes, in wish list order.
  const dishOuts = (n) => {
    const z = ZONES.find((x) => x.station === n), at = (name) => A.rows.findIndex((o) => o.dish === name);
    return z ? z.outs.slice().sort((a, b) => at(a.name) - at(b.name)) : [];
  };
  // A station's places by what they are doing: 做好 (to collect) and 等開工 yellow, 做中 green, 排隊 a fainter green.
  const SLOT_CLS = { wait: 'wait', queue: 'ok queued', run: 'ok', done: 'wait' };

  /* ---------- the board: every point as a card, one column per stage ---------- */
  const STAGES = [['out', W.outside], ['warehouse', W.warehouse], ['machine', '加工'], ['assembly', '組裝'], ['fg', W.fg]];
  const stageOf = (n) => (n.zone === 'out' ? 'out' : n.kind === 'bag' ? 'warehouse' : n.kind);

  // The few rows that say what a point needs this week and how far it has got, under a small line naming its numbers;
  // the card that opens has the rest.
  function blockLines(n) {
    const head = (title) => `<span class="m-head">${title}</span>`;
    const cl = (label, v, o) => rowHTML('span', esc(label), v, o), cm = (label, done, need, o) => meterHTML('span', esc(label), done, need, o);
    // a shop: what has been bought of what the week wants from it
    if (n.kind === 'shop') {
      return head('已買／要買') + n.items.map((i) => (i.buy.bought + i.buy.qty
        ? cm(i.name, i.buy.bought, i.buy.bought + i.buy.qty, { short: !!i.mat.short }) : cl(i.name, '不用買', { cls: 'none' }))).join('');
    }
    // gathering: only what is still to get (nothing to count it against but the stock)
    if (n.kind === 'field' || n.kind === 'unknown') {
      return n.items.map((i) => (i.mat.get ? cl(i.name, `${n.kind === 'field' ? '還要採' : '還要拿'} ${fmt(i.mat.get)}`) : cl(i.name, '✓ 齊了', { cls: 'met' }))).join('');
    }
    // 背包: of the kinds the week takes, how many it holds in full (what it holds that the week doesn't take is in the foot)
    if (n.kind === 'bag') {
      const g = bagGroups(), use = [...g.raw, ...g.made].filter((name) => bagSplit(name).used);
      return use.length ? head('齊了／要用') + cm('這週的料', use.filter((name) => !bagSplit(name).lack).length, use.length, { unit: '樣' }) : cl('沒有要用的料', '', { cls: 'none' });
    }
    // a 投料區: each material, its share of the bag against what its station still takes — raw materials, a dashed
    // line, then made items (what each made item or dish still misses is in the card that opens)
    if (n.kind === 'warehouse') {
      const ln = (i) => cm(i.name, i.have, i.need, { short: n.cut.has(i.name) });
      const raw = n.items.filter((i) => !i.made).map(ln).join(''), made = n.items.filter((i) => i.made).map(ln).join('');
      return raw || made ? head('現有／需要') + [raw, made].filter(Boolean).join('<span class="cut" aria-hidden="true"></span>') : cl('不用備料', '', { cls: 'none' });
    }
    // a station: each made item's batches, then its places as small lights
    if (n.kind === 'machine') {
      const q = PL.get(n.lane.name), rows = rowsOf(n);
      return (rows.length ? head('做好／要做') + rows.map((x) => cm(x.item, x.done, x.plan, { unit: '批' })).join('') : '')
        + (q ? `<span class="strip" style="grid-template-columns:repeat(${q.size},minmax(0,1fr))" aria-hidden="true">${q.slots.map((s, k) => (s
          ? `<i class="${SLOT_CLS[s.state]}" title="${k + 1} ${esc(s.name)}・${esc(placeNote(s))}"></i>` : '<i class="empty"></i>')).join('')}</span>` : '');
    }
    // assembly: each dish on its own, wish list order — how many of its materials its own share of the bag covers in
    // full, until they all are (✓ 可以組裝) or it is marked done (✓ 完成)
    if (n.kind === 'assembly') {
      const outs = dishOuts(n);
      if (!outs.length) return cl('沒有要組裝的', '', { cls: 'none' });
      return head('備齊／材料') + outs.map((o) => {
        if (o.none) return cl(o.name, '這週做不了', { cls: 'short', f: 0 });
        if (!o.left) return cl(o.name, '✓ 完成', { cls: 'met', f: 1 });
        if (o.can >= o.left) return cl(o.name, '✓ 可以組裝', { cls: 'met', f: 1 });
        const mats = [...(o.mats || new Map()).values()];
        return cm(o.name, mats.filter((m) => m.have >= m.need).length, mats.length, { unit: '樣' });
      }).join('');
    }
    // 訂單: each dish (a dish ordered twice as one), how many are done of how many are ordered — one the week can't
    // make in full is done (✓) once what it can make is
    const ordered = new Map();
    for (const o of A.rows) ordered.set(o.dish, (ordered.get(o.dish) || 0) + o.qty);
    if (!ordered.size) return cl('沒有訂單', '', { cls: 'none' });
    return head('完成／訂單') + [...ordered].map(([name, qty]) => {
      const r = PR.assemble.find((x) => x.item === name);
      if (!r) return cl(name, `做不了・0／${fmt(qty)} 份`, { cls: 'short', f: 0 });
      const done = Math.min(r.done, qty);
      return r.done >= r.plan ? cl(name, `✓ ${fmt(done)}／${fmt(qty)} 份`, { cls: 'met', f: qty ? done / qty : 1 }) : cm(name, done, qty, { unit: '份' });
    }).join('');
  }
  // A card's foot: what 背包 holds that the week doesn't take; a station's places and what is still to put in.
  function blockFoot(n) {
    if (n.kind === 'bag') { const k = bagGroups().other.length; return k ? `用不到 ${fmt(k)} 樣` : ''; }
    if (n.kind !== 'machine') return '';
    const L = n.lane, q = PL.get(L.name);
    return (!q || !q.busy ? (rowsOf(n).length ? '都做好了' : '沒有要排的了') : `設備 ${q.slots.filter(Boolean).length}／${q.size} 格・排程還有 ${q.seq.length} 批`)
      + (L.queue == null ? '・排程上限待補' : '');
  }
  function blocksHTML() {
    return `<div class="board">${STAGES.map(([key, title]) => {
      const list = NODES.filter((n) => stageOf(n) === key);
      // 廠外 keeps its column when there is nothing to buy or gather, so the board doesn't shift
      if (!list.length && key !== 'out') return '';
      return `<section class="stage s-${key}"><h3>${esc(title)}</h3><div class="cards">${list.map((n) => {
        const [k, text] = statusOf(n), foot = blockFoot(n);
        return `<button class="c ${k}" type="button" data-go="${esc(n.id)}">
          <span class="c-head">${LIGHT}<b class="c-name">${esc(n.title)}</b><span class="c-state">${esc(text)}</span></span>
          <span class="c-body">${blockLines(n)}</span>${foot ? `<span class="foot">${esc(foot)}</span>` : ''}</button>`;
      }).join('') || '<p class="note0">沒有要買或採的</p>'}</div></section>`;
    }).join('')}</div>`;
  }

  /* ---------- the card that opens over the board ---------- */
  // The same head as the board's card (its kind above the name), the point's details in the middle, and a foot that
  // stays put: along the material flow to the point before and after on the left, the card's own action on the right.
  // The flow: 背包, each processing station's 投料區 and the station, the food station's 投料區 and the station, 訂單; a
  // supplier outside the fence leads to 背包.
  function flowOf(n) {
    if (n.zone === 'out') return { next: 'bag' };
    const line = ['bag', ...ZONES.flatMap((z) => [z.id, z.station.id]), 'fg'].filter((id) => BY.has(id)), k = line.indexOf(n.id);
    return k < 0 ? {} : { prev: line[k - 1], next: line[k + 1] };
  }
  function cardHTML(n, body, { act = '', wide = false } = {}) {
    const [k, text] = statusOf(n), { prev, next } = flowOf(n);
    const step = (id, label) => `<button class="btn ghost" type="button" data-go="${esc(id)}">${label}</button>`;
    const nav = (prev ? step(prev, `← ${esc(BY.get(prev).title)}`) : '') + (next ? step(next, `${esc(BY.get(next).title)} →`) : '');
    return `<div class="mc ${k}"><div class="mc-head"><div class="mc-top"><span class="mc-kind">${esc(KIND[n.kind] || '')}</span>
        <button class="mc-x" type="button" data-close aria-label="關閉">✕</button></div>
        <div class="c-head">${LIGHT}<b class="c-name" id="mc-title">${esc(n.title)}</b><span class="c-state">${esc(text)}</span></div></div>
      <div class="mc-body${wide ? ' cols' : ''}">${body}</div>
      ${nav || act ? `<div class="mc-foot"><span class="mc-nav">${nav}</span><span class="mc-act">${act}</span></div>` : ''}</div>`;
  }

  // Ways out of a shortage of a shop-only material, worked out from the numbers.
  function remedies(m) {
    const perChar = m.s.shops.length * SHOP.limit, toBuy = Math.max(0, m.want - m.base), tips = [];
    const need = chars() + Math.ceil(m.short / perChar);
    if (chars() < MAX_CHARS) tips.push(need <= MAX_CHARS ? `加到 ${need} 隻角色去買就夠（每多一隻，${m.name}本週多 ${fmt(perChar)} 個）。` : `角色加到上限 ${MAX_CHARS} 隻也還缺 ${fmt(m.short - (MAX_CHARS - chars()) * perChar)}。`);
    tips.push(`分週做：照現在 ${chars()} 隻角色，要 ${Math.ceil(toBuy / (perChar * chars()))} 週才買得齊；這週先做上限，剩的下週再排。`);
    tips.push('到訂單按「編輯訂單」，把數量改成上限，或把比較要緊的料理往上移，讓它先分到。');
    const other = m.s.src.filter((x) => x.kind === 'barter' || x.kind === 'loot');
    if (other.length) tips.push(`還有其他來源沒算進去：${other.map(sourceText).join('、')}。`);
    tips.push('手上有的話，到背包填「現有庫存」。');
    return tips;
  }
  function shortageHTML(m) {
    const cut = A.rows.filter((o) => o.n < o.qty && o.stuck.includes(m.name));
    return sec(`異常・${esc(m.name)}原物料不足`, '', `<dl class="kv">
        <dt>訂單要</dt><dd>${fmt(m.want)}</dd>
        <dt>本週最多</dt><dd>${fmt(m.s.cap)}（現有 ${fmt(m.base)} ＋ 還能買 ${fmt(m.s.buyCap)}：${esc(m.s.shops.map((x) => x.who).join('＋'))}，每家每隻 ${SHOP.limit} 個 × ${chars()} 隻）</dd>
        <dt>缺</dt><dd class="bad-text">${fmt(m.short)}</dd>
      </dl>
      ${cut.length ? subh('影響') + rowsHTML(cut.map((o) => meterHTML('li', nameHTML(o.dish), o.n, o.qty, { unit: '份', short: true, sub: `可以做／想做：這週只做得出 ${fmt(o.n)} 份` }))) : ''}
      ${subh('可以怎麼做')}<ul class="tips">${remedies(m).map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`, 'alert bad');
  }

  // A 投料區: what its station makes and how many of those its share covers, then each material — its share of the bag
  // against what the station still takes. The stock itself is typed in on 背包's 填現有庫存.
  function storeHTML(n) {
    const unit = n.asm ? '份' : '批', verb = n.asm ? '製作' : '加工';
    const outs = n.outs.map((o) => {
      if (o.none) return rowHTML('li', nameHTML(o.name), '這週做不了', { cls: 'short' });
      if (!o.left) return rowHTML('li', nameHTML(o.name), outDone(n, o), { cls: 'met' });
      return meterHTML('li', nameHTML(o.name), o.can, o.left, { unit, sub: o.can < o.left ? esc(missText(n, o)) : '' });
    });
    // an item another 投料區 takes too gets a small 共用 tag (how it is split is in its title and on 背包)
    const tag = (i) => (takers(i.name).length > 1 ? `<span class="tag" title="背包 ${fmt(held(i.name))}，別區也要用，照需求清單順序這區分到 ${fmt(i.have)}">共用</span>` : '');
    const mat = (i) => {
      const cut = n.cut.has(i.name), lack = i.lack > 0 ? `還缺 ${fmt(i.lack)}` : '';
      return meterHTML('li', nameHTML(i.name) + tag(i), i.have, i.need, { short: cut, sub: cut && lack ? `<span class="bad-text">${lack}</span>` : lack });
    };
    const list = (title, items) => (items.length ? subh(title) + rowsHTML(items.map(mat)) : '');
    const mats = list('原料', n.items.filter((i) => !i.made)) + list('加工品', n.items.filter((i) => i.made));
    return sec(n.asm ? '料理' : '加工品', n.outs.length ? `可以${verb}／還要做` : '', n.outs.length ? rowsHTML(outs) : `<p class="note0">這週不用${verb}，不用備料。</p>`)
      + (mats ? sec('要投的料', '現有／需要', `${mats}<p class="note">數量照背包算；要改，到${BAG_LINK}填現有庫存。</p>`) : '');
  }
  // 背包: everything in the bag — what the week takes, each against what the 投料區 need, with its share in each, what is
  // short and what is over — then what the week doesn't take. 填現有庫存 (in the foot) is the one place it is typed in.
  function bagHTML() {
    const g = bagGroups();
    const item = (name) => {
      const b = bagSplit(name), m = A.mats.find((x) => x.name === name), short = !!(m && m.short);
      if (!b.used) return rowHTML('li', nameHTML(name), fmt(held(name)), { sub: '這週不用再投' });
      const lack = b.lack ? (short ? `<span class="bad-text">還缺 ${fmt(b.lack)}</span>` : `還缺 ${fmt(b.lack)}`) : '';
      return meterHTML('li', nameHTML(name), held(name), b.need, { short, sub: [`分給 ${esc(b.parts.join('・'))}`, lack, b.over > 0 ? `多 ${fmt(b.over)}` : ''].filter(Boolean).join('・') });
    };
    const list = (title, names) => (names.length ? subh(title) + rowsHTML(names.map(item)) : '');
    const other = g.other.map((name) => rowHTML('li', nameHTML(name), fmt(held(name))));
    return sec('這週要用', '現有／需要', `${list('原料', g.raw) + list('加工品', g.made) || '<p class="note0">需求清單還沒有要用的料。</p>'}
        <p class="note">照遊戲背包現在的數量填，買了東西、做完料理都要來這裡改。只有加工設備的開工和領料會自動加減。</p>`)
      + (other.length ? sec('這週用不到', `${fmt(other.length)} 樣`, `${rowsHTML(other)}<p class="note">之前留下來的。不需要的話，在「填現有庫存」填 0 清掉。</p>`) : '');
  }
  // A shop: each item, what has been bought of what the week wants from it, with the limit and what can still be bought
  // under it; 填已購買 (in the foot) opens the form.
  function shopHTML(n) {
    const rows = n.items.map((i) => {
      const L = i.buy.per.length * SHOP.limit, want = i.buy.bought + i.buy.qty, left = L - i.buy.bought;
      const sub = [`上限 ${fmt(L)}（${fmt(i.buy.per.length)} 隻角色 × ${SHOP.limit}）`, left ? `還能買 ${fmt(left)}` : '已售完',
        i.mat.short ? `<span class="bad-text">這週還缺 ${fmt(i.mat.short)}</span>・<button class="link" type="button" data-go="${esc(zoneFor(i.name))}">看對策</button>` : ''].filter(Boolean).join('・');
      return want ? meterHTML('li', nameHTML(i.name), i.buy.bought, want, { short: !!i.mat.short, sub }) : rowHTML('li', nameHTML(i.name), '不用買', { cls: 'none', sub });
    });
    return sec('這週的額度', '已買／要買', `${rowsHTML(rows)}<p class="note">這裡只記商店額度，背包請另外更新。</p>`);
  }

  // A station: 設備, its places — empty, 等開工 (with each batch's time), 排隊 or 做中 (with when it is made), or 做好了
  // with 領料; any not finished can be taken back out (✕), and with the lock open (測試) finished at once (直接完成) —
  // then 排程, the batches still to put in, dragged by ⠿ into another order or into an empty place, or put in with 加入
  // (no times there), and 已完成, the week's 領料 (退回 puts one back). 開工 sits in the foot.
  let testing = false;
  function placeNote(s) {
    if (s.state === 'wait') { const x = secsOf(s.name); return `等開工・${x == null ? '時間待補' : `每批 ${fmtDur(x)}`}`; }
    if (s.end == null) return `${s.state === 'done' ? '做好了' : s.state === 'run' ? '做中' : '排隊'}・時間待補`;
    return s.state === 'done' ? `${hm(s.end)} 做好` : `${s.state === 'run' ? '做中' : '排隊'}・${hm(s.end)} 做好`;
  }
  function stationHTML(n) {
    const L = n.lane, q = PL.get(L.name), lane = esc(L.name), empty = q.slots.some((s) => !s);
    const places = q.slots.map((s, k) => (!s
      ? `<div class="slot place empty" data-place="${k}" data-lane="${lane}"><span class="no">${k + 1}</span><span class="what">空</span></div>`
      : `<div class="slot place ${SLOT_CLS[s.state]}"><span class="no">${k + 1}</span><span class="what">${nameHTML(s.name)}<small>${esc(placeNote(s))}</small></span>
        <span class="mv">${s.state === 'done' ? `<button class="btn primary small" type="button" data-collect="${lane}|${k}">領料</button>`
          : `${testing ? `<button class="btn small" type="button" data-finish="${lane}|${k}">直接完成</button>` : ''}<button class="btn small" type="button" data-unslot="${lane}|${k}" aria-label="取消${esc(s.name)}，原料退回">✕</button>`}</span></div>`)).join('');
    const lock = `<button class="btn small" type="button" data-testlock aria-pressed="${testing}" title="打開後設備裡的批數可以直接完成，測試用">${testing ? '🔓 測試' : '🔒'}</button>`;
    const seq = q.seq.map((name, i) => `<div class="slot seq" data-slot="${i}" data-lane="${lane}">
        <span class="grip" title="拖拉換順序" aria-hidden="true">⠿</span><span class="no">${i + 1}</span><span class="what">${nameHTML(name)}</span>
        <span class="mv"><button class="btn small" type="button" data-place-in="${lane}|${i}"${empty ? '' : ' disabled'}>加入</button></span></div>`).join('');
    const log = logOf(L.name).map((e, i) => [e, i]).reverse().map(([e, i]) => rowHTML('li', `${nameHTML(e.name)} ×${fmt(yieldOf(REC.get(e.name)))}<small>・${esc(hm(e.done))} 領料${e.test ? '・測試' : ''}</small>`,
      `<button class="btn small" type="button" data-unlog="${lane}|${i}">退回</button>`, { cls: 'act' })).join('');
    const done = rowsHTML(rowsOf(n).map((r) => meterHTML('li', nameHTML(r.item), r.done, r.plan, { unit: '批' })));
    return `<div class="col">${sec('設備', `${q.slots.filter(Boolean).length}／${q.size} 格${L.queue == null ? '・上限待補，先當 1 格' : ''} ${lock}`, `<div class="slots list5" data-keep="places">${places}</div>`)}</div>
      <div class="col">${sec('排程', `還有 ${fmt(q.seq.length)} 批`, `${seq ? `<div class="slots list5" data-keep="seq">${seq}</div>` : '<p class="note0">沒有要排的了。</p>'}${q.seq.length ? '<p class="note">拖 ⠿ 換順序，或拖進設備的空格。</p>' : ''}`, 'grow')}
        ${sec('已完成', '做好／要做', `${done}${log ? `<ul class="rows list5" data-keep="log">${log}</ul>` : ''}`, 'grow')}</div>`;
  }
  // 開工 and the line next to it are always there, greyed out while no batch waits, so the card doesn't move.
  function startHTML(q) {
    const waiting = q.slots.some((s) => s && s.state === 'wait');
    const note = !waiting ? '設備裡有等開工的批數才能按'
      : q.short.length ? `<span class="bad-text">料不夠：${esc(q.short.map((x) => `${x.item} 差 ${fmt(x.lack)}`).join('、'))}</span>` : '料都夠，按下去就從現在開始算';
    return `<span class="note">${note}</span><button class="btn primary" type="button" data-start="${esc(q.lane.name)}"${waiting ? '' : ' disabled'}>開工</button>`;
  }

  // A food station: each dish (wish list order) — how many are ordered, how many of its materials are in hand and what
  // one portion takes — and under it each material still missing, with where to get it. 完成 stays on 訂單.
  function asmHTML(n) {
    const outs = dishOuts(n);
    if (!outs.length) return sec('', '', '<p class="note0">需求清單是空的，這週沒有要組裝的。到「訂單」按「編輯訂單」增加訂單。</p>');
    const rows = outs.flatMap((o) => {
      const qty = A.rows.filter((x) => x.dish === o.name).reduce((t, x) => t + x.qty, 0), y = yieldOf(o.r);
      const mats = [...(o.mats || new Map())], ok = mats.filter(([, m]) => m.have >= m.need).length;
      const label = `${nameHTML(o.name)}<small> ×${fmt(qty)}</small>`, recipe = `${esc(o.r.inputs.map((i) => `${i.item} ${i.qty}`).join('、'))}${y > 1 ? `（一次做出 ${y} 份）` : ''}`;
      const head = o.none ? rowHTML('li', label, '這週做不了', { cls: 'dish short', f: 0, sub: recipe })
        : !o.left ? rowHTML('li', label, '✓ 完成', { cls: 'dish met', f: 1, sub: recipe })
          : o.can >= o.left ? rowHTML('li', label, '✓ 可以組裝', { cls: 'dish met', f: 1, sub: recipe })
            : meterHTML('li', label, ok, mats.length, { unit: '樣', cls: 'dish', sub: recipe });
      const miss = o.left && o.can < o.left ? mats.filter(([, m]) => m.have < m.need) : [];
      return [head, ...miss.map(([item, m]) => {
        const short = !!(A.mats.find((x) => x.name === item) || {}).short, lack = `還缺 ${fmt(m.need - m.have)}`;
        return meterHTML('li', nameHTML(item), m.have, m.need, { cls: 'in', short, sub: [short ? `<span class="bad-text">${lack}</span>` : lack, whereFrom(item)].filter(Boolean).join('・') });
      })];
    });
    return sec('料理', '備齊／材料', `${rowsHTML(rows)}<p class="note">組裝只要十幾秒，不計時；料齊了一次做完。完成在訂單按。</p>`);
  }

  function nodeHTML(n) {
    if (n.kind === 'shop') return cardHTML(n, shopHTML(n), { act: `<button class="btn primary" type="button" data-buyopen="${esc(n.id)}">填已購買</button>` });
    if (n.kind === 'field' || n.kind === 'unknown') {
      // only how many are still to get; what is got goes into the stock on 背包's 填現有庫存
      const verb = n.kind === 'field' ? '還要採' : '還要拿';
      const rows = n.items.map((i) => (i.mat.get ? rowHTML('li', nameHTML(i.name), `${verb} ${fmt(i.mat.get)}`) : rowHTML('li', nameHTML(i.name), '✓ 齊了', { cls: 'met' })));
      return cardHTML(n, sec(n.kind === 'field' ? '要採' : '要拿', '', `${rowsHTML(rows)}<p class="note">${n.kind === 'unknown' ? '還不知道在哪拿，先當成不限量。拿到後' : '採回來後'}到${BAG_LINK}填現有數量，這裡就會跟著減少。</p>`),
        { act: '<button class="btn" type="button" data-go="bag">到背包填數量</button>' });
    }
    if (n.kind === 'bag') return cardHTML(n, bagHTML(), { act: '<button class="btn primary" type="button" data-stockopen>填現有庫存</button>' });
    // the 異常 alarms open the 投料區 a shortage lands on (zoneFor), so each shortage is told there
    if (n.kind === 'warehouse') {
      return cardHTML(n, storeHTML(n) + n.items.filter((i) => i.mat && i.mat.short && zoneFor(i.name) === n.id).map((i) => shortageHTML(i.mat)).join(''),
        { act: '<button class="btn" type="button" data-go="bag">到背包改數量</button>' });
    }
    if (n.kind === 'machine') return cardHTML(n, stationHTML(n), { act: startHTML(PL.get(n.lane.name)), wide: true });
    if (n.kind === 'assembly') return cardHTML(n, asmHTML(n));
    // 訂單: the wish list
    return cardHTML(n, ordersHTML(), { act: '<button class="btn" type="button" data-oopen>編輯訂單</button>' });
  }

  // Where the open card's lists are scrolled to, while it still shows the same point (data-shows).
  const keptLists = () => ($('point').open && $('point').dataset.shows === String(sel) ? [...$('point').querySelectorAll('[data-keep]')].map((el) => [el.dataset.keep, el.scrollTop]) : []);
  function renderPanel(lists = keptLists()) {
    const d = $('point'), n = sel && BY.get(sel);
    if (!n) { if (d.open) d.close(); return; }
    const was = d.querySelector('.mc-body'), top = d.open && d.dataset.shows === String(sel) && was ? was.scrollTop : 0;
    // focus stays in the card across the rebuild: on the same button where there is one, else on ✕
    const a = document.activeElement, focus = a && a !== d && d.contains(a)
      ? [...a.attributes].filter((x) => x.name.startsWith('data-')).map((x) => `[${x.name}="${CSS.escape(x.value)}"]`).join('') : null;
    d.innerHTML = nodeHTML(n);
    d.dataset.shows = String(sel);
    d.classList.toggle('wide', n.kind === 'machine');
    d.classList.toggle('station', n.kind === 'machine');
    if (!d.open) d.showModal();
    // a list in the card (.list5) shows at most five; more scroll inside it, and stay where they were
    for (const box of d.querySelectorAll('.list5')) {
      const six = box.children[5];
      box.style.maxHeight = six ? `${six.getBoundingClientRect().top - box.getBoundingClientRect().top}px` : '';
    }
    for (const [k, v] of lists) { const el = d.querySelector(`[data-keep="${CSS.escape(k)}"]`); if (el) el.scrollTop = v; }
    d.querySelector('.mc-body').scrollTop = top;
    if (focus != null) { const el = (focus && d.querySelector(`${focus}:not(:disabled)`)) || d.querySelector('.mc-x'); el.focus({ preventScroll: true }); }
  }

  /* ---------- the wish list and the materials it takes ---------- */
  const stepper = (key, value, label, step) => `<span class="stepper"><button class="btn" type="button" data-step="${key}|-${step}" aria-label="${label}少 ${step}">−${step}</button><input data-num="${key}" data-f="n:${key}" inputmode="numeric" value="${value}" aria-label="${label}"><button class="btn" type="button" data-step="${key}|${step}" aria-label="${label}多 ${step}">+${step}</button></span>`;
  // A dish on its food station's 投料區 (see makeZones), and whether its own share of the bag covers all it still takes
  // — the same 可以組裝 as on the assembly card, whatever the other dishes or stations are waiting for.
  const dishOut = (name) => ZONES.flatMap((z) => (z.asm ? z.outs : [])).find((o) => o.name === name);
  const canMake = (name) => { const o = dishOut(name); return !!o && o.left > 0 && o.can >= o.left; };
  // One order line's status (a dish ordered on two lines is made as one, on the first line): 等加工 while one of its
  // missing materials is a made item, 等料 while only bought or gathered ones are.
  function orderStatus(o) {
    const r = PR.assemble.find((x) => x.item === o.dish), first = A.rows.find((x) => x.dish === o.dish).i;
    if (!r) return ['bad', '做不了'];
    if (first !== o.i) return ['idle', `跟第 ${first + 1} 道一起完成`];
    if (r.done >= r.plan) return ['idle', '✓ 完成'];
    if (canMake(o.dish)) return ['wait', '可以組裝'];
    const out = dishOut(o.dish), miss = out ? [...(out.mats || new Map())].filter(([, m]) => m.have < m.need).map(([item]) => item) : [];
    return miss.some((item) => !A.mats.some((m) => m.name === item)) ? ['idle', '等加工'] : ['wait', '等料'];
  }
  // The wish list: each dish, how many, its light and 完成 — greyed out until its ingredients are all in hand; a done
  // one can be taken back (取消). Marking it leaves the bag alone. A line the week can't make in full says how many it
  // can, and 完成 means those are made.
  function ordersHTML() {
    const rows = A.rows.map((o) => {
      const r = PR.assemble.find((x) => x.item === o.dish), own = r && A.rows.find((x) => x.dish === o.dish).i === o.i;
      const act = !own ? '<span class="act"></span>' : r.done >= r.plan
        ? `<button class="btn small" type="button" data-odone="${esc(r.key)}|0">取消</button>`
        : `<button class="btn small primary" type="button" data-odone="${esc(r.key)}|${r.plan}"${canMake(o.dish) ? '' : ' disabled'}>完成</button>`;
      const [k, text] = orderStatus(o);
      return `<li class="ord ${k}"><span class="no">${o.i + 1}</span><span class="nm">${nameHTML(o.dish)}<span class="q">×${fmt(o.qty)}</span></span>${act}
        <span class="st"><i class="lamp"></i>${esc(text)}${o.n < o.qty ? `<span class="cutnote">這週只做得出 ${fmt(o.n)}</span>` : ''}</span></li>`;
    }).join('');
    return sec('需求清單', A.rows.length > 1 ? '越上面越先分到限購材料' : '', rows
      ? `<ol class="ords">${rows}</ol><p class="note">料齊了「完成」才按得下去；按了不會動背包。</p>` : '<p class="note0">還沒有訂單，按「編輯訂單」增加訂單。</p>');
  }
  // 原物料: every raw material the week takes — what the bag holds against what is still to use (shown only; it is typed
  // in on 背包's 填現有庫存), what to buy and gather — then the made items, their batches and what the bag holds of them.
  function matsHTML() {
    const rank = (m) => (m.s.limited ? 0 : m.s.buyCap ? 1 : m.s.gather ? 2 : 3);
    const mats = A.mats.filter((m) => m.need || m.short).sort((a, b) => rank(a) - rank(b) || b.util - a.util || b.need - a.need);
    const rem = (m) => Math.max(0, m.need - m.used), cell = (done, need, o) => meterHTML('span', null, done, need, o);
    const alarm = (text) => `<span class="lamp-t bad"><i class="lamp"></i>${esc(text)}</span>`;
    const row = (m) => {
      const s = m.s;
      const tag = m.short ? alarm(`異常・缺 ${fmt(m.short)}`) : s.limited ? '<span class="tag">限購</span>' : s.gather ? '<span class="tag">可採集</span>' : s.unknown ? alarm('來源待補') : '';
      const where = [...m.shops.map((sh) => `${sh.who} ${fmt(sh.qty)}`), m.get ? (s.gather ? `採：${s.src.find((x) => x.kind === 'gather').text}` : '來源待補') : ''].filter(Boolean);
      return `<tr>
        <th scope="row">${nameHTML(m.name)}${tag}</th>
        <td class="num">${cell(m.stock, rem(m), { short: !!m.short })}</td>
        <td class="num">${s.buyCap ? fmt(m.buy) : '—'}</td>
        <td class="num">${s.buyCap ? fmt(s.buyCap) : '—'}</td>
        <td class="num">${m.get ? fmt(m.get) : '—'}</td>
        <td class="src">${esc(where.join('、') || '用現有的')}</td>
      </tr>`;
    };
    const made = P.steps.filter((s) => !P.dishSet.has(s.name)), proc = (s) => PR.process.find((x) => x.item === s.name);
    const madeRows = made.map((s) => {
      const r = proc(s);
      return `<tr>
        <th scope="row">${nameHTML(s.name)}</th>
        <td class="num">${cell(r ? r.done : 0, r ? r.plan : s.batches, { unit: '批' })}</td>
        <td class="num">${cell(held(s.name), s.need)}</td>
        <td class="src">${esc(s.equip || '設備待補')}${A.pool.get(s.name) ? `・剩 ${fmt(A.pool.get(s.name))} 個留到下週` : ''}</td>
      </tr>`;
    }).join('');
    const sum = (list, f) => list.reduce((t, x) => t + f(x), 0);
    return `<section class="box mats-box">
      <div class="box-head"><h2>原物料</h2><span class="muted">${fmt(mats.length)} 樣，還要用 ${fmt(sum(mats, rem))} 個：現有 ${fmt(sum(mats, (m) => Math.min(m.stock, rem(m))))}、建議買 ${fmt(sum(mats, (m) => m.buy))}、要採 ${fmt(sum(mats, (m) => m.get))}</span></div>
      ${mats.length ? `<div class="tbl-wrap"><table><thead><tr><th>原物料</th><th class="r">現有／需要</th><th class="r">建議買</th><th class="r">還能買</th><th class="r">要採</th><th>去哪</th></tr></thead><tbody>${mats.map(row).join('')}</tbody></table></div>` : '<p class="note pad">這週不用原物料。</p>'}
      ${madeRows ? `<div class="box-head sub"><h3>加工品</h3><span class="muted">${fmt(made.length)} 樣，要做 ${fmt(sum(made, (s) => s.batches))} 批：做好 ${fmt(sum(made, (s) => (proc(s) ? proc(s).done : 0)))} 批</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>加工品</th><th class="r">做好／要做</th><th class="r">現有／需要</th><th>設備</th></tr></thead><tbody>${madeRows}</tbody></table></div>` : ''}
      <p class="note pad">現有數量照背包算，要改請到${BAG_LINK}填現有庫存。</p>
    </section>`;
  }

  function render() {
    // Keep the focused field (by data-f) and its caret across the rebuild.
    const a = document.activeElement, f = a && a.dataset ? a.dataset.f : null;
    const caret = f && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
    const lists = keptLists();
    plan();
    if (sel && !BY.has(sel)) sel = null;
    const wk = shopWeek();
    $('week-line').textContent = `本週 ${wk.range}`;
    const short = A.mats.filter((m) => m.short);
    // The summary's figures open the card they come from; the character count is edited right here.
    const station = NODES.find((n) => n.kind === 'machine'), ps = procSummary();
    const total = A.rows.reduce((t, o) => t + o.qty, 0), done = PR.assemble.filter((r) => r.done >= r.plan).length;
    const kpi = (k, v, go, { cls = '', f: part = null } = {}) => (go != null
      ? `<button class="kpi${cls ? ` ${cls}` : ''}" type="button" data-go="${esc(go)}"><span class="k">${k}</span><b>${v}</b>${part == null ? '' : barOf(part)}</button>`
      : `<span class="kpi${cls ? ` ${cls}` : ''}"><span class="k">${k}</span><b>${v}</b></span>`);
    $('app').innerHTML = `<div class="summary">
        ${kpi('可做／訂單', `${fmt(P.qty)}／${fmt(total)} 份`, 'fg', { f: total ? P.qty / total : 0 })}
        ${kpi('完成／訂單', `${fmt(done)}／${fmt(PR.assemble.length)} 道`, 'fg', { f: PR.assemble.length ? done / PR.assemble.length : 0 })}
        ${kpi('異常', short.length ? esc(short.map((m) => `${m.name}缺 ${fmt(m.short)}`).join('、')) : '沒有', short.length ? zoneFor(short[0].name) : null, { cls: short.length ? 'bad' : '' })}
        ${kpi('加工', !ps.busy ? '都做好了' : ps.finish != null ? `${esc(hm(ps.finish))} 做好` : '時間待補', station ? station.id : null)}
        <span class="kpi edit"><span class="k">幾隻角色去買${charsFromBoard() ? '（照佈告欄）' : ''}</span>${stepper('chars', chars(), '角色數', 1)}</span>
        <p class="hint">可做、異常、加工是照你填的現有數量、已購買、開工和完成算出來的。點一下看是怎麼來的。角色最多 ${MAX_CHARS} 隻。</p>
      </div>
      <section class="box board-box">
        <div class="box-head"><h2>廠區</h2><span class="muted">點一張卡看詳細・數字都是「完成／需求」</span>
          <div class="legend">${Object.entries(STATUS_TEXT).map(([k, text]) => `<span class="lg ${k}">${LIGHT}${text}</span>`).join('')}</div></div>
        ${blocksHTML()}
      </section>
      ${matsHTML()}`;
    renderPanel(lists);
    if (f) {
      const el = document.querySelector(`[data-f="${CSS.escape(f)}"]`);
      if (el) { el.focus({ preventScroll: true }); if (caret && el.setSelectionRange) try { el.setSelectionRange(...caret); } catch (_) {} }
    }
  }

  // A point opens as a card over the board (訂單 is the point 'fg'); null closes it.
  function select(id) {
    sel = id || null;
    renderPanel([]);
  }
  const pick = (id) => select(id || 'fg');

  /* ---------- a station: putting batches in, 開工, 領料 and taking them back out ---------- */
  // Before a change, the places as shown and the order of the batches still to put in are kept as they are (the places
  // shown before their first use this week aren't stored yet).
  function keep(q) {
    setSlots(q.lane.name, q.places);
    setOrder(q.lane.name, q.seq);
  }
  // Moves the batch at `from` among those still to put in to `to`.
  function moveBatch(lane, from, to) {
    const q = PL.get(lane);
    if (!q || from === to) return;
    keep(q);
    const seq = q.seq.slice(), [x] = seq.splice(from, 1);
    seq.splice(Math.max(0, Math.min(seq.length, to)), 0, x);
    setOrder(lane, seq);
    save();
    render();
  }
  // Puts the batch at `from` among those still to put in into the station, waiting for 開工: the first empty place,
  // right below the batches already there.
  function placeBatch(lane, from) {
    const q = PL.get(lane), k = q ? q.places.indexOf(null) : -1;
    if (k < 0 || from < 0 || from >= q.seq.length) return;
    keep(q);
    const seq = q.seq.slice(), [name] = seq.splice(from, 1);
    slotsOf(lane)[k] = { name, at: null };
    setOrder(lane, seq);
    save();
    render();
  }
  // 開工 (data-start: the station), 領料, 直接完成 and ✕ (data-collect / data-finish / data-unslot: 'station|place'),
  // 加入 (data-place-in: 'station|batch' into the first empty place), 退回 (data-unlog: 'station|log entry'), and the
  // 測試 lock (data-testlock, not remembered).
  function queueAction(b) {
    if (b.dataset.testlock != null) { testing = !testing; renderPanel(); return; }
    const v = b.dataset.collect || b.dataset.finish || b.dataset.unslot || b.dataset.placeIn || b.dataset.unlog || '', bar = v.lastIndexOf('|');
    const lane = b.dataset.start || v.slice(0, bar), k = Number(v.slice(bar + 1)), q = PL.get(lane), now = Date.now();
    if (!q) return;
    if (b.dataset.placeIn) { placeBatch(lane, k); return; }
    keep(q);
    if (b.dataset.start) startSlots(lane, now);
    else if (b.dataset.collect) collectSlot(lane, k, now);
    else if (b.dataset.finish) collectSlot(lane, k, now, true);
    else if (b.dataset.unlog) uncollect(lane, k);
    else cancelSlot(lane, k, now);
    save();
    render();
  }
  // Dragging a batch still to put in by its ⠿: onto another one to change the order, or onto an empty place of the
  // same station to put it in; works with a mouse or a finger. A copy follows the pointer (the lists scroll, so the
  // batch itself would be cut off), and a list scrolls when the pointer nears its top or bottom edge.
  let drag = null;
  const clearDrop = () => document.querySelectorAll('.slot.drop').forEach((x) => x.classList.remove('drop'));
  document.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest && e.target.closest('.grip');
    if (!grip || e.button > 0) return;
    const el = grip.closest('[data-slot]');
    e.preventDefault();
    drag = { el, lane: el.dataset.lane, from: Number(el.dataset.slot), x: e.clientX, y: e.clientY, id: e.pointerId, on: false, to: null, place: null, ghost: null };
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) < 5) return;
    if (!drag.on) {
      const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
      g.classList.add('ghost');
      Object.assign(g.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px` });
      // inside the open card, which sits above everything else on the page
      (drag.el.closest('dialog') || document.body).appendChild(g);
      drag.ghost = g;
    }
    drag.on = true;
    drag.el.classList.add('dragging');
    drag.ghost.style.transform = `translate(${dx}px, ${dy}px)`;
    const under = document.elementsFromPoint(e.clientX, e.clientY);
    const box = under.map((x) => x.closest('.list5')).find(Boolean);
    if (box) {
      const b = box.getBoundingClientRect();
      if (e.clientY < b.top + 28) box.scrollTop -= 12; else if (e.clientY > b.bottom - 28) box.scrollTop += 12;
    }
    const t = under.map((x) => x.closest('[data-slot], [data-place]')).find((x) => x && x !== drag.el);
    clearDrop();
    drag.to = drag.place = null;
    if (!t || t.dataset.lane !== drag.lane) return;
    if (t.dataset.place != null) drag.place = Number(t.dataset.place); else drag.to = Number(t.dataset.slot);
    t.classList.add('drop');
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    clearDrop();
    if (d.ghost) d.ghost.remove();
    if (d.on && d.place != null) placeBatch(d.lane, d.from);
    else if (d.on && d.to != null && d.to !== d.from) moveBatch(d.lane, d.from, d.to);
    else d.el.classList.remove('dragging');
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  // Running rounds come due by themselves: redraw now and then, unless something is being typed or dragged.
  setInterval(() => {
    const a = document.activeElement;
    if (!A || drag || $('sheet').open || (a && a.matches && a.matches('input, select'))) return;
    render();
  }, 30e3);

  /* ---------- forms over the page: 填已購買 for one shop (a block per character), 填現有庫存 for the whole bag ---------- */
  // A form is the same card as a point's, with a plain head (what it is, its title, ✕), the fields in the middle and a
  // foot that stays put: something for all the fields on the left, 取消 and 完成 on the right. It all sits in
  // #sheet-form, so 完成 submits it.
  const FORM_ACT = '<button class="btn" type="button" data-bmcancel>取消</button><button class="btn primary" type="submit">完成</button>';
  const formHTML = (kind, title, body, { lead = '', act = FORM_ACT } = {}) => `<div class="mc plain"><div class="mc-head"><div class="mc-top"><span class="mc-kind">${esc(kind)}</span>
      <button class="mc-x" type="button" data-bmcancel aria-label="關閉">✕</button></div><h2 class="mc-title" id="sheet-title">${esc(title)}</h2></div>
    <div class="mc-body"><div class="sec">${body}</div></div>
    <div class="mc-foot"><span class="mc-nav">${lead}</span><span class="mc-act">${act}</span></div></div>`;
  function openBuy(id) {
    const n = BY.get(id);
    if (!n || n.kind !== 'shop') return;
    const many = chars() > 1;
    const groups = Array.from({ length: chars() }, (_, c) => `<fieldset class="bm-char">${many ? `<legend>角色 ${c + 1}</legend>` : ''}
      ${n.items.map((i) => `<div class="bm-row"><span class="bm-name">${nameHTML(i.name)}</span>
        <input class="have" data-bm="${c}|${esc(i.buy.key)}" inputmode="numeric" value="${(i.buy.per[c] || {}).bought || ''}" placeholder="0" aria-label="${esc(i.name)}${many ? ` 角色 ${c + 1}` : ''} 已購買">
        <span class="muted">／${SHOP.limit}</span><button class="btn small" type="button" data-bmfill>滿</button></div>`).join('')}</fieldset>`).join('');
    $('sheet-form').dataset.kind = 'buy';
    $('sheet-form').innerHTML = formHTML('填已購買', n.title, `<p class="note0">這週已經買了幾個？每樣最多 ${SHOP.limit} 個${many ? '，每隻角色分開算' : ''}。這裡只記額度，背包請另外更新。</p>${groups}`,
      { lead: '<button class="btn small" type="button" data-bmall>全部填滿</button>' });
    $('sheet').showModal();
    const first = $('sheet-form').querySelector('input');
    if (first) first.select();
  }
  // 填現有庫存, the one place the stock is typed in (from 背包): every raw material the week takes, every made item (one
  // made ahead cuts the batches still to make), then anything else in the bag, each as many as the game's bag holds now
  // (data-sm). Only a station's 開工 and 領料 move it by themselves.
  function openStock() {
    const need = new Map();
    for (const z of ZONES) for (const i of z.items) need.set(i.name, (need.get(i.name) || 0) + i.need);
    const row = (name) => `<div class="bm-row"><span class="bm-name">${nameHTML(name)}<small>${need.get(name) ? `需要 ${fmt(need.get(name))}` : '這週不用再投'}</small></span>
      <input class="have" data-sm="${esc(name)}" inputmode="numeric" value="${held(name) || ''}" placeholder="0" aria-label="${esc(name)} 現有數量"></div>`;
    const { raw, made, other } = bagGroups();
    $('sheet-form').dataset.kind = 'stock';
    $('sheet-form').innerHTML = formHTML('填現有庫存', '背包', `<p class="note0">照遊戲背包現在的數量填，每樣一個數字。兩區都要用的料，會照需求清單的順序自動分。</p>
      ${raw.length ? `<fieldset class="bm-char"><legend>原料</legend>${raw.map(row).join('')}</fieldset>` : ''}
      ${made.length ? `<fieldset class="bm-char"><legend>加工品・做好放著的，填了會少做幾批</legend>${made.map(row).join('')}</fieldset>` : ''}
      ${other.length ? `<fieldset class="bm-char"><legend>這週用不到・填 0 就清掉</legend>${other.map(row).join('')}</fieldset>` : ''}
      ${raw.length || made.length || other.length ? '' : '<p class="note0">背包是空的，需求清單也還沒有要用的料。</p>'}`);
    $('sheet').showModal();
    const first = $('sheet-form').querySelector('input');
    if (first) first.select();
  }
  // 完成: every number that changed is saved (a purchase doesn't move the stock).
  $('sheet-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if ($('sheet-form').dataset.kind === 'orders') { saveOrders(); return; }
    for (const inp of $('sheet-form').querySelectorAll('[data-sm]')) {
      const name = inp.dataset.sm, n = Math.max(0, Math.floor(Number(inp.value)) || 0);
      if (n === held(name)) continue;
      if (n) S.have[name] = n; else delete S.have[name];
    }
    for (const inp of $('sheet-form').querySelectorAll('[data-bm]')) {
      const v = inp.dataset.bm, a = v.indexOf('|'), c = Number(v.slice(0, a)), key = v.slice(a + 1);
      const was = Math.max(0, Math.floor(Number((S.done.bought[key] || [])[c])) || 0);
      const n = Math.min(SHOP.limit, Math.max(0, Math.floor(Number(inp.value)) || 0));
      if (n !== was) setBought(key, c, n);
    }
    save();
    $('sheet').close();
    render();
  });
  // 設定: wipe this week's purchases (every shop's limit back to full), the whole bag, the stations (their places, the
  // order of what is still to put in, 已完成 and the finished batch counts) or all of these and the orders' 完成 —
  // the wish list and the character count stay. None of it can be undone, so each button has to be pressed twice;
  // `done` says what the last one cleared.
  const CLEAR = {
    bought: () => { S.done.bought = {}; },
    have: () => { S.have = {}; },
    proc: () => { S.done.proc = {}; S.done.processed = {}; },
    all: () => { for (const k of ['bought', 'have', 'proc']) CLEAR[k](); S.done.assembled = {}; },
  };
  function openSettings(done) {
    const bought = Object.keys(S.done.bought).length, have = Object.keys(S.have).filter((name) => held(name)).length;
    const procs = Object.values(S.done.proc), placed = procs.reduce((t, p) => t + (Array.isArray(p.slots) ? p.slots.filter(Boolean).length : 0), 0);
    const logged = procs.reduce((t, p) => t + (Array.isArray(p.log) ? p.log.length : 0), 0);
    const proc = procs.filter((p) => Object.keys(p).length).length + Object.keys(S.done.processed).length, made = Object.keys(S.done.assembled).length;
    const row = (key, title, sub, n, label) => `<div class="set-row"><span class="bm-name"><b>${title}</b><small class="muted">${sub}</small></span>
      <button class="btn" type="button" data-clear="${key}"${n ? '' : ' disabled'}>${label}</button></div>`;
    $('sheet-form').dataset.kind = 'settings';
    $('sheet-form').innerHTML = formHTML('廠區', '設定', `<p class="note0">${done || '清除後沒辦法復原，按鈕要按兩次才會清。'}</p>
      ${row('bought', '清除已購買', bought ? `這週在商店填的已購買（${fmt(bought)} 筆）全部歸零，每家店的額度回到滿的。` : '目前沒有已購買的紀錄。', bought, '清除')}
      ${row('have', '清空背包', have ? `背包裡的 ${fmt(have)} 樣東西全部變成 0，之後再照遊戲重填。` : '背包已經是空的。', have, '清空')}
      ${row('proc', '清除加工台排程', proc ? `設備裡的 ${fmt(placed)} 批、排程順序和已完成的 ${fmt(logged)} 筆紀錄全部清掉，加工台回到還沒開始。背包不會動。` : '加工台還沒有排程。', proc, '清除')}
      ${row('all', '清除全部', bought + have + proc + made ? '上面三項，加上訂單的完成標記，一次全部清掉。需求清單和角色數會留著。' : '目前沒有東西可以清。', bought + have + proc + made, '清除全部')}`,
    { act: '<button class="btn" type="button" data-bmcancel>關閉</button>' });
    if (!$('sheet').open) $('sheet').showModal();
  }
  $('sheet').addEventListener('click', (e) => {
    const d = $('sheet');
    if (e.target === d || e.target.closest('[data-bmcancel]')) { d.close(); return; }
    // 設定's 清除／清空: the first press turns the button red, the second clears
    const clr = e.target.closest('[data-clear]');
    if (clr) {
      if (!clr.classList.contains('danger')) { clr.classList.add('danger'); clr.textContent = '再按一次確定'; return; }
      const key = clr.dataset.clear;
      CLEAR[key]();
      save();
      render();
      openSettings({ bought: '已購買都清除了。', have: '背包清空了。', proc: '加工台排程清除了。', all: '全部清除了。' }[key]);
      return;
    }
    const one = e.target.closest('[data-bmfill]');
    if (one) { one.closest('.bm-row').querySelector('input').value = SHOP.limit; return; }
    if (e.target.closest('[data-bmall]')) d.querySelectorAll('[data-bm]').forEach((x) => { x.value = SHOP.limit; });
    // the order form: ✕ takes a line off, ＋ 增加訂單 adds the first dish not on the list yet (lines move by dragging ⠿)
    const del = e.target.closest('[data-oedel]');
    if (del) { draft.splice(Number(del.dataset.oedel), 1); drawDraft(); return; }
    if (e.target.closest('[data-oeadd]')) {
      const taken = new Set(draft.map((o) => o.dish)), next = dishes().find((r) => !taken.has(r.name)) || dishes()[0];
      if (!next) return;
      draft.push({ dish: next.name, qty: 10 });
      drawDraft();
      const q = d.querySelector(`[data-oeqty="${draft.length - 1}"]`);
      if (q) { q.scrollIntoView({ block: 'nearest' }); q.select(); }
    }
  });
  $('sheet').addEventListener('close', () => { draft = null; });

  /* ---------- the order form: the whole wish list at once, kept as a draft until 完成 ---------- */
  let draft = null;
  // Each line of the draft with its 上限: the week worked out on the draft instead of the saved list.
  function draftRows() {
    const keep = S.orders;
    S.orders = draft;
    try { return allocate().rows; } finally { S.orders = keep; }
  }
  // 上限 under each count, worked out again on every change.
  function paintCaps() {
    for (const r of draftRows()) {
      const el = $('sheet-form').querySelector(`[data-oecap="${r.i}"]`);
      if (!el) continue;
      el.textContent = r.max < Infinity ? `上限 ${fmt(r.max)}` : '';
      el.classList.toggle('ord-cut', r.qty > r.max);
    }
  }
  function drawDraft() {
    $('sheet-form').querySelector('[data-oelist]').innerHTML = draft.map((o, i) => `<div class="oe-row" data-oerow="${i}">
        <span class="oe-grip" title="拖拉換順序" aria-hidden="true">⠿</span>
        <span class="wish-n">${i + 1}</span>
        <select data-oedish="${i}" aria-label="第 ${i + 1} 道料理">${dishOptions(o.dish)}</select>
        <span class="oe-qty"><input class="have" data-oeqty="${i}" inputmode="numeric" value="${o.qty || ''}" aria-label="第 ${i + 1} 道數量"><small data-oecap="${i}"></small></span>
        <button class="btn oe-del" type="button" data-oedel="${i}" aria-label="刪掉第 ${i + 1} 道">✕</button>
      </div>`).join('') || '<p class="note">還沒有訂單。</p>';
    paintCaps();
  }
  function moveDraft(from, to) {
    if (from === to || to < 0 || to >= draft.length) return;
    draft.splice(to, 0, draft.splice(from, 1)[0]);
    drawDraft();
  }
  function openOrders() {
    draft = S.orders.map((o) => ({ dish: o.dish, qty: o.qty }));
    $('sheet-form').dataset.kind = 'orders';
    $('sheet-form').innerHTML = formHTML('訂單', '編輯訂單', `<p class="note0">拖 ⠿ 換順序，越上面越先分到限購材料；按「完成」才會存。</p>
      <button class="btn full" type="button" data-oeadd>＋ 增加訂單</button>
      <div data-oelist></div>`);
    drawDraft();
    $('sheet').showModal();
  }
  // 完成: the draft becomes the wish list (a count left empty is 1).
  function saveOrders() {
    S.orders.splice(0, S.orders.length, ...draft.map((o) => ({ dish: o.dish, qty: Math.max(1, o.qty) })));
    save();
    $('sheet').close();
    render();
  }
  $('sheet').addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.oedish != null) { draft[Number(t.dataset.oedish)].dish = t.value; paintCaps(); }
  });
  $('sheet').addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.oeqty != null) { draft[Number(t.dataset.oeqty)].qty = Math.max(0, Math.floor(Number(t.value)) || 0); paintCaps(); }
  });
  // Dragging a line by its ⠿ to another place, with a mouse or a finger; the grip holds the pointer, so letting go
  // outside the form doesn't close it.
  let odrag = null;
  $('sheet').addEventListener('pointerdown', (e) => {
    const grip = e.target.closest('.oe-grip');
    if (!grip || e.button > 0) return;
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    const el = grip.closest('[data-oerow]');
    odrag = { el, from: Number(el.dataset.oerow), y: e.clientY, id: e.pointerId, on: false, to: null };
  });
  $('sheet').addEventListener('pointermove', (e) => {
    if (!odrag || e.pointerId !== odrag.id) return;
    const dy = e.clientY - odrag.y;
    if (!odrag.on && Math.abs(dy) < 5) return;
    odrag.on = true;
    odrag.el.classList.add('dragging');
    odrag.el.style.transform = `translateY(${dy}px)`;
    const t = document.elementsFromPoint(e.clientX, e.clientY).map((x) => x.closest('[data-oerow]')).find((x) => x && x !== odrag.el);
    $('sheet-form').querySelectorAll('.oe-row.drop').forEach((x) => x.classList.remove('drop'));
    odrag.to = t ? Number(t.dataset.oerow) : null;
    if (t) t.classList.add('drop');
  });
  const endODrag = (e) => {
    if (!odrag || e.pointerId !== odrag.id) return;
    const d = odrag;
    odrag = null;
    if (d.on && d.to != null && d.to !== d.from) moveDraft(d.from, d.to);
    else { d.el.classList.remove('dragging'); d.el.style.transform = ''; $('sheet-form').querySelectorAll('.oe-row.drop').forEach((x) => x.classList.remove('drop')); }
  };
  $('sheet').addEventListener('pointerup', endODrag);
  $('sheet').addEventListener('pointercancel', endODrag);

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const qb = e.target.closest('[data-start], [data-collect], [data-finish], [data-unslot], [data-place-in], [data-unlog], [data-testlock]');
    if (qb) { queueAction(qb); return; }
    const open = e.target.closest('[data-buyopen]');
    if (open) { openBuy(open.dataset.buyopen); return; }
    if (e.target.closest('[data-stockopen]')) { openStock(); return; }
    if (e.target.closest('[data-oopen]')) { openOrders(); return; }
    if (e.target.closest('[data-settings]')) { openSettings(); return; }
    // 完成 / 取消 on an order (data-odone 'dish|count'): only the count is kept, the bag stays as typed in
    const od = e.target.closest('[data-odone]');
    if (od) { const v = od.dataset.odone, a = v.lastIndexOf('|'); setDone('assembled', v.slice(0, a), v.slice(a + 1)); save(); render(); return; }
    if (e.target.closest('[data-close]')) { $('point').close(); return; }
    const go = e.target.closest('[data-go]');
    if (go) { pick(go.dataset.go); return; }
  });
  // The open card closes with ✕, Esc or a click beside it; ← and → walk along the flow to the point before and after.
  $('point').addEventListener('close', () => { sel = null; $('point').innerHTML = ''; delete $('point').dataset.shows; });
  $('point').addEventListener('click', (e) => { if (e.target === $('point')) $('point').close(); });
  document.addEventListener('keydown', (e) => {
    const n = sel && BY.get(sel);
    if (!n || !$('point').open || $('sheet').open || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || (e.target.closest && e.target.closest('input, select, textarea'))) return;
    const to = flowOf(n)[e.key === 'ArrowLeft' ? 'prev' : 'next'];
    if (to) { e.preventDefault(); select(to); }
  });
  wireList(render);
  // The planner may change the plan in another tab.
  addEventListener('storage', (e) => { if (e.key === 'mm-line-v1') location.reload(); });

  (async () => {
    try {
      await window.LineCore.load();
    } catch (_) {
      $('app').innerHTML = '<div class="box fail">這頁的配方是從佈告欄（index.html）讀進來的，要用網址開啟，例如 GitHub Pages；直接點開檔案的話瀏覽器不讓它讀。</div>';
      return;
    }
    render();
  })();
})();
</script>
</body>
</html>
