<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>廠區</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fde'/%3E%3Cpath d='M12 50V28l12 8v-8l12 8v-8l12 8V14h6v36z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
/* Plant: the week's plan as a factory floor in blocks, flow left to right — suppliers outside the fence, then 暫存區,
   the stations, assembly and 訂單 (the finished dishes). Light palette only; status colours are the andon lights'. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --ink: #1f2933;
  --muted: #5f6b7a;
  --line: #d5dbe1;
  --accent: #2f6fde;
  --accent-soft: #e3ecfc;
  --ok: #2e9b5b;   --ok-soft: #dff3e7;
  --wait: #c98a0c; --wait-soft: #fbf0d6;
  --bad: #d64545;  --bad-soft: #fbe3e3;
  --done: #3b7ddd; --done-soft: #e0ebfb;
  --idle: #8a96a3; --idle-soft: #eceff2;
  --grade-green: #2a7a3b; --grade-blue: #2560b0; --grade-purple: #7840c0; --grade-pink: #b0307a; --grade-orange: #a8530c;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --r: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.3; }
.grade-綠 { color: var(--grade-green); } .grade-藍 { color: var(--grade-blue); } .grade-紫 { color: var(--grade-purple); }
.grade-粉 { color: var(--grade-pink); } .grade-橙 { color: var(--grade-orange); }
.muted { color: var(--muted); }

.top { background: #1f2933; color: #fff; }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px var(--gutter-r) 10px var(--gutter-l); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.top h1 small { font-size: 13px; font-weight: 400; color: #b7c2cd; }
.top nav { margin-left: auto; display: flex; gap: 6px; }
.top nav a { color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 8px; background: rgba(255, 255, 255, .1); font-size: 14px; }
.top nav a:hover { background: rgba(255, 255, 255, .2); }

main { max-width: 1440px; margin: 0 auto; padding: 16px var(--gutter-r) 48px var(--gutter-l); }
/* the plant on the left, the info panel (orders by default) on the right, the lists under the plant */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto 1fr; grid-template-areas: "plant panel" "rest panel"; gap: 16px; align-items: start; }
.layout > .plant-card { grid-area: plant; } .layout > .panel { grid-area: panel; } .layout > .left { grid-area: rest; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.summary { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 12px; margin-bottom: 16px; }
.sum { font: inherit; color: inherit; text-align: left; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; background: none; }
button.sum { cursor: pointer; }
button.sum:hover { background: var(--accent-soft); border-color: rgba(47, 111, 222, .3); }
button.sum:hover b { color: var(--accent); }
.sum b { font-size: 18px; }
.sum .k { font-size: 13px; color: var(--muted); }
.sum.bad b { color: var(--bad); }
.sum.edit { align-items: center; margin-left: auto; }
.sum-hint { flex: 1 1 100%; margin: 0 10px; font-size: 12px; color: var(--muted); }

/* the plant */
.plant-card { overflow: hidden; }
.view-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.view-bar h2 { font-size: 18px; }
/* blocks: one column per stage, flow left to right */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px; background: var(--panel-2); }
.stage { display: grid; gap: 8px; align-content: start; min-width: 0; }
.stage h3 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.stage + .stage h3::before { content: "→"; color: var(--idle); }
.blk { font: inherit; color: var(--ink); text-align: left; display: grid; gap: 3px; width: 100%; padding: 9px 10px 10px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--idle); border-radius: 8px; cursor: pointer; }
.blk.ok { border-left-color: var(--ok); } .blk.wait { border-left-color: var(--wait); } .blk.bad { border-left-color: var(--bad); background: #fff8f8; }
.blk:hover { border-color: rgba(47, 111, 222, .45); }
.blk.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.blk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 2px; }
.blk-name { font-weight: 700; font-size: 15px; }
.blk .badge { padding: 0 8px; font-size: 12px; }
.blk .ln { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 1.5; }
.blk .ln span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.blk .ln.bad { color: var(--bad); }
.blk .foot { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 2px; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.btn:hover { background: #e9edf1; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2a62c6; }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 14px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

/* 訂單 in the panel: the wish list, shown only — one line per order, the dish and how many, what the week can make
   and its status in small type under it; 編輯 opens the whole list in one form */
.ord-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ord-h span { font-weight: 400; letter-spacing: 0; }
.ord-h b { font-size: 16px; color: var(--ink); }
.ord-h .btn { letter-spacing: 0; }
.orders-sec > .bar { height: 8px; }
.ord-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.ord-row .wish-n { grid-row: span 2; }
.ord-name { min-width: 0; font-size: 15px; }
.ord-qty { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ord-cap { font-size: 12px; color: var(--muted); }
.ord-row .badge { justify-self: end; padding: 0 8px; font-size: 12px; }
.ord-cut { color: var(--bad); }
/* the order form: the whole wish list at once — ⠿ (or ▲▼) moves a line, ✕ takes it off, 上限 in small type under
   the count; nothing is kept until 完成 */
.sheet.wide { width: min(520px, calc(100% - 32px)); }
.oe-row { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) 76px 28px 38px; gap: 6px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); background: var(--panel); }
.oe-row .wish-n { width: 22px; height: 22px; margin-top: 8px; font-size: 12px; }
.oe-grip { height: 38px; display: grid; place-items: center; border-radius: 6px; font-size: 18px; color: var(--idle); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.oe-grip:hover { background: var(--idle-soft); color: var(--ink); }
.oe-qty input { width: 100%; min-height: 38px; }
.oe-qty small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); text-align: right; }
.oe-qty small.ord-cut { color: var(--bad); font-weight: 700; }
.oe-mv { display: grid; height: 38px; }
.oe-mv .btn { min-height: 0; padding: 0; font-size: 10px; line-height: 1; }
.oe-mv .btn:first-child { border-radius: 6px 6px 0 0; }
.oe-mv .btn:last-child { border-top: 0; border-radius: 0 0 6px 6px; }
.oe-del { min-height: 38px; padding: 0; }
.oe-row.dragging { position: relative; z-index: 5; box-shadow: 0 6px 18px rgba(31, 41, 51, .22); }
.oe-row.dragging .oe-grip { cursor: grabbing; }
.oe-row.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
@media (max-width: 480px) {
  #sheet-form { padding: 14px 14px 12px; }
  .oe-row { grid-template-columns: 18px minmax(0, 1fr) 60px 28px 34px; }
  .oe-row .wish-n { display: none; }
}
.wish-n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
select { font: inherit; font-size: 15px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 38px; min-width: 0; width: 100%; }
.stepper { display: inline-flex; align-items: stretch; }
.stepper .btn { border-radius: 0; min-width: 44px; padding: 4px 8px; }
.stepper .btn:first-child { border-radius: 8px 0 0 8px; }
.stepper .btn:last-child { border-radius: 0 8px 8px 0; }
.stepper input { width: 64px; font: inherit; font-size: 15px; text-align: center; border: 1px solid var(--line); border-left: 0; border-right: 0; border-radius: 0; color: var(--ink); }
.btn.small { min-height: 30px; padding: 2px 10px; font-size: 13px; }
.ord-add { width: 100%; margin-top: 10px; }
.left { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.mats { padding: 12px 16px 16px; }
.mats-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px; }
.mats-head h2 { font-size: 18px; }
.mats-head .muted { font-size: 13px; }
.mats-sub { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.mats-sub h3 { font-size: 16px; margin: 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
thead th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--panel-2); }
thead th.r { text-align: right; }
tbody th { font-weight: 400; }
td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
td.num small { font-weight: 400; color: var(--muted); }
td.num .bar { min-width: 90px; }
td.src { white-space: normal; min-width: 160px; font-size: 13px; color: var(--muted); }
input.have { width: 72px; font: inherit; font-size: 14px; text-align: right; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

/* a station: its `queue` places (one batch made at a time, each collected on its own), then the batches still to put
   in; ⠿ drags one to another order or into an empty place */
.ok-text { color: var(--ok); }
.slot { display: grid; grid-template-columns: 28px 16px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 44px; padding: 5px 6px; margin-top: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.slot.place { grid-template-columns: 16px minmax(0, 1fr) auto; }
.slot.empty { background: transparent; border-style: dashed; color: var(--muted); font-size: 13px; }
.slot.run, .slot.queue { border-color: rgba(201, 138, 12, .45); background: var(--wait-soft); }
.slot.queue { background: var(--panel); }
.slot.done { border-color: rgba(46, 155, 91, .45); background: var(--ok-soft); }
.slot.drop { outline: 2px dashed var(--accent); outline-offset: 1px; }
.slot.dragging { position: relative; z-index: 5; box-shadow: 0 6px 18px rgba(31, 41, 51, .22); }
.slot .grip { height: 32px; display: grid; place-items: center; border-radius: 6px; font-size: 18px; color: var(--idle); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.slot .grip:hover { background: var(--idle-soft); color: var(--ink); }
.slot.dragging .grip { cursor: grabbing; }
.slot .no { font-size: 12px; color: var(--muted); text-align: center; }
.slot .what { min-width: 0; line-height: 1.35; }
.slot .what small { display: block; font-size: 12px; color: var(--muted); }
.slot.done .what small { color: var(--ok); font-weight: 700; }
.slot .mv { display: inline-flex; gap: 2px; }
.slot .mv .btn { min-height: 32px; min-width: 36px; padding: 2px 10px; }
.round-act { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); }
.note.bad-text { font-weight: 500; }
/* a line with a tick, what it is, the plan and what is done or in stock */
.done-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto auto; gap: 4px 12px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.done-row .chk { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.done-row.is-done .chk { background: var(--ok); border-color: var(--ok); }
.done-row.is-done .what b { color: var(--muted); text-decoration: line-through; }
.done-row.is-locked { opacity: .7; }
.done-row .what small { display: block; font-size: 12px; color: var(--muted); }
.panel .done-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
.panel .done-row .plan, .panel .done-row .act { grid-column: 2; }
.done-row .what em { display: block; font-style: normal; font-size: 12px; color: var(--wait); }
.done-row .what em.go-on { color: var(--ok); }
/* a shop in the panel, and the 填已購買 form over the page */
.buy-line { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.buy-line .num { font-weight: 700; font-variant-numeric: tabular-nums; }
.buy-open { width: 100%; margin-top: 10px; }
.store-box { padding: 10px 12px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
.store-box + .store-box { margin-top: 12px; }
.sheet { width: min(440px, calc(100% - 32px)); max-height: calc(100vh - 48px); overflow: auto; padding: 0; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(31, 41, 51, .25); }
.sheet::backdrop { background: rgba(31, 41, 51, .45); }
#sheet-form { padding: 16px 18px 14px; }
#sheet-form h2 { font-size: 18px; }
#sheet-form > .muted { margin: 4px 0 6px; font-size: 13px; }
.bm-name small { display: block; font-size: 12px; }
.blk-cut { margin: 3px 0; border-top: 1px dashed #b9c3cd; }
.bm-char { margin: 10px 0 0; padding: 0; border: 0; }
.bm-char legend { margin-bottom: 2px; padding: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.bm-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.bm-name { flex: 1 1 auto; min-width: 0; }
.bm-row > .muted { white-space: nowrap; }
.bm-act { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.bm-act .grow { flex: 1; }
.done-row .plan { font-size: 13px; color: var(--muted); white-space: nowrap; }
.done-row .act { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
@media (max-width: 640px) {
  .done-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
  .done-row .plan { grid-column: 2; }
  .done-row .act { grid-column: 2; }
}

/* the side panel */
.panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.panel-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.panel-head .kind { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.panel-head h2 { font-size: 20px; margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-head .back { font: inherit; font-size: 13px; background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; }
.sec { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; letter-spacing: .04em; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 999px; }
.badge.ok { color: var(--ok); background: var(--ok-soft); } .badge.wait { color: var(--wait); background: var(--wait-soft); }
.badge.bad { color: var(--bad); background: var(--bad-soft); } .badge.done { color: var(--done); background: var(--done-soft); }
.badge.idle { color: var(--idle); background: var(--idle-soft); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.rows li:last-child { border-bottom: 0; }
.rows .num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.rows .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--idle-soft); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar.full i { background: var(--bad); } .bar.cap i { background: var(--wait); } .bar.done i { background: var(--done); }
.go { font: inherit; text-align: left; width: 100%; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
.go:hover b { color: var(--accent); text-decoration: underline; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.sec.alert { background: var(--bad-soft); }
.sec.alert h3 { color: var(--bad); }
.sec h4 { font-size: 13px; margin: 12px 0 4px; }
.bad-text { color: var(--bad); font-weight: 700; }
.tips { margin: 0; padding-left: 18px; font-size: 14px; }
.tips li { margin: 3px 0; }
.loading, .fail { padding: 24px 16px; }

/* the panel stays on the right, fixed in view, down to 720px; narrower, it goes under the plant */
@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr) 320px; }
}
@media (max-width: 720px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "plant" "panel" "rest"; }
  .panel { position: static; max-height: none; }
}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>廠區 <small id="week-line"></small></h1>
    <nav><a href="factory.html">生產線</a><a href="index.html">佈告欄</a></nav>
  </div>
</header>
<main id="app"><div class="card loading">讀取資料中…</div></main>
<dialog id="sheet" class="sheet"><form id="sheet-form" method="dialog"></form></dialog>

<script src="line-core.js"></script>
<script id="plant-script">
(() => {
  // The plant page: the planner's week (same wish list, holdings and characters) as a factory floor. Click a point to
  // see what it needs and how it stands. The plant is shown as blocks, one column per stage.
  const {
    LINE, SHOP, S, save, MAX_CHARS, esc, fmt, fmtDur, shopWeek, nameHTML, sourceText, townRank, quick, chars, charsFromBoard, held,
    allocate, makePlan, makeSchedule, progress, yieldOf, dishes, dishOptions, wireList, gathers, setBought, setDone,
    REC, slotsOf, setSlots, setOrder, startSlots, collectSlot, uncollect, cancelSlot, logOf, onStock,
  } = window.LineCore;
  const $ = (id) => document.getElementById(id);

  // One look for one kind of plant. The plan underneath doesn't change between themes, so a car or wafer plant only
  // needs its own words and colours here.
  const THEME = {
    words: {
      outside: '廠外', shop: '供應商', field: '自有採集', unknown: '來源待補', warehouse: '暫存區', machine: '加工站',
      assembly: '組裝站', fg: '訂單',
    },
    status: { ok: '#2e9b5b', wait: '#e0a526', bad: '#d64545', idle: '#9aa5b1' },
  };
  const W = THEME.words;
  const STATUS_TEXT = { ok: '完成', wait: '進行中・可以做了', bad: '異常', idle: '還沒開始' };

  /* ---------- the plan and its points ---------- */
  let A, P, SCH, PR, PL = new Map(), NODES = [], BY = new Map(), ZONES = [], sel = null;
  // zone: an item that more than one 投料區 takes → its count in each (投料區 id → count); see makeZones.
  if (!S.zone || typeof S.zone !== 'object') S.zone = {};

  function plan() {
    A = allocate();
    P = makePlan(A);
    SCH = makeSchedule(P);
    PR = progress(A, P);
    const out = [];
    // Outside the fence: every shop selling something the wish list wants (even one whose share came to nothing, so a
    // shortage still shows where to buy), then gathering, then materials with no known source. A shop's item carries
    // its purchases (buy: each character's bought and suggested more).
    const shops = new Map(), fields = new Map(), unknown = [];
    for (const m of A.mats) {
      if (!m.need && !m.want) continue;
      for (const sh of m.buys) {
        const key = `${sh.who}|${sh.town || sh.note}`;
        if (!shops.has(key)) shops.set(key, { id: `shop:${key}`, kind: 'shop', title: sh.town ? `${sh.who}（${sh.town}）` : sh.who, town: sh.town, items: [] });
        shops.get(key).items.push({ name: m.name, qty: sh.qty, buy: sh, mat: m });
      }
      if (!gathers(m)) continue;
      if (m.s.gather) {
        const g = m.s.src.find((x) => x.kind === 'gather').text;
        if (!fields.has(g)) fields.set(g, { id: `field:${g}`, kind: 'field', title: g, items: [] });
        fields.get(g).items.push({ name: m.name, qty: m.get, mat: m });
      } else unknown.push({ name: m.name, qty: m.get, mat: m });
    }
    out.push(...[...shops.values()].sort((a, b) => townRank(a.town) - townRank(b.town)), ...fields.values());
    if (unknown.length) out.push({ id: 'unknown', kind: 'unknown', title: W.unknown, items: unknown });
    out.forEach((n) => { n.zone = 'out'; });
    // Inside: 暫存區 (a 投料區 for each station), the stations from the raw side, assembly, 訂單. 立即製作 isn't a station
    // of its own: what it makes is put on the first assembly station (or one named after its skill's station) with the
    // rest of the assembly.
    const instant = SCH.lanes.filter((L) => L.steps.every((s) => s.instant)), extra = instant.flatMap((L) => L.steps);
    const stations = [];
    let asmNode = null;
    for (const L of SCH.lanes) {
      if (instant.includes(L)) continue;
      const asm = L.steps.every(quick);
      const n = { id: `lane:${L.name}`, kind: asm ? 'assembly' : 'machine', title: L.equip || '設備待補', todo: !L.equip, lane: L, zone: 'in' };
      if (asm && !asmNode) asmNode = n;
      stations.push(n);
    }
    if (extra.length && asmNode) asmNode.lane = { ...asmNode.lane, steps: [...asmNode.lane.steps, ...extra] };
    else if (extra.length) {
      const eq = (LINE.skills[extra[0].r.skill] || {}).equip || W.assembly;
      stations.push({ id: `lane:${eq}`, kind: 'assembly', title: eq, lane: { name: eq, equip: eq, steps: extra }, zone: 'in' });
    }
    const zones = makeZones([...stations.filter((n) => n.kind === 'machine'), ...stations.filter((n) => n.kind === 'assembly')]);
    out.push(...zones, ...stations, { id: 'fg', kind: 'fg', title: W.fg, zone: 'in' });
    NODES = out;
    BY = new Map(NODES.map((n) => [n.id, n]));
    PL = queues();
  }

  // 暫存區: a 投料區 for each station (the processing stations first, raw side first, the assembly last) with what the
  // station still has to take in this week — a processing station's batches not started yet, the assembly's dishes not
  // assembled yet — against the stock kept for it. An item only one 投料區 takes counts the whole bag; one that several
  // take has a count of its own in each (S.zone), typed in on each, and the bag holds their sum. Each item: need, have,
  // lack, made (an item a station makes, not one to buy or gather), shared. cut lists the missing items the shop limits
  // can't cover, on the last 投料區 that takes them.
  function makeZones(stations) {
    const made = new Set(P.steps.map((s) => s.name));
    ZONES = stations.map((n) => {
      const need = new Map();
      for (const s of n.lane.steps) {
        let todo = s.batches;
        if (P.dishSet.has(s.name)) { const r = PR.assemble.find((x) => x.item === s.name); todo = r ? Math.max(0, r.plan - r.done) / yieldOf(s.r) : 0; }
        else if (!quick(s)) { const r = PR.process.find((x) => x.item === s.name); if (r) todo = Math.max(0, r.plan - r.done - r.running); }
        for (const i of s.r.inputs) if (todo > 0) need.set(i.item, (need.get(i.item) || 0) + i.qty * todo);
      }
      return { id: `zone:${n.lane.name}`, kind: 'warehouse', title: `${n.title}投料區`, station: n, zone: 'in',
        items: [...need].map(([name, q]) => ({ name, need: Math.ceil(q), made: made.has(name), mat: A.mats.find((m) => m.name === name) })) };
    });
    for (const name of new Set(ZONES.flatMap((z) => z.items.map((i) => i.name)))) if (takers(name).length > 1) settle(name);
    for (const z of ZONES) {
      for (const i of z.items) { i.shared = takers(i.name).length > 1; i.have = stockIn(z, i.name); i.lack = Math.max(0, i.need - i.have); }
      z.cut = new Set(z.items.filter((i) => i.lack && i.mat && i.mat.short && takers(i.name).pop() === z).map((i) => i.name));
    }
    return ZONES;
  }
  const takers = (name) => ZONES.filter((z) => z.items.some((i) => i.name === name));
  const stockIn = (z, name) => (takers(name).length > 1 ? Math.max(0, Math.floor(Number((S.zone[name] || {})[z.id])) || 0) : held(name));
  // The 投料區 an item's shortage lands on (the last that takes it), else the first.
  const zoneFor = (name) => { const z = takers(name).pop() || ZONES[0]; return z ? z.id : ''; };
  // A shared item's counts take d more or less: more goes to the first 投料區 up to what each still needs, the rest to
  // the last; less comes off the last first.
  function spread(name, d) {
    const zs = takers(name), z = S.zone[name], need = (x) => x.items.find((i) => i.name === name).need;
    if (d > 0) zs.forEach((x, k) => { const add = k === zs.length - 1 ? d : Math.min(d, Math.max(0, need(x) - (z[x.id] || 0))); z[x.id] = (z[x.id] || 0) + add; d -= add; });
    else for (const x of zs.slice().reverse()) { const off = Math.min(z[x.id] || 0, -d); z[x.id] = (z[x.id] || 0) - off; d += off; }
  }
  // A shared item's counts kept to its 投料區 now and adding up to the bag (a change made on the planner page is spread).
  function settle(name) {
    const zs = takers(name), z = S.zone[name] = S.zone[name] && typeof S.zone[name] === 'object' ? S.zone[name] : {};
    for (const k of Object.keys(z)) if (zs.some((x) => x.id === k)) z[k] = Math.max(0, Math.floor(Number(z[k])) || 0); else delete z[k];
    spread(name, held(name) - zs.reduce((t, x) => t + (z[x.id] || 0), 0));
  }
  // A shared item's count typed in on one 投料區; the bag becomes the sum.
  function setZone(id, name, n) {
    const zs = takers(name), z = S.zone[name] || (S.zone[name] = {});
    z[id] = Math.max(0, Math.floor(Number(n)) || 0);
    const sum = zs.reduce((t, x) => t + (z[x.id] || 0), 0);
    if (sum) S.have[name] = sum; else delete S.have[name];
  }
  // A purchase, a round or a dish moves a shared item in the 投料區 it belongs to: what a step takes or gives back in its
  // station's, a round given back in that station's, anything else spread.
  onStock((name, d, why) => {
    const zs = takers(name);
    if (zs.length < 2) return;
    const z = S.zone[name] || (S.zone[name] = {});
    spread(name, held(name) - d - zs.reduce((t, x) => t + (z[x.id] || 0), 0));
    const own = why.use ? zs.find((x) => x.station.lane.steps.some((s) => s.name === why.use)) : why.lane ? zs.find((x) => x.station.lane.name === why.lane) : null;
    if (own) { const was = z[own.id] || 0; z[own.id] = Math.max(0, was + d); d -= z[own.id] - was; }
    spread(name, d);
  });

  /* ---------- stations' queues ---------- */
  // Clock times in this browser's time zone: 14:05, 明天 01:20, 10/28 09:00.
  const hm = (ms) => {
    const d = new Date(ms), day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(d) - day(new Date())) / 864e5), t = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    return diff === 0 ? t : diff === 1 ? `明天 ${t}` : diff === -1 ? `昨天 ${t}` : `${d.getMonth() + 1}/${d.getDate()} ${t}`;
  };
  const secsOf = (name) => { const s = P.steps.find((x) => x.name === name); return s ? s.secs : null; };
  // Every station from now: its places (`queue` of them, see slotsOf) and the batches still to put in (seq) — in the
  // order chosen, the rest raw side first. Until the places are first used this week they hold the first batches,
  // waiting for 開工 (stored false). A place's state: wait (等開工), queue (started, behind another), run, done (its time
  // is up, or isn't known). short is what the station's 投料區 lacks for the waiting batches; end is when everything
  // would be made, one batch after another (null when a time isn't known).
  function queues() {
    const now = Date.now(), out = new Map();
    for (const n of NODES) {
      if (n.kind !== 'machine') continue;
      const L = n.lane, steps = L.steps.filter((x) => !quick(x)), size = Math.max(1, L.queue || 1), stored = slotsOf(L.name);
      const left = new Map(steps.map((x) => [x.name, Math.max(0, x.batches - (Math.floor(Number(S.done.processed[x.name])) || 0))]));
      const take = (name) => { if (!(left.get(name) > 0)) return false; left.set(name, left.get(name) - 1); return true; };
      // a started batch is real; a waiting one the plan no longer wants drops out; the batches fill from the top
      const places = Array.from({ length: size }, (_, k) => (stored && stored[k]) || null);
      for (const x of places) if (x && x.at != null) take(x.name);
      places.forEach((x, k) => { if (x && x.at == null && !take(x.name)) places[k] = null; });
      const filled = places.filter(Boolean);
      places.splice(0, size, ...filled, ...Array(size - filled.length).fill(null));
      const seq = [];
      for (const name of (S.done.proc[L.name] || {}).order || []) if (take(name)) seq.push(name);
      for (const x of steps) while (take(x.name)) seq.push(x.name);
      if (!stored) for (let k = 0; k < size && seq.length; k++) places[k] = { name: seq.shift(), at: null };
      const slots = places.map((x, k) => {
        if (!x) return null;
        if (x.at == null) return { k, name: x.name, state: 'wait' };
        const secs = secsOf(x.name), end = secs == null ? null : x.at + secs * 1000;
        return { k, name: x.name, end, state: end == null || end <= now ? 'done' : x.at <= now ? 'run' : 'queue' };
      });
      // against what this station's 投料區 holds
      const need = new Map(), z = ZONES.find((x) => x.station === n), have = (item) => (z ? stockIn(z, item) : held(item));
      for (const s of slots) if (s && s.state === 'wait') for (const i of REC.get(s.name).inputs) need.set(i.item, (need.get(i.item) || 0) + i.qty);
      const short = [...need].filter(([item, qty]) => have(item) < qty).map(([item, qty]) => ({ item, lack: qty - have(item) }));
      let end = Math.max(now, ...slots.filter((s) => s && s.end != null).map((s) => s.end));
      let known = slots.every((s) => !s || s.state === 'wait' || s.end != null);
      for (const name of [...slots.filter((s) => s && s.state === 'wait').map((s) => s.name), ...seq]) { const x = secsOf(name); if (x == null) known = false; else end += x * 1000; }
      out.set(L.name, { node: n, lane: L, size, stored: !!stored, places, slots, seq, short, end: known ? end : null, busy: slots.some(Boolean) || seq.length > 0 });
    }
    return out;
  }
  // The stations together: when everything is made (null when a time isn't known).
  function procSummary() {
    const ends = [...PL.values()].filter((q) => q.busy).map((q) => q.end);
    return { busy: ends.length > 0, finish: ends.length && ends.every((x) => x != null) ? Math.max(...ends) : null };
  }

  /* ---------- statuses ---------- */
  const VERB = { processed: '已完成', assembled: '已組裝' };
  // The progress lines a point answers for.
  function rowsOf(n) {
    if (n.kind === 'shop') return PR.buy.filter((r) => `shop:${r.shop.who}|${r.shop.town || r.shop.note}` === n.id);
    if (n.kind === 'field' || n.kind === 'unknown') return PR.gather.filter((r) => n.items.some((i) => i.name === r.item));
    if (n.kind === 'machine') return PR.process.filter((r) => r.step.lane === n.lane.name);
    if (n.kind === 'assembly' || n.kind === 'fg') return PR.assemble;
    return [];
  }
  const tally = (rows) => [rows.reduce((t, r) => t + Math.min(r.done, r.plan), 0), rows.reduce((t, r) => t + r.plan, 0)];
  // [colour key, short text] for a point: red for a shortage or missing data, otherwise how far this week's actuals
  // have got — grey not started, yellow under way or ready to do, green done.
  function statusOf(n) {
    // A shop: every character's limit used up is 已買滿.
    if (n.kind === 'shop') {
      const per = n.items.flatMap((i) => i.buy.per), B = per.reduce((t, x) => t + x.bought, 0), L = per.length * SHOP.limit;
      if (n.items.some((i) => i.mat.short)) return ['bad', B >= L ? '買滿仍缺' : '異常'];
      return B >= L ? ['ok', '已買滿'] : B ? ['wait', '買了一些'] : ['idle', '還沒買'];
    }
    // Gathering: what the stock still lacks after the shops' share.
    if (n.kind === 'field' || n.kind === 'unknown') {
      const left = n.items.reduce((t, i) => t + i.mat.get, 0);
      if (!left) return ['ok', n.kind === 'field' ? '已採齊' : '已取得'];
      if (n.kind === 'unknown') return ['bad', '來源待補'];
      return [n.items.some((i) => i.mat.stock) ? 'wait' : 'idle', `還要採 ${fmt(left)}`];
    }
    if (n.kind === 'machine' && n.lane.steps.some((s) => s.secs == null)) return ['bad', '時間待補'];
    // A station: a batch to collect (領料), one under way, or batches waiting for 開工 (and whether the 投料區 has
    // what they take).
    if (n.kind === 'machine') {
      const q = PL.get(n.lane.name), has = (st) => q.slots.some((s) => s && s.state === st);
      if (!q || !q.busy) return rowsOf(n).length ? ['ok', '加工完成'] : ['idle', '—'];
      if (has('done')) return ['ok', '可領料'];
      if (has('run') || has('queue')) return ['wait', '做中'];
      if (has('wait')) return q.short.length ? ['idle', '等料'] : ['wait', '可開工'];
      return ['idle', '設備空著'];
    }
    // A 投料區: its stock against what its station still takes in; 缺料 when a missing item is one the shop limits can't
    // cover.
    if (n.kind === 'warehouse') {
      if (!n.items.length) return ['ok', '都投料了'];
      const ok = n.items.filter((i) => !i.lack).length;
      if (ok === n.items.length) return ['ok', '齊料'];
      if (n.cut.size) return ['bad', '缺料'];
      return ok ? ['wait', `齊 ${ok}/${n.items.length} 樣`] : ['idle', '還沒備料'];
    }
    const rows = rowsOf(n);
    if (!rows.length) return ['idle', n.kind === 'fg' ? '沒有訂單' : '—'];
    const [d, p] = tally(rows);
    if (d >= p) return ['ok', { machine: '加工完成', assembly: '組裝完成', fg: '全部入庫' }[n.kind] || `完成 ${fmt(d)}`];
    if (d > 0) return ['wait', `${n.kind === 'fg' ? '入庫' : VERB[rows[0].kind]} ${fmt(d)}/${fmt(p)}`];
    if (n.kind === 'assembly') return PR.assemble.every((r) => r.ready) ? ['wait', '可組裝'] : ['idle', '等加工'];
    return ['idle', n.kind === 'fg' ? `0/${fmt(p)}` : '未開始'];
  }

  /* ---------- blocks: every point as a card, one column per stage ---------- */
  const STAGES = [['out', W.outside], ['warehouse', W.warehouse], ['machine', '加工'], ['assembly', '組裝'], ['fg', W.fg]];
  const stageOf = (n) => (n.zone === 'out' ? 'out' : n.kind);

  // The few lines that say what a point needs this week and how far it has got; the panel has the rest.
  function blockLines(n) {
    const line = (name, v, cls = '') => `<span class="ln ${cls}"><span>${esc(name)}</span><span>${v}</span></span>`;
    const dp = (r) => `${fmt(r.done)}／${fmt(r.plan)}`;
    // a shop: what every character can still buy there; gathering: what is still to gather; a 投料區: its stock against
    // what its station still takes in, raw materials and made items apart
    if (n.kind === 'shop') return n.items.map((i) => {
      const left = i.buy.per.length * SHOP.limit - i.buy.bought;
      return line(i.name, left ? `還能買 ${fmt(left)}` : '買滿', i.mat.short ? 'bad' : left ? '' : 'ok');
    }).join('');
    if (n.kind === 'field' || n.kind === 'unknown') return n.items.map((i) => line(i.name, i.mat.get ? `還要採 ${fmt(i.mat.get)}` : '齊', i.mat.get ? '' : 'ok')).join('');
    if (n.kind === 'warehouse') {
      // raw materials, a dashed line, then made items
      const ln = (i) => line(i.name, `${fmt(i.have)}／${fmt(i.need)}`, n.cut.has(i.name) ? 'bad' : i.lack ? '' : 'ok');
      const rawLines = n.items.filter((i) => !i.made).map(ln).join(''), madeLines = n.items.filter((i) => i.made).map(ln).join('');
      return [rawLines, madeLines].filter(Boolean).join('<span class="blk-cut" aria-hidden="true"></span>') || line('都投料了', '');
    }
    if (n.kind === 'machine') {
      const L = n.lane, q = PL.get(L.name);
      const now = !q || !q.busy ? '都做完了' : `設備 ${q.slots.filter(Boolean).length}/${q.size} 格・排程還有 ${q.seq.length} 批`;
      return rowsOf(n).map((x) => line(x.item, `${dp(x)} 批`, x.done >= x.plan ? 'ok' : '')).join('')
        + `<span class="foot">${esc(now)}${L.queue == null ? '・排程上限待補' : ''}</span>`;
    }
    if (n.kind === 'assembly') {
      const made = new Set(P.steps.map((s) => s.name)), inputs = [...new Set(n.lane.steps.flatMap((s) => s.r.inputs.map((i) => i.item)))];
      return PR.assemble.map((r) => line(r.item, dp(r), r.done >= r.plan ? 'ok' : '')).join('')
        + `<span class="foot">直接料 ${esc(inputs.filter((i) => !made.has(i)).join('、') || '—')}・加工料 ${esc(inputs.filter((i) => made.has(i)).join('、') || '—')}</span>`;
    }
    return (PR.assemble.map((r) => line(r.item, dp(r), r.done >= r.plan ? 'ok' : '')).join('') || line('沒有訂單', ''))
      + '<span class="foot">點一下看訂單</span>';
  }
  function blocksHTML() {
    return `<div class="flow">${STAGES.map(([key, title]) => {
      const list = NODES.filter((n) => stageOf(n) === key);
      if (!list.length) return '';
      return `<section class="stage"><h3>${esc(title)}</h3>${list.map((n) => {
        const [k, text] = statusOf(n);
        return `<button class="blk ${k}${sel === n.id ? ' sel' : ''}" type="button" data-go="${esc(n.id)}" data-blk="${esc(n.id)}">
          <span class="blk-head"><span class="blk-name">${esc(n.title)}</span><span class="badge ${k}">${esc(text)}</span></span>
          ${blockLines(n)}</button>`;
      }).join('')}</section>`;
    }).join('')}</div>`;
  }

  /* ---------- the side panel ---------- */
  const badge = ([k, text]) => `<span class="badge ${k}"><i class="dot" style="background:${THEME.status[k]}"></i>${esc(text)}</span>`;
  const barHTML = (f, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, f * 100)).toFixed(0)}%"></i></div>`;
  const goHTML = (id, label, sub) => `<button class="go" type="button" data-go="${esc(id)}"><b>${label}</b>${sub ? `<div class="muted">${sub}</div>` : ''}</button>`;

  // Ways out of a shortage of a shop-only material, worked out from the numbers.
  function remedies(m) {
    const perChar = m.s.shops.length * SHOP.limit, toBuy = Math.max(0, m.want - m.base), tips = [];
    const need = chars() + Math.ceil(m.short / perChar);
    if (chars() < MAX_CHARS) tips.push(need <= MAX_CHARS ? `加到 ${need} 隻角色去買就夠（每多一隻，這樣東西本週多 ${fmt(perChar)} 個）。` : `角色加到上限 ${MAX_CHARS} 隻也還缺 ${fmt(m.short - (MAX_CHARS - chars()) * perChar)}。`);
    tips.push(`分週做：照現在 ${chars()} 隻角色，要 ${Math.ceil(toBuy / (perChar * chars()))} 週才買得齊；這週先做上限，剩的下週再排。`);
    tips.push('到訂單按「編輯」，把數量改成上限，或把比較要緊的料理往上移，讓它先分到。');
    const other = m.s.src.filter((x) => x.kind === 'barter' || x.kind === 'loot');
    if (other.length) tips.push(`還有其他來源沒算進去：${other.map(sourceText).join('、')}。`);
    tips.push('手上有庫存的話，在暫存區填「現有庫存」。');
    return tips;
  }
  function shortageHTML(m) {
    const cut = A.rows.filter((o) => o.n < o.qty && o.stuck.includes(m.name));
    return `<div class="sec alert"><h3>異常・${esc(m.name)}原物料不足</h3>
      <dl class="kv">
        <dt>訂單要</dt><dd>${fmt(m.want)}</dd>
        <dt>本週最多</dt><dd>${fmt(m.s.cap)}（已有 ${fmt(m.base)} ＋ 還能買 ${fmt(m.s.buyCap)}：${esc(m.s.shops.map((x) => x.who).join('＋'))}，每家每隻 ${SHOP.limit} 個 × ${chars()} 隻）</dd>
        <dt>缺</dt><dd class="bad-text">${fmt(m.short)}</dd>
      </dl>
      ${cut.length ? `<h4>影響</h4><ul class="rows">${cut.map((o) => `<li><span>${nameHTML(o.dish)}<span class="muted">・想做 ${fmt(o.qty)}，只能做 ${fmt(o.n)}</span></span></li>`).join('')}</ul>` : ''}
      <h4>可以怎麼做</h4><ul class="tips">${remedies(m).map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
    </div>`;
  }

  // A 投料區 in the panel, two blocks: each raw material's need and what its stock still lacks, then each made item's
  // need and the batches still to make (one made ahead cuts them); each block's 填現有庫存 opens the form for it.
  function storeHTML(n) {
    const open = (group) => (i, right) => `<li><button class="go buy-line" type="button" data-stockopen="${esc(n.id)}|${group}"><span>${nameHTML(i.name)}</span>
      <span class="num">${right}</span></button><span class="sub">需要 ${fmt(i.need)}・現有 ${fmt(i.have)}${i.shared ? '・共用料，這區自己的數量' : ''}</span></li>`;
    const ok = '<span class="ok-text">✓ 夠了</span>';
    const rawRows = n.items.filter((i) => !i.made).map((i) => open('raw')(i, i.lack ? `<span class="bad-text">還缺 ${fmt(i.lack)}</span>` : ok));
    const madeRows = n.items.filter((i) => i.made).map((i) => {
      const r = PR.process.find((x) => x.item === i.name), left = r ? Math.max(0, r.plan - r.done - r.running) : 0;
      return open('made')(i, !i.lack ? ok : left ? `還要做 ${fmt(left)} 批` : `還缺 ${fmt(i.lack)}`);
    });
    const box = (group, title, rows) => (rows.length ? `<div class="store-box"><h3>${title}</h3><ul class="rows">${rows.join('')}</ul>
      <button class="btn primary buy-open" type="button" data-stockopen="${esc(n.id)}|${group}">填${group === 'raw' ? '原料' : '加工品'}現有庫存</button></div>` : '');
    return `<div class="sec">${(box('raw', '原料', rawRows) + box('made', '加工品・可以先做好放著', madeRows)) || '<p class="muted" style="margin:0">這週要用的料都投進去了。</p>'}</div>`;
  }
  // A shop in the panel: what it sells and how many have been bought this week; 填已購買 opens the form.
  function shopHTML(n) {
    const rows = n.items.map((i) => `<li><button class="go buy-line" type="button" data-buyopen="${esc(n.id)}"><span>${nameHTML(i.name)}</span>
      <span class="num">已買 ${fmt(i.buy.bought)}／${fmt(i.buy.per.length * SHOP.limit)}</span></button></li>`).join('');
    return `<div class="sec"><ul class="rows">${rows}</ul><button class="btn primary buy-open" type="button" data-buyopen="${esc(n.id)}">填已購買</button></div>`;
  }

  // A station in the panel: 開工 and what the 投料區 lacks on top (while batches wait in its places), then its places —
  // empty, 等開工 (with each batch's time), 排隊 or 做中 (with when it is made), or 做好了 with 領料; any not finished can
  // be taken back out (✕), and with the lock open (測試) finished at once (直接完成) — then the batches still to put in,
  // dragged by ⠿ into another order or into an empty place, or put in with 加入 (no times there).
  let testing = false;
  function placeNote(s) {
    if (s.state === 'wait') { const x = secsOf(s.name); return `等開工・${x == null ? '時間待補' : `每批 ${fmtDur(x)}`}`; }
    if (s.end == null) return `${s.state === 'done' ? '做好了' : s.state === 'run' ? '做中' : '排隊'}・時間待補`;
    return s.state === 'done' ? `${hm(s.end)} 做好` : `${s.state === 'run' ? '做中' : '排隊'}・${hm(s.end)} 好`;
  }
  function queueHTML(q) {
    const lane = esc(q.lane.name), empty = q.slots.some((s) => !s);
    const top = q.slots.some((s) => s && s.state === 'wait')
      ? `<div class="sec"><div class="round-act"><button class="btn primary" type="button" data-start="${lane}">開工</button><span>按下去就從現在開始算</span></div>
        ${q.short.length ? `<p class="note bad-text">庫存不夠：${esc(q.short.map((x) => `${x.item} 差 ${fmt(x.lack)}`).join('、'))}</p>` : ''}</div>` : '';
    const places = q.slots.map((s, k) => (!s
      ? `<div class="slot place empty" data-place="${k}" data-lane="${lane}"><span class="no">${k + 1}</span><span>空</span></div>`
      : `<div class="slot place ${s.state}"><span class="no">${k + 1}</span><span class="what">${nameHTML(s.name)}<small>${esc(placeNote(s))}</small></span>
        <span class="mv">${s.state === 'done' ? `<button class="btn primary small" type="button" data-collect="${lane}|${k}">領料</button>`
          : `${testing ? `<button class="btn small" type="button" data-finish="${lane}|${k}">直接完成</button>` : ''}<button class="btn small" type="button" data-unslot="${lane}|${k}" aria-label="取消${esc(s.name)}，原料退回">✕</button>`}</span></div>`)).join('');
    const lock = `<button class="btn small" type="button" data-testlock aria-pressed="${testing}" title="打開後設備裡的批數可以直接完成，測試用">${testing ? '🔓 測試' : '🔒'}</button>`;
    const seq = q.seq.map((name, i) => `<div class="slot" data-slot="${i}" data-lane="${lane}">
        <span class="grip" title="拖拉換順序" aria-hidden="true">⠿</span><span class="no">${i + 1}</span><span class="what">${nameHTML(name)}</span>
        <span class="mv"><button class="btn small" type="button" data-place-in="${lane}|${i}"${empty ? '' : ' disabled'}>加入</button></span></div>`).join('');
    return `${top}<div class="sec"><h3 class="ord-h">設備<span>${q.slots.filter(Boolean).length}/${q.size} 格${q.lane.queue == null ? '・上限待補，先當 1 格' : ''} ${lock}</span></h3>${places}</div>
      <div class="sec"><h3 class="ord-h">排程<span>還有 ${fmt(q.seq.length)} 批</span></h3>${seq || '<p class="muted" style="margin:0">沒有要排的了。</p>'}
        ${q.seq.length ? '<p class="note">拖 ⠿ 換順序，或拖進上面的空格。</p>' : ''}</div>`;
  }

  function overviewHTML() {
    const alarms = A.mats.filter((m) => m.short).map((m) => goHTML(zoneFor(m.name), `${esc(m.name)}原物料不足，缺 ${fmt(m.short)}`, `${esc(m.users.join('、'))}做不滿・點開看對策`));
    const issues = [];
    if (BY.has('unknown')) issues.push(goHTML('unknown', '有原料來源待補', esc(BY.get('unknown').items.map((i) => i.name).join('、'))));
    for (const n of NODES) if (n.kind === 'machine' && n.lane.steps.some((s) => s.secs == null)) issues.push(goHTML(n.id, `${esc(n.title)}的時間待補`, '補上才能排時間'));
    for (const n of NODES) if (n.kind === 'machine' && n.lane.queue == null) issues.push(goHTML(n.id, `${esc(n.title)}的排程上限待補`, '先當一次排 1 批'));
    return `<div class="panel-head"><div class="kind">總覽</div><h2>訂單</h2></div>
      ${ordersHTML()}
      <div class="sec"><h3>本週進度</h3>${barHTML(PR.total ? PR.finished / PR.total : 0, 'done')}<p class="note">完成 ${fmt(PR.finished)}／${fmt(PR.total)} 項（買、採、加工、組裝每一項做滿算一項）</p></div>
      <div class="sec${alarms.length ? ' alert' : ''}"><h3>異常</h3>${alarms.length ? `<ul class="rows">${alarms.map((x) => `<li>${x}</li>`).join('')}</ul>` : '<p class="muted" style="margin:0">沒有異常，原物料都夠。</p>'}</div>
      ${issues.length ? `<div class="sec"><h3>待補</h3><ul class="rows">${issues.map((x) => `<li>${x}</li>`).join('')}</ul></div>` : ''}`;
  }

  function nodeHTML(n) {
    const st = statusOf(n);
    const head = `<div class="panel-head"><button class="back" type="button" data-go="">◀ 訂單</button><div class="kind">${esc(W[n.kind])}</div><h2>${esc(n.title)} ${badge(st)}</h2></div>`;
    // A station's actuals, the same as on the completion list.
    const mine = n.kind === 'machine' || n.kind === 'assembly' ? rowsOf(n) : [];
    const actual = mine.length ? `<div class="sec"><h3>${n.kind === 'machine' ? '已完成・要修正再改' : '實績・本週'}</h3>${mine.map((r) => (r.kind === 'assembled'
      ? doneRow(r, r.done >= r.plan ? '' : r.ready ? '<em class="go-on">可以組裝</em>' : `<em>等：${esc(r.waiting.join('、'))}</em>`, 'p', !r.ready && r.done < r.plan)
      : doneRow(r, r.kind === 'processed' && r.waiting.length && r.done < r.plan ? `<em>等料：${esc(r.waiting.join('、'))}還沒齊</em>` : '', 'p'))).join('')}</div>` : '';
    if (n.kind === 'shop') {
      return head + shopHTML(n);
    }
    if (n.kind === 'field' || n.kind === 'unknown') {
      // Only how many are still to gather; what is gathered goes into the stock on the 投料區 that takes it.
      const z = BY.get(zoneFor(n.items[0].name));
      const wh = z ? `<button class="go" type="button" data-go="${esc(z.id)}" style="display:inline;width:auto"><b>${esc(z.title)}</b></button>` : '暫存區';
      return head + `<div class="sec"><ul class="rows">${n.items.map((i) => `<li><span>${nameHTML(i.name)}</span>
          <span class="num${i.mat.get ? '' : ' ok-text'}">${i.mat.get ? `${n.kind === 'field' ? '要採' : '要拿'} ${fmt(i.mat.get)}` : '✓ 齊了'}</span></li>`).join('')}</ul>
        <p class="note">${n.kind === 'unknown' ? '還不知道在哪拿，先當成不限量。拿到後' : '採回來後'}到${wh}填現有庫存，這裡就會跟著減少。</p></div>`;
    }
    // the 異常 alarms open the 投料區 a shortage lands on (zoneFor), so each shortage is told there
    if (n.kind === 'warehouse') return head + storeHTML(n) + n.items.filter((i) => i.mat && i.mat.short && zoneFor(i.name) === n.id).map((i) => shortageHTML(i.mat)).join('');
    if (n.kind === 'machine') {
      // 已完成: the week's 領料, newest first; 退回 puts one back
      const L = n.lane, q = PL.get(L.name), lane = esc(L.name);
      const log = logOf(L.name).map((e, i) => [e, i]).reverse().map(([e, i]) => `<li><span>${nameHTML(e.name)} ×${fmt(yieldOf(REC.get(e.name)))}<span class="muted">・${esc(hm(e.done))} 領料${e.test ? '・測試' : ''}</span></span>
          <span><button class="btn small" type="button" data-unlog="${lane}|${i}">退回</button></span></li>`).join('');
      const tally = rowsOf(n).map((r) => `${r.item} ${fmt(r.done)}/${fmt(r.plan)} 批`).join('・');
      return head + (q ? queueHTML(q) : '') + `<div class="sec"><h3 class="ord-h">已完成<span>${esc(tally)}</span></h3>
        ${log ? `<ul class="rows">${log}</ul>` : '<p class="muted" style="margin:0">還沒有領料。做好的批數按「領料」會記在這裡。</p>'}</div>`;
    }
    if (n.kind === 'assembly') {
      const L = n.lane, need = new Map(), made = new Set(P.steps.map((s) => s.name));
      for (const s of L.steps) for (const i of s.r.inputs) need.set(i.item, (need.get(i.item) || 0) + s.batches * i.qty);
      return head + actual + `<div class="sec"><h3>需求・本週組裝</h3><ul class="rows">${L.steps.map((s) => `<li><span>${nameHTML(s.name)}</span><span class="num">${fmt(s.batches)} 個</span>
          <span class="sub">一個用 ${esc(s.r.inputs.map((i) => `${i.item} ×${i.qty}`).join('、'))}</span></li>`).join('')}</ul><p class="note">組裝只要十幾秒，不計時。</p></div>
        <div class="sec"><h3>要備齊的料</h3><ul class="rows">${[...need].map(([item, q]) => `<li><span>${nameHTML(item)}<span class="muted">${made.has(item) ? '・加工料，從加工站來' : '・直接料，先放這裡等'}</span></span><span class="num">${fmt(q)}</span></li>`).join('')}</ul></div>`;
    }
    // 訂單 is the panel's default view (see pick).
    return head;
  }

  function renderPanel() {
    const n = sel && BY.get(sel);
    $('panel').innerHTML = n ? nodeHTML(n) : overviewHTML();
  }

  /* ---------- the wish list and the materials it takes ---------- */
  const stepper = (key, value, label, step) => `<span class="stepper"><button class="btn" type="button" data-step="${key}|-${step}" aria-label="${label}少 ${step}">−${step}</button><input data-num="${key}" data-f="n:${key}" inputmode="numeric" value="${value}" aria-label="${label}"><button class="btn" type="button" data-step="${key}|${step}" aria-label="${label}多 ${step}">+${step}</button></span>`;
  // One order line's status: from its 成品倉 row (a dish ordered on two lines is assembled as one, its stock counted
  // on the first line).
  function orderStatus(o) {
    const r = PR.assemble.find((x) => x.item === o.dish), first = A.rows.find((x) => x.dish === o.dish).i;
    if (!r) return ['bad', '做不了'];
    if (first !== o.i) return ['idle', `跟第 ${first + 1} 道一起入庫`];
    if (r.done >= r.plan) return ['ok', '已入庫'];
    if (r.ready) return ['wait', '可以組裝'];
    return ['idle', PR.process.some((p) => p.done < p.plan) ? '等加工' : '等料'];
  }
  // 訂單, the panel's default view, shown only: the wish list, each dish and how many, with what the week can make of
  // it and its status in small type, then 已入庫. 編輯 opens the whole list in one form, 填已入庫 the stock of dishes.
  function ordersHTML() {
    const [inD, inP] = tally(PR.assemble);
    const rows = A.rows.map((o) => `<div class="ord-row">
        <span class="wish-n">${o.i + 1}</span>
        <span class="ord-name">${nameHTML(o.dish)}</span>
        <span class="ord-qty">×${fmt(o.qty)}</span>
        <small class="ord-cap"><span${o.n < o.qty ? ' class="ord-cut"' : ''}>可做 ${fmt(o.n)}</span>${o.max < Infinity ? `・上限 ${fmt(o.max)}` : ''}</small>
        ${badge(orderStatus(o))}
      </div>`).join('');
    return `<div class="sec orders-sec"><h3 class="ord-h">需求清單<button class="btn small" type="button" data-oopen>編輯</button></h3>
      ${rows || '<p class="muted" style="margin:0">還沒有訂單，按「編輯」加一道菜。</p>'}
      ${A.rows.length > 1 ? '<p class="note">越上面越先分到限購材料。</p>' : ''}
    </div>
    ${inP ? `<div class="sec orders-sec"><h3 class="ord-h">已入庫<span><b>${fmt(inD)}</b>／${fmt(inP)}</span></h3>
      ${barHTML(inD / inP, 'done')}
      <button class="btn primary buy-open" type="button" data-inopen>填已入庫</button>
    </div>` : ''}`;
  }
  /* ---------- a station's finished counts ---------- */
  const FILL = { bought: '買齊', gathered: '採齊', processed: '全部完成', assembled: '全部入庫' };
  const UNIT = { bought: '個', gathered: '個', processed: '批', assembled: '個' };
  const doneInput = (r, where, locked) => `<input class="have" data-done="${r.kind}|${esc(r.key)}" data-f="${where}:${r.kind}|${esc(r.key)}" inputmode="numeric" value="${r.done || ''}" placeholder="0"${locked ? ' disabled' : ''} aria-label="${esc(r.item)} ${VERB[r.kind]}">`;
  const fillButton = (r, locked) => (r.done >= r.plan
    ? `<button class="btn small" type="button" data-donefill="${r.kind}|0|${esc(r.key)}">清除</button>`
    : `<button class="btn small" type="button" data-donefill="${r.kind}|${r.plan}|${esc(r.key)}"${locked ? ' disabled' : ''}>${FILL[r.kind]}</button>`);
  // One line: tick, what and where, the plan, the actual and a button that fills it to plan (or clears it).
  function doneRow(r, sub, where, locked = false) {
    const done = r.done >= r.plan;
    return `<div class="done-row${done ? ' is-done' : ''}${locked ? ' is-locked' : ''}">
      <span class="chk" aria-hidden="true">${done ? '✓' : ''}</span>
      <span class="what">${nameHTML(r.item)}${sub ? `<small>${sub}</small>` : ''}</span>
      <span class="plan">計畫 ${fmt(r.plan)} ${UNIT[r.kind]}</span>
      <label class="act">${VERB[r.kind]}${doneInput(r, where, locked)}</label>
      ${fillButton(r, locked)}
    </div>`;
  }
  const haveInput = (name, where = 'h') => `<input class="have" data-have="${esc(name)}" data-f="${where}:${esc(name)}" inputmode="numeric" value="${held(name) || ''}" placeholder="0" aria-label="${esc(name)} 庫存">`;
  // A shared item's count in one 投料區 (see setZone).
  const zoneInput = (z, name) => `<input class="have" data-zh="${esc(z.id)}|${esc(name)}" data-f="zh:${esc(z.id)}|${esc(name)}" inputmode="numeric" value="${stockIn(z, name) || ''}" placeholder="0" aria-label="${esc(z.title)} ${esc(name)} 庫存">`;
  // 原物料: one table per 投料區 — what its station still takes in and its stock (a shared item's own count there; what
  // to buy and gather is the item's whole) — then any left over, then the made items.
  function matsHTML() {
    const rank = (m) => (m.s.limited ? 0 : m.s.buyCap ? 1 : m.s.gather ? 2 : 3);
    const mats = A.mats.filter((m) => m.need || m.short).sort((a, b) => rank(a) - rank(b) || b.util - a.util || b.need - a.need);
    const row = (m, need, stock, shared) => {
      const s = m.s, pct = Math.round(m.util * 100);
      const tag = m.short ? badge(['bad', `異常・缺 ${fmt(m.short)}`]) : s.limited ? badge([m.util >= 0.9 ? 'wait' : 'ok', '限購']) : s.gather ? badge(['idle', '可採集']) : s.unknown ? badge(['bad', '來源待補']) : '';
      const where = [...m.shops.map((sh) => `${sh.who} ${fmt(sh.qty)}`), m.get ? (s.gather ? `採：${s.src.find((x) => x.kind === 'gather').text}` : '來源待補') : ''].filter(Boolean);
      return `<tr>
        <th scope="row">${nameHTML(m.name)} ${tag}${shared ? ` ${badge(['idle', '共用'])}` : ''}</th>
        <td class="num">${fmt(need)}</td>
        <td>${stock}</td>
        <td class="num">${s.buyCap ? `${fmt(m.buy)}<small>／${fmt(s.buyCap)}</small>${barHTML(m.util, pct >= 100 ? (s.limited ? 'full' : 'cap') : '')}` : '—'}</td>
        <td class="num">${m.get ? fmt(m.get) : '—'}</td>
        <td class="src">${esc(where.join('、') || '用庫存')}</td>
      </tr>`;
    };
    const table = (rows) => `<div class="table-wrap"><table><thead><tr><th>原物料</th><th class="r">還要用</th><th>庫存</th><th class="r">建議買／還能買</th><th class="r">要採</th><th>去哪</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    const zoned = new Set(), groups = ZONES.map((z) => {
      const rows = mats.filter((m) => z.items.some((i) => i.name === m.name && !i.made)).map((m) => {
        const i = z.items.find((x) => x.name === m.name);
        zoned.add(m.name);
        return row(m, i.need, i.shared ? zoneInput(z, m.name) : haveInput(m.name), i.shared);
      });
      return rows.length ? `<div class="mats-head mats-sub"><h3>${esc(z.title)}</h3><span class="muted">${rows.length} 種</span></div>${table(rows)}` : '';
    });
    const rest = mats.filter((m) => !zoned.has(m.name)).map((m) => row(m, Math.max(0, m.need - m.used), haveInput(m.name), false));
    if (rest.length) groups.push(`<div class="mats-head mats-sub"><h3>其他</h3><span class="muted">${rest.length} 種</span></div>${table(rest)}`);
    const rows = groups.join('');
    const made = P.steps.filter((s) => !P.dishSet.has(s.name));
    const madeRows = made.map((s) => `<tr>
        <th scope="row">${nameHTML(s.name)}</th>
        <td class="num">${fmt(s.batches)} 批</td>
        <td>${haveInput(s.name)}</td>
        <td class="num">${fmt(s.made)}</td>
        <td class="num">${fmt(s.need)}</td>
        <td class="src">${esc(s.equip || '設備待補')}${A.pool.get(s.name) ? `・剩 ${fmt(A.pool.get(s.name))} 個留到下週` : ''}</td>
      </tr>`).join('');
    const sum = (list, f) => list.reduce((t, x) => t + f(x), 0), rem = (m) => Math.max(0, m.need - m.used);
    return `<section class="card mats">
      <div class="mats-head"><h2>原物料</h2><span class="muted">${mats.length} 種，還要用 ${fmt(sum(mats, rem))} 個：庫存有 ${fmt(sum(mats, (m) => Math.min(m.stock, rem(m))))}、建議買 ${fmt(sum(mats, (m) => m.buy))}、要採 ${fmt(sum(mats, (m) => m.get))}</span></div>
      ${rows || '<p class="muted">這週不用原物料。</p>'}
      ${madeRows ? `<div class="mats-head mats-sub"><h3>加工品</h3><span class="muted">${made.length} 種，要做 ${fmt(sum(made, (s) => s.batches))} 批：做出 ${fmt(sum(made, (s) => s.made))} 個、要用 ${fmt(sum(made, (s) => s.need))} 個</span></div>
      <div class="table-wrap"><table><thead><tr><th>加工品</th><th class="r">要做</th><th>庫存</th><th class="r">做出</th><th class="r">要用</th><th>設備</th></tr></thead><tbody>${madeRows}</tbody></table></div>` : ''}
    </section>`;
  }

  function render() {
    // Keep the focused field (by data-f) and its caret across the rebuild.
    const a = document.activeElement, f = a && a.dataset ? a.dataset.f : null;
    const caret = f && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
    const scroll = $('panel') ? $('panel').scrollTop : 0;
    plan();
    if (sel && !BY.has(sel)) sel = null;
    const wk = shopWeek();
    $('week-line').textContent = `本週 ${wk.range}`;
    const short = A.mats.filter((m) => m.short);
    // The summary's results open where they come from; the character count is edited right here.
    const station = NODES.find((n) => n.kind === 'machine'), ps = procSummary();
    const sum = (k, v, go, cls = '') => (go != null ? `<button class="sum ${cls}" type="button" data-go="${esc(go)}"><span class="k">${k}</span><b>${v}</b></button>` : `<span class="sum ${cls}"><span class="k">${k}</span><b>${v}</b></span>`);
    $('app').innerHTML = `<div class="card summary">
        <button class="sum" type="button" data-jump="wish"><span class="k">可做／訂單</span><b>${fmt(P.qty)}／${fmt(A.rows.reduce((t, o) => t + o.qty, 0))}</b></button>
        <button class="sum" type="button" data-jump="stock"><span class="k">入庫</span><b>${fmt(tally(PR.assemble)[0])}／${fmt(P.qty)}</b></button>
        ${sum('異常', short.length ? esc(short.map((m) => `${m.name}缺 ${fmt(m.short)}`).join('、')) : '沒有', short.length ? zoneFor(short[0].name) : null, short.length ? 'bad' : '')}
        ${sum('加工', !ps.busy ? '都做完了' : ps.finish != null ? `${esc(hm(ps.finish))} 做完` : '時間待補', station ? station.id : null)}
        <span class="sum edit"><span class="k">幾隻角色去買${charsFromBoard() ? '（照佈告欄）' : ''}</span>${stepper('chars', chars(), '角色數', 1)}</span>
        <p class="sum-hint">可做、異常、加工是照你填的庫存、已購買、開工和入庫算出來的。點一下看是怎麼來的。角色最多 ${MAX_CHARS} 隻。</p>
      </div>
      <div class="layout">
        <div class="card plant-card">
          <div class="view-bar"><h2>廠區</h2></div>
          ${blocksHTML()}
          <div class="legend">${Object.entries(STATUS_TEXT).map(([k, text]) => `<span><i class="dot" style="background:${THEME.status[k]}"></i>${text}</span>`).join('')}<span>紅色「異常」是原物料不足，點暫存區看對策；點一格看詳細。</span></div>
        </div>
        <aside class="card panel" id="panel"></aside>
        <div class="left">${matsHTML()}</div>
      </div>`;
    renderPanel();
    $('panel').scrollTop = scroll;
    if (f) {
      const el = document.querySelector(`[data-f="${CSS.escape(f)}"]`);
      if (el) { el.focus({ preventScroll: true }); if (caret && el.setSelectionRange) try { el.setSelectionRange(...caret); } catch (_) {} }
    }
  }

  // Another point opens at the top of the panel; only where the panel sits under the plant (≤720px) does the page
  // scroll to it.
  const stacked = () => window.matchMedia('(max-width: 720px)').matches;
  function select(id) {
    const was = sel;
    sel = id || null;
    document.querySelectorAll('[data-blk]').forEach((el) => el.classList.toggle('sel', el.dataset.blk === sel));
    renderPanel();
    if (sel !== was) $('panel').scrollTop = 0;
    if (stacked() && sel) $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // The summary's 可做／訂單 and 入庫, and the 訂單 point, bring the orders back into the panel.
  function showOrders() {
    select(null);
    $('panel').scrollTop = 0;
    if (stacked()) $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  const pick = (id) => (id === 'fg' ? showOrders() : select(id));

  /* ---------- a station: putting batches in, 開工, 領料 and taking them back out ---------- */
  // Before a change, the places as shown and the order of the batches still to put in are kept as they are (the places
  // shown before their first use this week aren't stored yet).
  function keep(q) {
    setSlots(q.lane.name, q.places);
    setOrder(q.lane.name, q.seq);
  }
  // Moves the batch at `from` among those still to put in to `to`.
  function moveBatch(lane, from, to) {
    const q = PL.get(lane);
    if (!q || from === to) return;
    keep(q);
    const seq = q.seq.slice(), [x] = seq.splice(from, 1);
    seq.splice(Math.max(0, Math.min(seq.length, to)), 0, x);
    setOrder(lane, seq);
    save();
    render();
  }
  // Puts the batch at `from` among those still to put in into the station, waiting for 開工: the first empty place,
  // right below the batches already there.
  function placeBatch(lane, from) {
    const q = PL.get(lane), k = q ? q.places.indexOf(null) : -1;
    if (k < 0 || from < 0 || from >= q.seq.length) return;
    keep(q);
    const seq = q.seq.slice(), [name] = seq.splice(from, 1);
    slotsOf(lane)[k] = { name, at: null };
    setOrder(lane, seq);
    save();
    render();
  }
  // 開工 (data-start: the station), 領料, 直接完成 and ✕ (data-collect / data-finish / data-unslot: 'station|place'),
  // 加入 (data-place-in: 'station|batch' into the first empty place), 退回 (data-unlog: 'station|log entry'), and the
  // 測試 lock (data-testlock, not remembered).
  function queueAction(b) {
    if (b.dataset.testlock != null) { testing = !testing; renderPanel(); return; }
    const v = b.dataset.collect || b.dataset.finish || b.dataset.unslot || b.dataset.placeIn || b.dataset.unlog || '', bar = v.lastIndexOf('|');
    const lane = b.dataset.start || v.slice(0, bar), k = Number(v.slice(bar + 1)), q = PL.get(lane), now = Date.now();
    if (!q) return;
    if (b.dataset.placeIn) { placeBatch(lane, k); return; }
    keep(q);
    if (b.dataset.start) startSlots(lane, now);
    else if (b.dataset.collect) collectSlot(lane, k, now);
    else if (b.dataset.finish) collectSlot(lane, k, now, true);
    else if (b.dataset.unlog) uncollect(lane, k);
    else cancelSlot(lane, k, now);
    save();
    render();
  }
  // Dragging a batch still to put in by its ⠿: onto another one to change the order, or onto an empty place of the
  // same station to put it in; works with a mouse or a finger.
  let drag = null;
  const clearDrop = () => document.querySelectorAll('.slot.drop').forEach((x) => x.classList.remove('drop'));
  document.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest && e.target.closest('.grip');
    if (!grip || e.button > 0) return;
    const el = grip.closest('[data-slot]');
    e.preventDefault();
    drag = { el, lane: el.dataset.lane, from: Number(el.dataset.slot), x: e.clientX, y: e.clientY, id: e.pointerId, on: false, to: null, place: null };
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) < 5) return;
    drag.on = true;
    drag.el.classList.add('dragging');
    drag.el.style.transform = `translate(${dx}px, ${dy}px)`;
    const t = document.elementsFromPoint(e.clientX, e.clientY).map((x) => x.closest('[data-slot], [data-place]')).find((x) => x && x !== drag.el);
    clearDrop();
    drag.to = drag.place = null;
    if (!t || t.dataset.lane !== drag.lane) return;
    if (t.dataset.place != null) drag.place = Number(t.dataset.place); else drag.to = Number(t.dataset.slot);
    t.classList.add('drop');
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    clearDrop();
    if (d.on && d.place != null) placeBatch(d.lane, d.from);
    else if (d.on && d.to != null && d.to !== d.from) moveBatch(d.lane, d.from, d.to);
    else { d.el.classList.remove('dragging'); d.el.style.transform = ''; }
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  // Running rounds come due by themselves: redraw now and then, unless something is being typed or dragged.
  setInterval(() => {
    const a = document.activeElement;
    if (!A || drag || $('sheet').open || (a && a.matches && a.matches('input, select'))) return;
    render();
  }, 30e3);

  /* ---------- forms over the page: 填已購買 for one shop (a block per character), 填現有庫存 for a 投料區 ---------- */
  function openBuy(id) {
    const n = BY.get(id);
    if (!n || n.kind !== 'shop') return;
    const many = chars() > 1;
    const groups = Array.from({ length: chars() }, (_, c) => `<fieldset class="bm-char">${many ? `<legend>角色 ${c + 1}</legend>` : ''}
      ${n.items.map((i) => `<div class="bm-row"><span class="bm-name">${nameHTML(i.name)}</span>
        <input class="have" data-bm="${c}|${esc(i.buy.key)}" inputmode="numeric" value="${(i.buy.per[c] || {}).bought || ''}" placeholder="0" aria-label="${esc(i.name)}${many ? ` 角色 ${c + 1}` : ''} 已購買">
        <span class="muted">／${SHOP.limit}</span><button class="btn small" type="button" data-bmfill>滿</button></div>`).join('')}</fieldset>`).join('');
    $('sheet-form').dataset.kind = 'buy';
    $('sheet-form').innerHTML = `<h2>${esc(n.title)}</h2><p class="muted">這週已經買了幾個？每樣最多 ${SHOP.limit} 個${many ? '，每隻角色分開算' : ''}。</p>
      ${groups}
      <div class="bm-act"><button class="btn small" type="button" data-bmall>全部填滿</button><span class="grow"></span>
        <button class="btn" type="button" data-bmcancel>取消</button><button class="btn primary" type="submit">完成</button></div>`;
    $('sheet').showModal();
    const first = $('sheet-form').querySelector('input');
    if (first) first.select();
  }
  // One block of a 投料區 ('zone:…|raw' the raw materials, '…|made' the made items, held ones cut the batches still to
  // make). A shared item is this 投料區's own count (data-sz), anything else the bag's (data-sm).
  function openStock(v) {
    const n = BY.get(v.slice(0, v.lastIndexOf('|'))), group = v.slice(v.lastIndexOf('|') + 1);
    if (!n || n.kind !== 'warehouse') return;
    const row = (i) => `<div class="bm-row"><span class="bm-name">${nameHTML(i.name)}<small class="muted">需要 ${fmt(i.need)}${i.shared ? '・共用料，填這區自己的' : ''}</small></span>
      <input class="have" ${i.shared ? `data-sz="${esc(n.id)}|${esc(i.name)}"` : `data-sm="${esc(i.name)}"`} inputmode="numeric" value="${i.have || ''}" placeholder="0" aria-label="${esc(i.name)} 現有庫存"></div>`;
    $('sheet-form').dataset.kind = 'stock';
    const body = group === 'made'
      ? `<h2>${esc(n.title)}・加工品</h2><p class="muted">已經做好放著的加工品，填了就會少做幾批。</p>
        <fieldset class="bm-char">${n.items.filter((i) => i.made).map(row).join('')}</fieldset>`
      : `<h2>${esc(n.title)}・原料</h2><p class="muted">照遊戲背包現在的數量填。</p>
        <fieldset class="bm-char">${n.items.filter((i) => !i.made).map(row).join('')}</fieldset>`;
    $('sheet-form').innerHTML = `${body}
      <div class="bm-act"><span class="grow"></span><button class="btn" type="button" data-bmcancel>取消</button><button class="btn primary" type="submit">完成</button></div>`;
    $('sheet').showModal();
    const first = $('sheet-form').querySelector('input');
    if (first) first.select();
  }
  // 填已入庫: every dish on the wish list and how many are in stock; one still waiting for its ingredients can't be
  // filled in yet.
  function openStocked() {
    const rows = PR.assemble.map((r) => {
      const locked = !r.ready && r.done < r.plan;
      return `<div class="bm-row"><span class="bm-name">${nameHTML(r.item)}${locked ? `<small class="muted">等：${esc(r.waiting.join('、'))}</small>` : ''}</span>
        <input class="have" data-im="${esc(r.key)}" inputmode="numeric" value="${r.done || ''}" placeholder="0"${locked ? ' disabled' : ''} aria-label="${esc(r.item)} 已入庫">
        <span class="muted">／${fmt(r.plan)}</span><button class="btn small" type="button" data-imfill="${r.plan}"${locked ? ' disabled' : ''}>滿</button></div>`;
    }).join('');
    $('sheet-form').dataset.kind = 'stocked';
    $('sheet-form').innerHTML = `<h2>填已入庫</h2><p class="muted">做好的料理放進倉庫幾個了？料還沒齊的，要等齊了才能填。</p>
      <fieldset class="bm-char">${rows}</fieldset>
      <div class="bm-act"><button class="btn small" type="button" data-imall>全部填滿</button><span class="grow"></span>
        <button class="btn" type="button" data-bmcancel>取消</button><button class="btn primary" type="submit">完成</button></div>`;
    $('sheet').showModal();
    const first = $('sheet-form').querySelector('input:not([disabled])');
    if (first) first.select();
  }
  // 完成: every number that changed is saved (a purchase or 已入庫 moves the stock with it).
  $('sheet-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if ($('sheet-form').dataset.kind === 'orders') { saveOrders(); return; }
    for (const inp of $('sheet-form').querySelectorAll('[data-im]:not([disabled])')) {
      const key = inp.dataset.im, n = Math.max(0, Math.floor(Number(inp.value)) || 0);
      if (n !== (Math.max(0, Math.floor(Number(S.done.assembled[key])) || 0))) setDone('assembled', key, n);
    }
    for (const inp of $('sheet-form').querySelectorAll('[data-sm]')) {
      const name = inp.dataset.sm, n = Math.max(0, Math.floor(Number(inp.value)) || 0);
      if (n === held(name)) continue;
      if (n) S.have[name] = n; else delete S.have[name];
    }
    for (const inp of $('sheet-form').querySelectorAll('[data-sz]')) {
      const v = inp.dataset.sz, a = v.lastIndexOf('|'), z = BY.get(v.slice(0, a)), name = v.slice(a + 1);
      if (z && Math.max(0, Math.floor(Number(inp.value)) || 0) !== stockIn(z, name)) setZone(z.id, name, inp.value);
    }
    for (const inp of $('sheet-form').querySelectorAll('[data-bm]')) {
      const v = inp.dataset.bm, a = v.indexOf('|'), c = Number(v.slice(0, a)), key = v.slice(a + 1);
      const was = Math.max(0, Math.floor(Number((S.done.bought[key] || [])[c])) || 0);
      const n = Math.min(SHOP.limit, Math.max(0, Math.floor(Number(inp.value)) || 0));
      if (n !== was) setBought(key, c, n);
    }
    save();
    $('sheet').close();
    render();
  });
  $('sheet').addEventListener('click', (e) => {
    const d = $('sheet');
    if (e.target === d || e.target.closest('[data-bmcancel]')) { d.close(); return; }
    const one = e.target.closest('[data-bmfill]');
    if (one) { one.closest('.bm-row').querySelector('input').value = SHOP.limit; return; }
    if (e.target.closest('[data-bmall]')) d.querySelectorAll('[data-bm]').forEach((x) => { x.value = SHOP.limit; });
    // 填已入庫: 滿 fills one dish, 全部填滿 every one that can be filled
    const fill = e.target.closest('[data-imfill]');
    if (fill) { fill.closest('.bm-row').querySelector('input').value = fill.dataset.imfill; return; }
    if (e.target.closest('[data-imall]')) d.querySelectorAll('[data-imfill]:not([disabled])').forEach((x) => { x.closest('.bm-row').querySelector('input').value = x.dataset.imfill; });
    // the order form: ▲▼ moves a line, ✕ takes it off, ＋ 加一道菜 adds the first dish not on the list yet
    const mv = e.target.closest('[data-oemove]');
    if (mv) { const [i, k] = mv.dataset.oemove.split('|').map(Number); moveDraft(i, i + k); return; }
    const del = e.target.closest('[data-oedel]');
    if (del) { draft.splice(Number(del.dataset.oedel), 1); drawDraft(); return; }
    if (e.target.closest('[data-oeadd]')) {
      const taken = new Set(draft.map((o) => o.dish)), next = dishes().find((r) => !taken.has(r.name)) || dishes()[0];
      if (!next) return;
      draft.push({ dish: next.name, qty: 10 });
      drawDraft();
      const q = d.querySelector(`[data-oeqty="${draft.length - 1}"]`);
      if (q) q.select();
    }
  });
  $('sheet').addEventListener('close', () => { $('sheet').classList.remove('wide'); draft = null; });

  /* ---------- the order form: the whole wish list at once, kept as a draft until 完成 ---------- */
  let draft = null;
  // Each line of the draft with its 上限: the week worked out on the draft instead of the saved list.
  function draftRows() {
    const keep = S.orders;
    S.orders = draft;
    try { return allocate().rows; } finally { S.orders = keep; }
  }
  // 上限 under each count, worked out again on every change.
  function paintCaps() {
    for (const r of draftRows()) {
      const el = $('sheet-form').querySelector(`[data-oecap="${r.i}"]`);
      if (!el) continue;
      el.textContent = r.max < Infinity ? `上限 ${fmt(r.max)}` : '';
      el.classList.toggle('ord-cut', r.qty > r.max);
    }
  }
  function drawDraft() {
    const last = draft.length - 1;
    $('sheet-form').querySelector('[data-oelist]').innerHTML = draft.map((o, i) => `<div class="oe-row" data-oerow="${i}">
        <span class="oe-grip" title="拖拉換順序" aria-hidden="true">⠿</span>
        <span class="wish-n">${i + 1}</span>
        <select data-oedish="${i}" aria-label="第 ${i + 1} 道料理">${dishOptions(o.dish)}</select>
        <span class="oe-qty"><input class="have" data-oeqty="${i}" inputmode="numeric" value="${o.qty || ''}" aria-label="第 ${i + 1} 道數量"><small data-oecap="${i}"></small></span>
        <span class="oe-mv"><button class="btn" type="button" data-oemove="${i}|-1" aria-label="第 ${i + 1} 道往上"${i ? '' : ' disabled'}>▲</button><button class="btn" type="button" data-oemove="${i}|1" aria-label="第 ${i + 1} 道往下"${i < last ? '' : ' disabled'}>▼</button></span>
        <button class="btn oe-del" type="button" data-oedel="${i}" aria-label="刪掉第 ${i + 1} 道">✕</button>
      </div>`).join('') || '<p class="muted" style="margin:8px 0 0">還沒有訂單。</p>';
    paintCaps();
  }
  function moveDraft(from, to) {
    if (from === to || to < 0 || to >= draft.length) return;
    draft.splice(to, 0, draft.splice(from, 1)[0]);
    drawDraft();
  }
  function openOrders() {
    draft = S.orders.map((o) => ({ dish: o.dish, qty: o.qty }));
    $('sheet').classList.add('wide');
    $('sheet-form').dataset.kind = 'orders';
    $('sheet-form').innerHTML = `<h2>編輯訂單</h2><p class="muted">越上面越先分到限購材料；按「完成」才會存。</p>
      <div data-oelist></div>
      <button class="btn ord-add" type="button" data-oeadd>＋ 加一道菜</button>
      <div class="bm-act"><span class="grow"></span><button class="btn" type="button" data-bmcancel>取消</button><button class="btn primary" type="submit">完成</button></div>`;
    drawDraft();
    $('sheet').showModal();
  }
  // 完成: the draft becomes the wish list (a count left empty is 1).
  function saveOrders() {
    S.orders.splice(0, S.orders.length, ...draft.map((o) => ({ dish: o.dish, qty: Math.max(1, o.qty) })));
    save();
    $('sheet').close();
    render();
  }
  $('sheet').addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.oedish != null) { draft[Number(t.dataset.oedish)].dish = t.value; paintCaps(); }
  });
  $('sheet').addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.oeqty != null) { draft[Number(t.dataset.oeqty)].qty = Math.max(0, Math.floor(Number(t.value)) || 0); paintCaps(); }
  });
  // Dragging a line by its ⠿ to another place, with a mouse or a finger; the grip holds the pointer, so letting go
  // outside the form doesn't close it.
  let odrag = null;
  $('sheet').addEventListener('pointerdown', (e) => {
    const grip = e.target.closest('.oe-grip');
    if (!grip || e.button > 0) return;
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    const el = grip.closest('[data-oerow]');
    odrag = { el, from: Number(el.dataset.oerow), y: e.clientY, id: e.pointerId, on: false, to: null };
  });
  $('sheet').addEventListener('pointermove', (e) => {
    if (!odrag || e.pointerId !== odrag.id) return;
    const dy = e.clientY - odrag.y;
    if (!odrag.on && Math.abs(dy) < 5) return;
    odrag.on = true;
    odrag.el.classList.add('dragging');
    odrag.el.style.transform = `translateY(${dy}px)`;
    const t = document.elementsFromPoint(e.clientX, e.clientY).map((x) => x.closest('[data-oerow]')).find((x) => x && x !== odrag.el);
    $('sheet-form').querySelectorAll('.oe-row.drop').forEach((x) => x.classList.remove('drop'));
    odrag.to = t ? Number(t.dataset.oerow) : null;
    if (t) t.classList.add('drop');
  });
  const endODrag = (e) => {
    if (!odrag || e.pointerId !== odrag.id) return;
    const d = odrag;
    odrag = null;
    if (d.on && d.to != null && d.to !== d.from) moveDraft(d.from, d.to);
    else { d.el.classList.remove('dragging'); d.el.style.transform = ''; $('sheet-form').querySelectorAll('.oe-row.drop').forEach((x) => x.classList.remove('drop')); }
  };
  $('sheet').addEventListener('pointerup', endODrag);
  $('sheet').addEventListener('pointercancel', endODrag);

  // A shared item's count typed in on the 原物料 table (data-zh 'zone:…|item'); Enter moves on.
  document.addEventListener('change', (e) => {
    const v = e.target.dataset && e.target.dataset.zh;
    if (v == null) return;
    setZone(v.slice(0, v.lastIndexOf('|')), v.slice(v.lastIndexOf('|') + 1), e.target.value);
    save();
    setTimeout(render, 0);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches && e.target.matches('input[data-zh]')) e.target.blur(); });

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const qb = e.target.closest('[data-start], [data-collect], [data-finish], [data-unslot], [data-place-in], [data-unlog], [data-testlock]');
    if (qb) { queueAction(qb); return; }
    const open = e.target.closest('[data-buyopen]');
    if (open) { openBuy(open.dataset.buyopen); return; }
    const stock = e.target.closest('[data-stockopen]');
    if (stock) { openStock(stock.dataset.stockopen); return; }
    if (e.target.closest('[data-oopen]')) { openOrders(); return; }
    if (e.target.closest('[data-inopen]')) { openStocked(); return; }
    const go = e.target.closest('[data-go]');
    if (go) { pick(go.dataset.go); return; }
    const jump = e.target.closest('[data-jump]');
    if (jump) { showOrders(); return; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sel && !$('sheet').open) select(null);
  });
  wireList(render);
  // The planner may change the plan in another tab.
  addEventListener('storage', (e) => { if (e.key === 'mm-line-v1') location.reload(); });

  (async () => {
    try {
      await window.LineCore.load();
    } catch (_) {
      $('app').innerHTML = '<div class="card fail">這頁的配方是從佈告欄（index.html）讀進來的，要用網址開啟，例如 GitHub Pages；直接點開檔案的話瀏覽器不讓它讀。</div>';
      return;
    }
    render();
  })();
})();
</script>
</body>
</html>
