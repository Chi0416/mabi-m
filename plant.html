<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>廠區</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fde'/%3E%3Cpath d='M12 50V28l12 8v-8l12 8v-8l12 8V14h6v36z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
/* Plant map: the week's plan drawn as a factory floor seen at an angle, flow left to right — suppliers outside the
   fence, then 進料倉, the stations, assembly and 訂單 (the finished dishes). Light palette only; status colours are the andon lights'. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --ink: #1f2933;
  --muted: #5f6b7a;
  --line: #d5dbe1;
  --accent: #2f6fde;
  --accent-soft: #e3ecfc;
  --ok: #2e9b5b;   --ok-soft: #dff3e7;
  --wait: #c98a0c; --wait-soft: #fbf0d6;
  --bad: #d64545;  --bad-soft: #fbe3e3;
  --done: #3b7ddd; --done-soft: #e0ebfb;
  --idle: #8a96a3; --idle-soft: #eceff2;
  --grade-green: #2a7a3b; --grade-blue: #2560b0; --grade-purple: #7840c0; --grade-pink: #b0307a; --grade-orange: #a8530c;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --r: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.3; }
.grade-綠 { color: var(--grade-green); } .grade-藍 { color: var(--grade-blue); } .grade-紫 { color: var(--grade-purple); }
.grade-粉 { color: var(--grade-pink); } .grade-橙 { color: var(--grade-orange); }
.muted { color: var(--muted); }

.top { background: #1f2933; color: #fff; }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px var(--gutter-r) 10px var(--gutter-l); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.top h1 small { font-size: 13px; font-weight: 400; color: #b7c2cd; }
.top nav { margin-left: auto; display: flex; gap: 6px; }
.top nav a { color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 8px; background: rgba(255, 255, 255, .1); font-size: 14px; }
.top nav a:hover { background: rgba(255, 255, 255, .2); }

main { max-width: 1440px; margin: 0 auto; padding: 16px var(--gutter-r) 48px var(--gutter-l); }
/* the plant on the left, the info panel (orders by default) on the right, the lists under the plant */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto 1fr; grid-template-areas: "map panel" "rest panel"; gap: 16px; align-items: start; }
.layout > .map-card { grid-area: map; } .layout > .panel { grid-area: panel; } .layout > .left { grid-area: rest; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.summary { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 12px; margin-bottom: 16px; }
.sum { font: inherit; color: inherit; text-align: left; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; background: none; }
button.sum { cursor: pointer; }
button.sum:hover { background: var(--accent-soft); border-color: rgba(47, 111, 222, .3); }
button.sum:hover b { color: var(--accent); }
.sum b { font-size: 18px; }
.sum .k { font-size: 13px; color: var(--muted); }
.sum.bad b { color: var(--bad); }
.sum.edit { align-items: center; margin-left: auto; }
.sum-hint { flex: 1 1 100%; margin: 0 10px; font-size: 12px; color: var(--muted); }

/* the map */
.map-card { overflow: hidden; }
.map-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
.map-scroll svg { display: block; width: 100%; min-width: 680px; height: auto; background: linear-gradient(#f4f6f8, #e9edf1); }
.map-hint { display: none; margin: 0; padding: 6px 12px 0; font-size: 13px; color: var(--muted); }
.view-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.view-bar h2 { font-size: 18px; }
.view-bar .tabs { margin-left: auto; display: inline-flex; gap: 4px; }
.view-bar .btn { min-height: 32px; padding: 3px 12px; }
/* blocks: one column per stage, flow left to right */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px; background: var(--panel-2); }
.stage { display: grid; gap: 8px; align-content: start; min-width: 0; }
.stage h3 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.stage + .stage h3::before { content: "→"; color: var(--idle); }
.blk { font: inherit; color: var(--ink); text-align: left; display: grid; gap: 3px; width: 100%; padding: 9px 10px 10px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--idle); border-radius: 8px; cursor: pointer; }
.blk.ok { border-left-color: var(--ok); } .blk.wait { border-left-color: var(--wait); } .blk.bad { border-left-color: var(--bad); background: #fff8f8; }
.blk:hover { border-color: rgba(47, 111, 222, .45); }
.blk.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.blk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 2px; }
.blk-name { font-weight: 700; font-size: 15px; }
.blk .badge { padding: 0 8px; font-size: 12px; }
.blk .ln { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 1.5; }
.blk .ln span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.blk .ln.bad { color: var(--bad); }
.blk .foot { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 2px; }
svg text { font-family: var(--font); }
.node { cursor: pointer; outline: none; }
.node .ring { fill: transparent; stroke: transparent; stroke-width: 3; }
.node:hover .ring { fill: rgba(47, 111, 222, .06); stroke: rgba(47, 111, 222, .4); }
.node.sel .ring, .node:focus-visible .ring { fill: rgba(47, 111, 222, .1); stroke: var(--accent); }
.node .title { font-size: 18px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: rgba(255, 255, 255, .9); stroke-width: 4px; }
.node .pill text { font-size: 14px; font-weight: 700; }
.lamp { transition: fill .2s; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.btn:hover { background: #e9edf1; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2a62c6; }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 14px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

/* 訂單 in the panel: one block per order — the dish and its moves, ordered and makeable, stock and status */
.ord-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ord-h span { font-weight: 400; letter-spacing: 0; }
.ord-h b { font-size: 16px; color: var(--ink); }
.orders-sec > .bar { height: 8px; }
.ord-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px 10px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.ord-row > :not(.wish-n) { grid-column: 2; }
.ord-top { display: flex; align-items: center; gap: 4px; min-width: 0; }
.ord-top select { flex: 1 1 0; width: auto; }
.ord-top .btn { min-height: 34px; min-width: 34px; padding: 2px 6px; }
.ord-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.ord-line > span { display: inline-flex; align-items: center; gap: 6px; }
.ord-line b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.ord-line b.cut { color: var(--bad); }
.ord-row .stepper .btn { min-width: 40px; }
.ord-row .stepper input { width: 56px; }
.ord-note { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
.ord-cut { color: var(--bad); }
.ord-no { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 6px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; vertical-align: 1px; }
.rows .num small { font-weight: 400; }
.wish-n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
select { font: inherit; font-size: 15px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 38px; min-width: 0; width: 100%; }
.stepper { display: inline-flex; align-items: stretch; }
.stepper .btn { border-radius: 0; min-width: 44px; padding: 4px 8px; }
.stepper .btn:first-child { border-radius: 8px 0 0 8px; }
.stepper .btn:last-child { border-radius: 0 8px 8px 0; }
.stepper input { width: 64px; font: inherit; font-size: 15px; text-align: center; border: 1px solid var(--line); border-left: 0; border-right: 0; border-radius: 0; color: var(--ink); }
.btn.small { min-height: 30px; padding: 2px 10px; font-size: 13px; }
#add-order { margin-top: 10px; }
.left { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.mats { padding: 12px 16px 16px; }
.mats-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px; }
.mats-head h2 { font-size: 18px; }
.mats-head .muted { font-size: 13px; }
.mats h3 { font-size: 15px; margin: 16px 0 6px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
thead th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--panel-2); }
thead th.r { text-align: right; }
tbody th { font-weight: 400; }
td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
td.num small { font-weight: 400; color: var(--muted); }
td.num .bar { min-width: 90px; }
td.src { white-space: normal; min-width: 160px; font-size: 13px; color: var(--muted); }
input.have { width: 72px; font: inherit; font-size: 14px; text-align: right; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

/* a station's queue: rounds of `queue` places, one batch made at a time; ⠿ drags a batch to another place */
.round { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 10px; margin-top: 10px; background: var(--panel-2); }
.round.running { border-color: rgba(201, 138, 12, .45); background: var(--wait-soft); }
.round.ready { border-color: rgba(46, 155, 91, .45); background: var(--ok-soft); }
.round-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 13px; color: var(--muted); }
.round-head b { color: var(--ink); font-size: 14px; }
.ok-text { color: var(--ok); }
.slot { display: grid; grid-template-columns: 28px 16px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 44px; padding: 5px 6px; margin-top: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.slot.empty { background: transparent; border-style: dashed; color: var(--muted); font-size: 13px; }
.slot.lock { background: rgba(255, 255, 255, .7); }
.slot.bad { border-color: var(--bad); background: #fff8f8; }
.slot.drop { outline: 2px dashed var(--accent); outline-offset: 1px; }
.slot.dragging { position: relative; z-index: 5; box-shadow: 0 6px 18px rgba(31, 41, 51, .22); }
.slot .grip { height: 32px; display: grid; place-items: center; border-radius: 6px; font-size: 18px; color: var(--idle); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.slot .grip:hover { background: var(--idle-soft); color: var(--ink); }
.slot.dragging .grip { cursor: grabbing; }
.slot .no { font-size: 12px; color: var(--muted); text-align: center; }
.slot .what { min-width: 0; line-height: 1.35; }
.slot .what small { display: block; font-size: 12px; color: var(--muted); }
.slot .what em { display: block; font-style: normal; font-size: 12px; color: var(--bad); }
.slot .mv { display: inline-flex; gap: 2px; }
.slot .mv .btn { min-height: 30px; min-width: 30px; padding: 0 4px; font-size: 11px; }
.round-act { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.round-act label { display: inline-flex; align-items: center; gap: 6px; }
.round-act input[type="time"] { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.note.bad-text { font-weight: 500; }
/* a line with a tick, what it is, the plan and what is done or in stock */
.done-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto auto; gap: 4px 12px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.done-row .chk { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.done-row.is-done .chk { background: var(--ok); border-color: var(--ok); }
.done-row.is-done .what b { color: var(--muted); text-decoration: line-through; }
.done-row.is-locked { opacity: .7; }
.done-row .what small { display: block; font-size: 12px; color: var(--muted); }
.panel .done-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
.panel .done-row .plan, .panel .done-row .act { grid-column: 2; }
.done-row .what em { display: block; font-style: normal; font-size: 12px; color: var(--wait); }
.done-row .what em.go-on { color: var(--ok); }
.done-row .what em.bad { color: var(--bad); }
.done-row.stk.ok .chk { background: var(--ok); border-color: var(--ok); }
/* a shop's items: bought per character against the weekly limit */
.buy-all { margin-bottom: 4px; }
.buy-item { padding: 8px 0 10px; border-bottom: 1px dashed var(--line); }
.buy-item:last-of-type { border-bottom: 0; }
.buy-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.buy-head .muted { font-size: 12px; }
.buy-head .num { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.buy-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 0 0 6px; font-size: 13px; color: var(--muted); }
.buy-row .who { min-width: 3.6em; color: var(--ink); }
.buy-row .st { flex: 1 1 auto; }
.buy-row .st.ok { color: var(--ok); font-weight: 700; }
.buy-row .st.more { color: var(--wait); font-weight: 500; }
.done-row .plan { font-size: 13px; color: var(--muted); white-space: nowrap; }
.done-row .act { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
@media (max-width: 640px) {
  .done-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
  .done-row .plan { grid-column: 2; }
  .done-row .act { grid-column: 2; }
}

/* the side panel */
.panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.panel-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.panel-head .kind { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.panel-head h2 { font-size: 20px; margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-head .back { font: inherit; font-size: 13px; background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; }
.sec { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; letter-spacing: .04em; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 999px; }
.badge.ok { color: var(--ok); background: var(--ok-soft); } .badge.wait { color: var(--wait); background: var(--wait-soft); }
.badge.bad { color: var(--bad); background: var(--bad-soft); } .badge.done { color: var(--done); background: var(--done-soft); }
.badge.idle { color: var(--idle); background: var(--idle-soft); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.rows li:last-child { border-bottom: 0; }
.rows .num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.rows .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--idle-soft); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar.full i { background: var(--bad); } .bar.cap i { background: var(--wait); } .bar.done i { background: var(--done); }
.go { font: inherit; text-align: left; width: 100%; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
.go:hover b { color: var(--accent); text-decoration: underline; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.sec.alert { background: var(--bad-soft); }
.sec.alert h3 { color: var(--bad); }
.sec h4 { font-size: 13px; margin: 12px 0 4px; }
.bad-text { color: var(--bad); font-weight: 700; }
.tips { margin: 0; padding-left: 18px; font-size: 14px; }
.tips li { margin: 3px 0; }
.loading, .fail { padding: 24px 16px; }

@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "map" "panel" "rest"; }
  .panel { position: static; max-height: none; }
  .map-hint { display: block; }
}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>廠區 <small id="week-line"></small></h1>
    <nav><a href="factory.html">生產線</a><a href="index.html">佈告欄</a></nav>
  </div>
</header>
<main id="app"><div class="card loading">讀取資料中…</div></main>

<script src="line-core.js"></script>
<script id="plant-script">
(() => {
  // The plant page: the planner's week (same wish list, holdings and characters) as a factory floor. Click a point to
  // see what it needs and how it stands. The plant is shown as blocks, one column per stage, or as a still map.
  const {
    LINE, SHOP, S, save, MAX_CHARS, esc, fmt, fmtDur, shopWeek, nameHTML, sourceText, townRank, quick, chars, charsFromBoard, held, readLS, writeLS,
    allocate, makePlan, makeSchedule, progress, yieldOf, dishOptions, wireList, gathers, setBought,
    REC, runOf, setOrder, startRound, collectRound, cancelRound, setRunAt,
  } = window.LineCore;
  const $ = (id) => document.getElementById(id);

  // One look for one kind of plant. The plan underneath doesn't change between themes, so a car or wafer plant only
  // needs its own words, colours and drawings here.
  const THEME = {
    words: {
      outside: '廠外', shop: '供應商', field: '自有採集', unknown: '來源待補', warehouse: '進料倉', machine: '加工站',
      assembly: '組裝站', fg: '訂單',
    },
    colors: {
      ground: '#dfe6d8', groundEdge: '#c9d3c0', road: '#b9c1c9', roadLine: '#f4f6f8', floor: '#e4e8ec', floorEdge: '#c3cad2',
      grid: '#d6dce2', aisle: '#d2d8de', aisleEdge: '#e0b028', fence: '#7d8894', mark: '#e0b028', edge: 'rgba(31, 41, 51, .35)',
      shop: ['#fbfaf6', '#efe9dd', '#e2d9c8'], awning: ['#d64545', '#ffffff'], field: ['#c7d99a', '#9fbc63'],
      unknown: ['#f3e3e3', '#e6c9c9', '#d6b1b1'], warehouse: ['#e3e8ee', '#cfd6de', '#bcc5cf'], machine: ['#d5dde5', '#b8c4d0', '#a3b1bf'],
      assembly: ['#e8e1d6', '#d8cdbd', '#c6b8a4'], fg: ['#e9e3da', '#d7cdc0', '#c4b8a8'], panel: '#2b3640', screen: '#9fd3ff',
    },
    status: { ok: '#2e9b5b', wait: '#e0a526', bad: '#d64545', idle: '#9aa5b1' },
  };
  const C = THEME.colors, W = THEME.words;
  const STATUS_TEXT = { ok: '完成', wait: '進行中・可以做了', bad: '異常', idle: '還沒開始' };

  /* ---------- projection: floor (x right, z toward the viewer), y up, seen from the front and a little left ---------- */
  const U = 20;
  const pj = (x, z, y = 0) => [(x + z * 0.38) * U, (z * 0.66 - y) * U];
  const pts = (list) => list.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ');
  const poly = (list, fill, extra = '') => `<polygon points="${pts(list)}" fill="${fill}" stroke="${C.edge}" stroke-width="1" stroke-linejoin="round"${extra}/>`;
  const flat = (x, z, w, d, y, fill, extra = '') => poly([pj(x, z, y), pj(x + w, z, y), pj(x + w, z + d, y), pj(x, z + d, y)], fill, extra);
  // A block: top, front (facing the viewer) and left faces; c = [top, front, left].
  function block(x, z, w, d, h, c) {
    return poly([pj(x, z, 0), pj(x, z + d, 0), pj(x, z + d, h), pj(x, z, h)], c[2])
      + poly([pj(x, z + d, 0), pj(x + w, z + d, 0), pj(x + w, z + d, h), pj(x, z + d, h)], c[1])
      + flat(x, z, w, d, h, c[0]);
  }
  // A rectangle painted on the front face, from (u, v) along its width and height, size (du, dv).
  const onFront = (n, u, v, du, dv, fill, extra = '') => poly([pj(n.x + u, n.z + n.d, v), pj(n.x + u + du, n.z + n.d, v), pj(n.x + u + du, n.z + n.d, v + dv), pj(n.x + u, n.z + n.d, v + dv)], fill, extra);

  /* ---------- the plan and its points ---------- */
  let A, P, SCH, PR, PL = new Map(), NODES = [], BY = new Map(), G = null, sel = null;
  const rawColor = new Map();
  const RAW_COLORS = ['#d64545', '#e0a526', '#8a96a3', '#7b5cc4', '#2e9b5b', '#e07a9a', '#b07440', '#3b7ddd'];

  function plan() {
    A = allocate();
    P = makePlan(A);
    SCH = makeSchedule(P);
    PR = progress(A, P);
    A.mats.forEach((m, i) => rawColor.set(m.name, RAW_COLORS[i % RAW_COLORS.length]));
    const out = [];
    // Outside the fence: every shop selling something the wish list wants (even one whose share came to nothing, so a
    // shortage still shows where to buy), then gathering, then materials with no known source. A shop's item carries
    // its purchases (buy: each character's bought and suggested more).
    const shops = new Map(), fields = new Map(), unknown = [];
    for (const m of A.mats) {
      if (!m.need && !m.want) continue;
      for (const sh of m.buys) {
        const key = `${sh.who}|${sh.town || sh.note}`;
        if (!shops.has(key)) shops.set(key, { id: `shop:${key}`, kind: 'shop', title: sh.town ? `${sh.who}（${sh.town}）` : sh.who, sign: sh.who, town: sh.town, items: [] });
        shops.get(key).items.push({ name: m.name, qty: sh.qty, buy: sh, mat: m });
      }
      if (!gathers(m)) continue;
      if (m.s.gather) {
        const g = m.s.src.find((x) => x.kind === 'gather').text;
        if (!fields.has(g)) fields.set(g, { id: `field:${g}`, kind: 'field', title: g, items: [] });
        fields.get(g).items.push({ name: m.name, qty: m.get, mat: m });
      } else unknown.push({ name: m.name, qty: m.get, mat: m });
    }
    out.push(...[...shops.values()].sort((a, b) => townRank(a.town) - townRank(b.town)), ...fields.values());
    if (unknown.length) out.push({ id: 'unknown', kind: 'unknown', title: W.unknown, items: unknown });
    out.forEach((n) => { n.zone = 'out'; });
    // Inside: 進料倉, the stations from the raw side, assembly, 訂單. 立即製作 isn't a station of its own: what it makes is
    // put on the first assembly station (or one named after its skill's station) with the rest of the assembly.
    out.push({ id: 'wh', kind: 'warehouse', title: W.warehouse, zone: 'in' });
    const instant = SCH.lanes.filter((L) => L.steps.every((s) => s.instant)), extra = instant.flatMap((L) => L.steps);
    let asmNode = null;
    for (const L of SCH.lanes) {
      if (instant.includes(L)) continue;
      const asm = L.steps.every(quick);
      const n = { id: `lane:${L.name}`, kind: asm ? 'assembly' : 'machine', title: L.equip || '設備待補', todo: !L.equip, lane: L, zone: 'in' };
      if (asm && !asmNode) asmNode = n;
      out.push(n);
    }
    if (extra.length && asmNode) asmNode.lane = { ...asmNode.lane, steps: [...asmNode.lane.steps, ...extra] };
    else if (extra.length) {
      const eq = (LINE.skills[extra[0].r.skill] || {}).equip || W.assembly;
      out.push({ id: `lane:${eq}`, kind: 'assembly', title: eq, lane: { name: eq, equip: eq, steps: extra }, zone: 'in' });
    }
    out.push({ id: 'fg', kind: 'fg', title: W.fg, zone: 'in' });
    NODES = out;
    BY = new Map(NODES.map((n) => [n.id, n]));
    PL = queues();
    layout();
  }

  /* ---------- stations' queues ---------- */
  // Clock times in this browser's time zone: 14:05, 明天 01:20, 10/28 09:00.
  const hm = (ms) => {
    const d = new Date(ms), day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(d) - day(new Date())) / 864e5), t = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    return diff === 0 ? t : diff === 1 ? `明天 ${t}` : diff === -1 ? `昨天 ${t}` : `${d.getMonth() + 1}/${d.getDate()} ${t}`;
  };
  const timeVal = (ms) => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  // A time typed as HH:MM is today's, or yesterday's when today's would still be ahead.
  const fromTime = (v) => {
    const m = String(v || '').match(/^(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const d = new Date();
    d.setHours(Number(m[1]), Number(m[2]), 0, 0);
    return d.getTime() > Date.now() + 60e3 ? d.getTime() - 864e5 : d.getTime();
  };
  const secsOf = (name) => { const s = P.steps.find((x) => x.name === name); return s ? s.secs : null; };
  // Every station from now: the round running (if any), then the batches still to line up — in the order chosen, the
  // rest raw side first — cut into rounds of its queue size. Times assume each round is collected and the next one
  // started as soon as it ends. A batch is marked (wait) when what it needs from other batches isn't made by its round,
  // and the next round to start lists the raw materials the stock is short of (short).
  function queues() {
    const now = Date.now(), out = new Map();
    for (const n of NODES) {
      if (n.kind !== 'machine') continue;
      const L = n.lane, steps = L.steps.filter((x) => !quick(x)), size = Math.max(1, L.queue || 1), run = runOf(L.name);
      const left = new Map(steps.map((x) => [x.name, Math.max(0, x.batches - (Math.floor(Number(S.done.processed[x.name])) || 0) - (run ? run.items.filter((y) => y === x.name).length : 0))]));
      const seq = [];
      for (const name of (S.done.proc[L.name] || {}).order || []) if (left.get(name) > 0) { seq.push(name); left.set(name, left.get(name) - 1); }
      for (const x of steps) for (let k = 0; k < left.get(x.name); k++) seq.push(x.name);
      const rounds = run ? [{ running: true, items: run.items, from: -1, start: run.at }] : [];
      for (let k = 0; k < seq.length; k += size) rounds.push({ running: false, items: seq.slice(k, k + size), from: k });
      let t = now, known = true;
      for (const r of rounds) {
        if (!r.running) r.start = Math.max(t, now);
        let c = r.start;
        r.ends = r.items.map((name) => { const x = secsOf(name); if (x == null) known = false; c += (x || 0) * 1000; return known ? c : null; });
        r.end = known ? c : null;
        r.wait = r.items.map(() => []);
        r.short = [];
        t = c;
      }
      out.set(L.name, { node: n, lane: L, size, run, seq, rounds, end: rounds.length ? rounds[rounds.length - 1].end : now });
    }
    // Round by round on every station at once: what each needs from other batches against what is made by then.
    const made = new Set(P.steps.map((x) => x.name)), avail = new Map([...made].map((name) => [name, held(name)]));
    const all = [...out.values()], most = Math.max(0, ...all.map((q) => q.rounds.length));
    for (let k = 0; k < most; k++) {
      for (const q of all) {
        const r = q.rounds[k];
        if (!r || r.running) continue;
        const need = new Map(), raw = new Map();
        r.items.forEach((name, j) => {
          for (const i of REC.get(name).inputs) {
            const map = made.has(i.item) ? need : raw;
            map.set(i.item, (map.get(i.item) || 0) + i.qty);
            if (made.has(i.item) && need.get(i.item) > (avail.get(i.item) || 0) && !r.wait[j].includes(i.item)) r.wait[j].push(i.item);
          }
        });
        if (r === q.rounds.find((x) => !x.running)) r.short = [...raw].filter(([item, qty]) => held(item) < qty).map(([item, qty]) => ({ item, lack: qty - held(item) }));
      }
      for (const q of all) {
        const r = q.rounds[k];
        if (!r) continue;
        for (const name of r.items) {
          const rec = REC.get(name);
          if (!r.running) for (const i of rec.inputs) if (made.has(i.item)) avail.set(i.item, (avail.get(i.item) || 0) - i.qty);
          avail.set(name, (avail.get(name) || 0) + yieldOf(rec));
        }
      }
    }
    return out;
  }
  // The stations together: logins still needed (one to start, one at every round's end), when everything is made, and
  // the next time to log in (now when a station can start).
  function procSummary() {
    const qs = [...PL.values()].filter((q) => q.rounds.length), now = Date.now();
    const logins = Math.max(0, ...qs.map((q) => q.rounds.length + (q.run ? 0 : 1)));
    const ends = qs.map((q) => q.end), finish = ends.length && ends.every((x) => x != null) ? Math.max(...ends) : null;
    const nexts = qs.map((q) => (q.run ? q.rounds[0].end : now)).filter((x) => x != null);
    return { busy: qs.length > 0, logins, rounds: Math.max(0, ...qs.map((q) => q.rounds.length)), finish, next: nexts.length ? Math.min(...nexts) : null };
  }
  const nextText = (t) => (t == null ? '時間待補' : t <= Date.now() + 30e3 ? '現在' : hm(t));

  const SIZE = { shop: [6, 3, 2.6], field: [6, 3, 0.25], unknown: [6, 3, 1.8], warehouse: [7, 5, 3.4], machine: [5, 4, 2.6], assembly: [5, 4, 1.4], fg: [7, 5, 3.4] };
  function layout() {
    const outside = NODES.filter((n) => n.zone === 'out'), inside = NODES.filter((n) => n.zone === 'in');
    const ROW = 7.6;
    outside.forEach((n, k) => { [n.w, n.d, n.h] = SIZE[n.kind]; n.x = 0.6; n.z = 1.2 + k * ROW; });
    const outDepth = outside.length ? 1.2 + outside.length * ROW : 6;
    const zRow = Math.max(1.5, outDepth / 2 - 3.5);
    let x = 13;
    for (const n of inside) {
      [n.w, n.d, n.h] = SIZE[n.kind];
      n.x = x;
      n.z = zRow + (5 - n.d) / 2;
      x += n.w + 4.2;
    }
    const zA = zRow + 7;
    G = { fenceX: 10.4, roadX: 8.4, zA, width: x - 1.5, depth: Math.max(outDepth, zA + 2.6) };
  }
  const door = (n) => [n.x + n.w / 2, n.z + n.d];
  // Carrier routes: outside along the road to the gate, inside along the aisle in front of the stations.
  function route(a, b) {
    const [ax, az] = door(a), [bx, bz] = door(b);
    if (a.zone === 'out') return [[ax, az], [ax, az + 0.7], [G.roadX, az + 0.7], [G.roadX, G.zA], [bx, G.zA], [bx, bz]];
    return [[ax, az], [ax, G.zA], [bx, G.zA], [bx, bz]];
  }

  /* ---------- statuses ---------- */
  const VERB = { processed: '已完成', assembled: '已組裝' };
  // The progress lines a point answers for.
  function rowsOf(n) {
    if (n.kind === 'shop') return PR.buy.filter((r) => `shop:${r.shop.who}|${r.shop.town || r.shop.note}` === n.id);
    if (n.kind === 'field' || n.kind === 'unknown') return PR.gather.filter((r) => n.items.some((i) => i.name === r.item));
    if (n.kind === 'machine') return PR.process.filter((r) => r.step.lane === n.lane.name);
    if (n.kind === 'assembly' || n.kind === 'fg') return PR.assemble;
    return [];
  }
  const tally = (rows) => [rows.reduce((t, r) => t + Math.min(r.done, r.plan), 0), rows.reduce((t, r) => t + r.plan, 0)];
  // [colour key, short text] for a point: red for a shortage or missing data, otherwise how far this week's actuals
  // have got — grey not started, yellow under way or ready to do, green done.
  function statusOf(n) {
    // A shop: every character's limit used up is 已買滿; bought what the plan wants from it is 夠用.
    if (n.kind === 'shop') {
      const per = n.items.flatMap((i) => i.buy.per), B = per.reduce((t, x) => t + x.bought, 0), L = per.length * SHOP.limit;
      const M = per.reduce((t, x) => t + x.more, 0);
      if (n.items.some((i) => i.mat.short)) return ['bad', B >= L ? '買滿仍缺' : '異常'];
      if (B >= L) return ['ok', '已買滿'];
      if (!M) return B ? ['ok', '夠用'] : ['idle', '不用買'];
      return B ? ['wait', `已買 ${fmt(B)}／${fmt(L)}`] : ['idle', '未買'];
    }
    // Gathering: what the stock still lacks after the shops' share.
    if (n.kind === 'field' || n.kind === 'unknown') {
      const left = n.items.reduce((t, i) => t + i.mat.get, 0);
      if (!left) return ['ok', n.kind === 'field' ? '已採齊' : '已取得'];
      if (n.kind === 'unknown') return ['bad', '來源待補'];
      return [n.items.some((i) => i.mat.stock) ? 'wait' : 'idle', `還要採 ${fmt(left)}`];
    }
    if (n.kind === 'machine' && n.lane.steps.some((s) => s.secs == null)) return ['bad', '時間待補'];
    // A station: its round running (or done and waiting for 全部領取), or whether the next one can start.
    if (n.kind === 'machine') {
      const q = PL.get(n.lane.name);
      if (!q || !q.rounds.length) return rowsOf(n).length ? ['ok', '加工完成'] : ['idle', '—'];
      const r = q.rounds[0];
      if (q.run) return r.end != null && r.end <= Date.now() ? ['ok', '可領取'] : ['wait', `做中${r.end != null ? `・${hm(r.end)} 好` : ''}`];
      return r.short.length || r.wait.some((w) => w.length) ? ['idle', '等料'] : ['wait', '可開工'];
    }
    if (n.kind === 'warehouse') {
      const mats = A.mats.filter((m) => m.need), ok = mats.filter((m) => (PR.inHand.get(m.name) || 0) >= m.need).length;
      if (!mats.length) return ['idle', '沒有進料'];
      // the week's plan stocked is 齊料 even when the wish list wants more than the limits allow
      if (ok < mats.length && A.mats.some((m) => m.short)) return ['bad', '缺料'];
      return ok === mats.length ? ['ok', '齊料'] : ok ? ['wait', `齊 ${ok}/${mats.length} 樣`] : ['idle', '待進料'];
    }
    const rows = rowsOf(n);
    if (!rows.length) return ['idle', n.kind === 'fg' ? '沒有訂單' : '—'];
    const [d, p] = tally(rows);
    if (d >= p) return ['ok', { machine: '加工完成', assembly: '組裝完成', fg: '全部入庫' }[n.kind] || `完成 ${fmt(d)}`];
    if (d > 0) return ['wait', `${n.kind === 'fg' ? '入庫' : VERB[rows[0].kind]} ${fmt(d)}/${fmt(p)}`];
    if (n.kind === 'assembly') return PR.assemble.every((r) => r.ready) ? ['wait', '可組裝'] : ['idle', '等加工'];
    return ['idle', n.kind === 'fg' ? `0/${fmt(p)}` : '未開始'];
  }

  /* ---------- drawing ---------- */
  function groundSVG() {
    const { fenceX, roadX, zA, width, depth } = G;
    let s = '';
    // outside ground and the road
    s += flat(-0.5, -0.5, fenceX + 0.5, depth + 1, 0, C.ground);
    s += flat(roadX - 0.9, -0.5, 1.8, depth + 1, 0, C.road);
    for (let z = 0; z < depth; z += 2) s += `<line x1="${pj(roadX, z)[0]}" y1="${pj(roadX, z)[1]}" x2="${pj(roadX, z + 1)[0]}" y2="${pj(roadX, z + 1)[1]}" stroke="${C.roadLine}" stroke-width="2"/>`;
    // plant floor: a slab with a visible front edge, a 2 m grid, the aisle with yellow edges
    s += poly([pj(fenceX, depth + 0.5, 0), pj(width, depth + 0.5, 0), pj(width, depth + 0.5, -0.5), pj(fenceX, depth + 0.5, -0.5)], C.floorEdge);
    s += flat(fenceX, -0.5, width - fenceX, depth + 1, 0, C.floor);
    for (let x = Math.ceil(fenceX / 2) * 2; x < width; x += 2) s += `<line x1="${pj(x, -0.5)[0]}" y1="${pj(x, -0.5)[1]}" x2="${pj(x, depth + 0.5)[0]}" y2="${pj(x, depth + 0.5)[1]}" stroke="${C.grid}" stroke-width="1"/>`;
    for (let z = 0; z <= depth; z += 2) s += `<line x1="${pj(fenceX, z)[0]}" y1="${pj(fenceX, z)[1]}" x2="${pj(width, z)[0]}" y2="${pj(width, z)[1]}" stroke="${C.grid}" stroke-width="1"/>`;
    s += flat(fenceX, zA - 0.9, width - fenceX, 1.8, 0, C.aisle, ' stroke="none"');
    for (const e of [zA - 0.9, zA + 0.9]) s += `<line x1="${pj(fenceX, e)[0]}" y1="${pj(fenceX, e)[1]}" x2="${pj(width, e)[0]}" y2="${pj(width, e)[1]}" stroke="${C.aisleEdge}" stroke-width="2.5"/>`;
    for (let x = fenceX + 3; x < width - 1; x += 6) {
      const a = pj(x, zA), b = pj(x + 1.2, zA);
      s += `<path d="M${a[0]},${a[1] - 5} L${b[0]},${b[1]} L${a[0]},${a[1] + 5}" fill="none" stroke="${C.mark}" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
    // zone marks around the plant buildings
    for (const n of NODES) if (n.zone === 'in') s += flat(n.x - 0.7, n.z - 0.7, n.w + 1.4, n.d + 1.4, 0, 'none', ` stroke="${C.mark}" stroke-width="2" stroke-dasharray="8 6"`);
    // the fence, open at the gate where the road meets the aisle
    const post = (z) => { const a = pj(fenceX, z, 0), b = pj(fenceX, z, 1.2); return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${C.fence}" stroke-width="2"/>`; };
    for (const [z0, z1] of [[-0.5, zA - 1.4], [zA + 1.4, depth + 0.5]]) {
      if (z1 <= z0) continue;
      const a = pj(fenceX, z0, 1.2), b = pj(fenceX, z1, 1.2), c = pj(fenceX, z0, 0.6), d = pj(fenceX, z1, 0.6);
      s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${C.fence}" stroke-width="2"/><line x1="${c[0]}" y1="${c[1]}" x2="${d[0]}" y2="${d[1]}" stroke="${C.fence}" stroke-width="1.5"/>`;
      for (let z = z0; z <= z1 + 0.01; z += 1.5) s += post(z);
    }
    const gate = pj(fenceX + 0.2, zA - 1.6, 1.6);
    s += `<text x="${gate[0]}" y="${gate[1]}" font-size="12" fill="${C.fence}" text-anchor="middle">收貨口</text>`;
    const out = pj(1, -0.3, 0);
    s += `<text x="${out[0]}" y="${out[1] - 6}" font-size="13" font-weight="700" fill="#6b7a5f">${esc(W.outside)}</text>`;
    return s;
  }

  // Three-lamp andon tower on a station's back right corner; the lamps are lit by paintStatus().
  function andon(n) {
    const base = pj(n.x + n.w - 0.6, n.z + 0.6, n.h), top = pj(n.x + n.w - 0.6, n.z + 0.6, n.h + 2.3);
    let s = `<line x1="${base[0]}" y1="${base[1]}" x2="${top[0]}" y2="${top[1]}" stroke="#4a5561" stroke-width="2.5"/>`;
    ['bad', 'wait', 'ok'].forEach((k, i) => {
      const p = pj(n.x + n.w - 0.6, n.z + 0.6, n.h + 2.3 - i * 0.62);
      s += `<circle class="lamp" data-lamp="${esc(n.id)}|${k}" cx="${p[0]}" cy="${p[1]}" r="5.5" fill="#cfd5db" stroke="#4a5561" stroke-width="1"/>`;
    });
    return s;
  }
  function buildingSVG(n) {
    const c = C[n.kind] || C.machine;
    let s = flat(n.x - 0.4, n.z - 0.4, n.w + 0.8, n.d + 0.8, 0, 'transparent', ' class="ring"');
    if (n.kind === 'field') {
      s += block(n.x, n.z, n.w, n.d, n.h, [c[0], c[1], c[1]]);
      for (let z = n.z + 0.5; z < n.z + n.d; z += 0.6) { const a = pj(n.x + 0.3, z, n.h), b = pj(n.x + n.w - 0.3, z, n.h); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c[1]}" stroke-width="2.5" stroke-linecap="round"/>`; }
      return s;
    }
    s += block(n.x, n.z, n.w, n.d, n.h, c);
    if (n.kind === 'shop') {
      for (let k = 0; k < 6; k++) s += onFront(n, k, n.h - 0.7, 1, 0.7, C.awning[k % 2]);
      s += onFront(n, n.w - 1.8, 0, 1.2, 1.5, '#6b7785');
    } else if (n.kind === 'unknown') {
      const p = pj(n.x + n.w / 2, n.z + n.d, n.h / 2 - 0.5);
      s += `<text x="${p[0]}" y="${p[1]}" font-size="22" font-weight="700" fill="${THEME.status.bad}" text-anchor="middle">?</text>`;
    } else if (n.kind === 'warehouse' || n.kind === 'fg') {
      for (let k = 0; k < 2; k++) s += onFront(n, 0.8 + k * 3.2, 0, 2.4, 2.2, '#aeb8c3');
      for (let k = 0; k < 2; k++) for (let v = 0.3; v < 2.2; v += 0.45) { const a = pj(n.x + 0.8 + k * 3.2, n.z + n.d, v), b = pj(n.x + 3.2 + k * 3.2, n.z + n.d, v); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#97a3af" stroke-width="1"/>`; }
    } else if (n.kind === 'machine' || n.kind === 'assembly') {
      s += onFront(n, 0.5, n.h * 0.35, 1.8, n.h * 0.5, C.panel);
      s += onFront(n, 0.7, n.h * 0.55, 1.4, n.h * 0.24, C.screen);
      if (n.kind === 'machine') {
        // the queue: one cell per place, filled by paintStatus()
        const q = Math.max(1, n.lane.queue || 1), cw = Math.min(0.42, 2.2 / q);
        for (let k = 0; k < q; k++) s += onFront(n, 2.7 + k * (cw + 0.08), n.h * 0.4, cw, 0.42, '#eef1f4', ` data-q="${esc(n.id)}|${k}"`);
      }
      s += andon(n);
    }
    return s;
  }
  const pill = (n, p) => `<g class="pill" data-pill="${esc(n.id)}" transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)})"><rect x="-30" y="0" width="60" height="20" rx="10"/><text x="0" y="14.5" text-anchor="middle"></text></g>`;
  // Outside, a shop's name is its sign and a field's is painted on it, with the status over the roof; inside, the
  // name and status float above the building.
  function labelSVG(n) {
    if (n.zone === 'out') {
      const sign = n.kind === 'field' ? pj(n.x + n.w / 2, n.z + n.d / 2, n.h) : pj(n.x + (n.kind === 'shop' ? (n.w - 2) / 2 : n.w / 2), n.z + n.d, n.h * 0.35);
      const top = pj(n.x + n.w / 2, n.z + n.d / 2, n.h + 0.4);
      return `<text class="title" x="${sign[0].toFixed(1)}" y="${(sign[1] + 6).toFixed(1)}" text-anchor="middle">${esc(n.sign || n.title)}</text>${pill(n, [top[0], top[1] - 24])}`;
    }
    const lift = n.kind === 'machine' || n.kind === 'assembly' ? n.h + 2.9 : n.h + 0.9;
    const p = pj(n.x + n.w / 2, n.z + n.d / 2, lift);
    return `<text class="title" x="${p[0].toFixed(1)}" y="${(p[1] - 22).toFixed(1)}" text-anchor="middle">${esc(n.title)}</text>${pill(n, [p[0], p[1] - 14])}`;
  }
  function mapSVG() {
    // the ground's corners, and every building's top with room for its andon tower and label
    const corners = [pj(-0.5, -0.5, 0), pj(G.width, -0.5, 0), pj(-0.5, G.depth + 0.5, -0.6), pj(G.width, G.depth + 0.5, -0.6),
      ...NODES.map((n) => pj(n.x, n.z, n.h + (n.kind === 'machine' || n.kind === 'assembly' ? 4.4 : 2.4)))];
    const xs = corners.map((p) => p[0]), ys = corners.map((p) => p[1]);
    const pad = 24, vb = [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) - Math.min(...xs) + pad * 2, Math.max(...ys) - Math.min(...ys) + pad * 2];
    // back to front, so nearer buildings cover farther ones
    const order = NODES.slice().sort((a, b) => a.z + a.d - (b.z + b.d) || a.x - b.x);
    const nodes = order.map((n) => `<g class="node${sel === n.id ? ' sel' : ''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(`${W[n.kind]}：${n.title}`)}">${buildingSVG(n)}${labelSVG(n)}</g>`).join('');
    return `<svg id="map" viewBox="${vb.map((v) => v.toFixed(0)).join(' ')}" role="group" aria-label="廠區地圖，點一個點看需求和狀態">
      <g>${groundSVG()}</g><g>${nodes}</g></svg>`;
  }

  /* ---------- blocks: every point as a card, one column per stage ---------- */
  const STAGES = [['out', W.outside], ['warehouse', W.warehouse], ['machine', '加工'], ['assembly', '組裝'], ['fg', W.fg]];
  const stageOf = (n) => (n.zone === 'out' ? 'out' : n.kind);
  // The few lines that say what a point needs this week and how far it has got; the panel has the rest.
  function blockLines(n) {
    const line = (name, v, cls = '') => `<span class="ln ${cls}"><span>${esc(name)}</span><span>${v}</span></span>`;
    const dp = (r) => `${fmt(r.done)}／${fmt(r.plan)}`;
    // a shop: bought against what every character may buy there; gathering: what is still to gather; the warehouse:
    // the stock against what is still to use
    if (n.kind === 'shop') return n.items.map((i) => {
      const B = i.buy.bought, L = i.buy.per.length * SHOP.limit, v = `${fmt(B)}／${fmt(L)}`;
      return line(i.name, i.mat.short ? `${v}・缺 ${fmt(i.mat.short)}` : v, i.mat.short ? 'bad' : B >= L || (B && !i.buy.qty) ? 'ok' : '');
    }).join('');
    if (n.kind === 'field' || n.kind === 'unknown') return n.items.map((i) => line(i.name, i.mat.get ? `還要採 ${fmt(i.mat.get)}` : '齊', i.mat.get ? '' : 'ok')).join('');
    if (n.kind === 'warehouse') return A.mats.filter((m) => m.need || m.short).map((m) => {
      const v = `${fmt(m.stock)}／${fmt(Math.max(0, m.need - m.used))}`;
      return line(m.name, m.short ? `${v}・缺 ${fmt(m.short)}` : v, m.short ? 'bad' : m.base >= m.need ? 'ok' : '');
    }).join('') || line('沒有進料', '');
    if (n.kind === 'machine') {
      const L = n.lane, q = PL.get(L.name), r = q && q.rounds[0];
      const now = !r ? '都做完了' : q.run ? (r.end != null && r.end <= Date.now() ? '做好了，可以全部領取' : `第 1 輪做中${r.end != null ? `・${hm(r.end)} 好` : ''}`)
        : `下一輪 ${r.items.length} 批・還有 ${q.rounds.length} 輪`;
      return rowsOf(n).map((x) => line(x.item, `${dp(x)} 批`, x.done >= x.plan ? 'ok' : '')).join('')
        + `<span class="foot">${esc(now)}・${L.queue == null ? '排程上限待補' : `排程 ${L.queue} 格`}</span>`;
    }
    if (n.kind === 'assembly') {
      const made = new Set(P.steps.map((s) => s.name)), inputs = [...new Set(n.lane.steps.flatMap((s) => s.r.inputs.map((i) => i.item)))];
      return PR.assemble.map((r) => line(r.item, dp(r), r.done >= r.plan ? 'ok' : '')).join('')
        + `<span class="foot">直接料 ${esc(inputs.filter((i) => !made.has(i)).join('、') || '—')}・加工料 ${esc(inputs.filter((i) => made.has(i)).join('、') || '—')}</span>`;
    }
    return (PR.assemble.map((r) => line(r.item, dp(r), r.done >= r.plan ? 'ok' : '')).join('') || line('沒有訂單', ''))
      + '<span class="foot">點一下填已入庫</span>';
  }
  function blocksHTML() {
    return `<div class="flow">${STAGES.map(([key, title]) => {
      const list = NODES.filter((n) => stageOf(n) === key);
      if (!list.length) return '';
      return `<section class="stage"><h3>${esc(title)}</h3>${list.map((n) => {
        const [k, text] = statusOf(n);
        return `<button class="blk ${k}${sel === n.id ? ' sel' : ''}" type="button" data-go="${esc(n.id)}" data-blk="${esc(n.id)}">
          <span class="blk-head"><span class="blk-name">${esc(n.title)}</span><span class="badge ${k}">${esc(text)}</span></span>
          ${blockLines(n)}</button>`;
      }).join('')}</section>`;
    }).join('')}</div>`;
  }

  /* ---------- the side panel ---------- */
  const badge = ([k, text]) => `<span class="badge ${k}"><i class="dot" style="background:${THEME.status[k]}"></i>${esc(text)}</span>`;
  const barHTML = (f, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, f * 100)).toFixed(0)}%"></i></div>`;
  const goHTML = (id, label, sub) => `<button class="go" type="button" data-go="${esc(id)}"><b>${label}</b>${sub ? `<div class="muted">${sub}</div>` : ''}</button>`;
  const nodeOfMat = (name) => NODES.find((n) => n.items && n.items.some((i) => i.name === name));
  const fixButton = (o) => (o.max < Infinity && o.max !== o.qty ? `<button class="btn small" type="button" data-oset="${o.i}|${o.max}">改成上限 ${fmt(o.max)}</button>` : '');

  // Ways out of a shortage of a shop-only material, worked out from the numbers.
  function remedies(m) {
    const perChar = m.s.shops.length * SHOP.limit, toBuy = Math.max(0, m.want - m.base), tips = [];
    const need = chars() + Math.ceil(m.short / perChar);
    if (chars() < MAX_CHARS) tips.push(need <= MAX_CHARS ? `加到 ${need} 隻角色去買就夠（每多一隻，這樣東西本週多 ${fmt(perChar)} 個）。` : `角色加到上限 ${MAX_CHARS} 隻也還缺 ${fmt(m.short - (MAX_CHARS - chars()) * perChar)}。`);
    tips.push(`分週做：照現在 ${chars()} 隻角色，要 ${Math.ceil(toBuy / (perChar * chars()))} 週才買得齊；這週先做上限，剩的下週再排。`);
    tips.push('把訂單數改成上限，或把比較要緊的料理往上移，讓它先分到。');
    const other = m.s.src.filter((x) => x.kind === 'barter' || x.kind === 'loot');
    if (other.length) tips.push(`還有其他來源沒算進去：${other.map(sourceText).join('、')}。`);
    tips.push('手上有庫存的話，在進料倉填「庫存」。');
    return tips;
  }
  function shortageHTML(m) {
    const cut = A.rows.filter((o) => o.n < o.qty && o.stuck.includes(m.name));
    return `<div class="sec alert"><h3>異常・${esc(m.name)}原物料不足</h3>
      <dl class="kv">
        <dt>訂單要</dt><dd>${fmt(m.want)}</dd>
        <dt>本週最多</dt><dd>${fmt(m.s.cap)}（已有 ${fmt(m.base)} ＋ 還能買 ${fmt(m.s.buyCap)}：${esc(m.s.shops.map((x) => x.who).join('＋'))}，每家每隻 ${SHOP.limit} 個 × ${chars()} 隻）</dd>
        <dt>缺</dt><dd class="bad-text">${fmt(m.short)}</dd>
      </dl>
      ${cut.length ? `<h4>影響</h4><ul class="rows">${cut.map((o) => `<li><span>${nameHTML(o.dish)}<span class="muted">・想做 ${fmt(o.qty)}，只能做 ${fmt(o.n)}</span></span><span>${fixButton(o)}</span></li>`).join('')}</ul>` : ''}
      <h4>可以怎麼做</h4><ul class="tips">${remedies(m).map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
    </div>`;
  }

  // 訂單需求: the orders a point works for, top first, and what it does for each; parts(o) lists that as HTML bits.
  function demandHTML(parts, note = '') {
    const lines = A.rows.map((o) => [o, parts(o)]).filter(([, p]) => p.length);
    return `<div class="sec"><h3>訂單需求</h3>${lines.length ? `<ul class="rows">${lines.map(([o, p]) => `<li><span><span class="ord-no">${o.i + 1}</span>${nameHTML(o.dish)}</span>
        <span class="num">×${fmt(o.n)}${o.n < o.qty ? `<small class="ord-cut">／訂 ${fmt(o.qty)}</small>` : ''}</span><span class="sub">${p.join('、')}</span></li>`).join('')}</ul>`
      : '<p class="muted" style="margin:0">沒有訂單用到這裡。</p>'}${lines.length && note ? `<p class="note">${note}</p>` : ''}</div>`;
  }
  // How much of each raw material order o takes; one it is held back by is marked.
  const rawParts = (o, names) => names.filter((m) => o.raw.get(m) || (o.n < o.qty && o.stuck.includes(m))).map((m) => (o.n < o.qty && o.stuck.includes(m)
    ? `<span class="ord-cut">${esc(m)} ${fmt(o.raw.get(m) || 0)}・不夠</span>` : `${esc(m)} ${fmt(o.raw.get(m))}`));
  const stepParts = (o, steps, unit) => steps.filter((st) => o.batches.get(st.name)).map((st) => `${esc(st.name)} ${fmt(o.batches.get(st.name))} ${unit}`);

  // One raw material: the stock (as the game shows it) against what the week still has to use, and what is missing;
  // with `go`, a button to the shop or field that supplies the rest.
  function stockRow(m, go = true, where = 'hp') {
    const rem = Math.max(0, m.need - m.used), lack = Math.max(0, m.need - m.base);
    const to = lack && go ? NODES.find((n) => n.items && n.items.some((i) => i.name === m.name && (n.kind !== 'shop' || i.buy.qty))) || nodeOfMat(m.name) : null;
    const sub = lack ? `<em>還差 ${fmt(lack)}${m.buy ? `・建議買 ${fmt(m.buy)}` : ''}${m.get ? `・${m.s.gather ? '要採' : '待補'} ${fmt(m.get)}` : ''}</em>`
      : `<em class="go-on">夠了</em>`;
    return `<div class="done-row stk${lack ? '' : ' ok'}">
      <span class="chk" aria-hidden="true">${lack ? '' : '✓'}</span>
      <span class="what">${nameHTML(m.name)}<small>${sub}${m.short ? `<em class="bad">訂單想要的還缺 ${fmt(m.short)}</em>` : ''}</small></span>
      <span class="plan">還要用 ${fmt(rem)}</span>
      <label class="act">庫存${haveInput(m.name, where)}</label>
      ${to ? `<button class="btn small" type="button" data-go="${esc(to.id)}">去${esc(to.sign || to.title)}</button>` : ''}
    </div>`;
  }
  // A shop's items, each with a line per character: bought (typed in) against the weekly limit, and what the plan
  // still suggests buying there.
  function buyHTML(n) {
    const wk = shopWeek(), full = n.items.every((i) => i.buy.per.every((x) => x.bought >= SHOP.limit));
    const items = n.items.map((i) => {
      const b = i.buy, L = b.per.length * SHOP.limit;
      const others = i.mat.s.shops.filter((x) => x.who !== n.sign || x.town !== n.town).map((x) => x.who);
      const rows = b.per.map((x, c) => `<div class="buy-row">
          <span class="who">角色 ${c + 1}</span>
          <span><input class="have" data-buy="${c}|${esc(b.key)}" data-f="b:${c}|${esc(b.key)}" inputmode="numeric" value="${x.bought || ''}" placeholder="0" aria-label="${esc(i.name)} 角色 ${c + 1} 已購買">／${SHOP.limit}</span>
          <span class="st${x.bought >= SHOP.limit ? ' ok' : x.more ? ' more' : ''}">${x.bought >= SHOP.limit ? '✓ 買滿' : x.more ? `建議再買 ${fmt(x.more)}` : `還能買 ${fmt(SHOP.limit - x.bought)}`}</span>
          ${x.bought < SHOP.limit ? `<button class="btn small" type="button" data-buyfill="${c}|${SHOP.limit}|${esc(b.key)}">買滿</button>` : ''}
        </div>`).join('');
      const note = [i.mat.short && `<span class="bad-text">買滿也不夠，缺 ${fmt(i.mat.short)}</span>`, others.length && `也在 ${esc(others.join('、'))} 買`].filter(Boolean);
      return `<div class="buy-item">
        <div class="buy-head">${nameHTML(i.name)}<span class="muted">可購買 ${fmt(L)}（${b.per.length} 隻 × ${SHOP.limit}）</span><span class="num">${fmt(b.bought)}／${fmt(L)}</span></div>
        ${barHTML(L ? b.bought / L : 0, i.mat.short ? 'full' : '')}${rows}${note.length ? `<p class="note">${note.join('・')}</p>` : ''}
      </div>`;
    }).join('');
    return `<div class="sec"><h3 class="ord-h">已購買・可購買<span>每週${'日一二三四五六'[SHOP.resetDay]} ${esc(SHOP.resetAt)} 重置・還剩 ${esc(wk.left)}</span></h3>
      ${full ? '' : `<button class="btn small buy-all" type="button" data-buyall="${esc(n.id)}">這家全部買滿</button>`}
      ${items}<p class="note">填已購買，進料倉的庫存會自動加上去。</p></div>`;
  }

  // A station's queue in the panel: each round with its places, the running one locked, the rest draggable (⠿) or
  // moved with ▲▼; 開工 starts the next round, 全部領取 finishes the running one.
  function queueHTML(q) {
    const L = q.lane, lane = esc(L.name), first = q.rounds.findIndex((r) => !r.running), now = Date.now();
    const rounds = q.rounds.map((r, k) => {
      const done = r.running && r.end != null && r.end <= now;
      const head = r.running ? (done ? '<b class="ok-text">做好了，可以全部領取</b>' : `做中・${hm(r.start)} 開工${r.end != null ? ` → ${hm(r.end)} 全部好` : ''}`)
        : `預計 ${k === first && !q.run ? '現在' : hm(r.start)} 開工${r.end != null ? ` → ${hm(r.end)} 好` : '・時間待補'}`;
      const cells = Array.from({ length: q.size }, (_, j) => {
        const name = r.items[j];
        if (!name) return `<div class="slot empty"${!r.running && k === q.rounds.length - 1 ? ` data-slot="${q.seq.length - 1}" data-lane="${lane}"` : ''}><span></span><span class="no">${j + 1}</span><span>空</span></div>`;
        const idx = r.from + j, x = secsOf(name), wait = r.wait[j];
        const what = `<span class="what">${nameHTML(name)}<small>每批 ${x == null ? '時間待補' : esc(fmtDur(x))}${r.ends[j] != null ? `・${hm(r.ends[j])} 好` : ''}</small>${wait.length ? `<em>${esc(wait.join('、'))}還沒做好</em>` : ''}</span>`;
        if (r.running) return `<div class="slot lock"><span></span><span class="no">${j + 1}</span>${what}<span></span></div>`;
        return `<div class="slot${wait.length ? ' bad' : ''}" data-slot="${idx}" data-lane="${lane}">
          <span class="grip" title="拖拉換順序" aria-hidden="true">⠿</span><span class="no">${j + 1}</span>${what}
          <span class="mv"><button class="btn" type="button" data-smove="${lane}|${idx}|-1" aria-label="${esc(name)} 往前"${idx ? '' : ' disabled'}>▲</button><button class="btn" type="button" data-smove="${lane}|${idx}|1" aria-label="${esc(name)} 往後"${idx < q.seq.length - 1 ? '' : ' disabled'}>▼</button></span>
        </div>`;
      }).join('');
      const act = r.running
        ? `<div class="round-act"><button class="btn primary" type="button" data-collect="${lane}">全部領取</button><label>開工時間<input type="time" data-runat="${lane}" data-f="ra:${lane}" value="${timeVal(r.start)}"></label><button class="btn small" type="button" data-unstart="${lane}">取消開工</button></div>`
        : k === first && !q.run ? `<div class="round-act"><button class="btn primary" type="button" data-start="${lane}">開工</button><label>開工時間<input type="time" data-startat="${lane}" data-f="sa:${lane}" value="${timeVal(now)}"></label></div>` : '';
      const short = r.short.length ? `<p class="note bad-text">庫存不夠：${esc(r.short.map((x) => `${x.item} 差 ${fmt(x.lack)}`).join('、'))}</p>` : '';
      return `<div class="round${r.running ? ' running' : ''}${done ? ' ready' : ''}"><div class="round-head"><b>第 ${k + 1} 輪</b><span>${head}</span></div>${cells}${short}${act}</div>`;
    }).join('');
    const sum = q.rounds.length ? `${q.rounds.length} 輪${q.end != null ? `・${hm(q.end)} 全部做完` : '・時間待補'}` : '都做完了';
    return `<div class="sec"><h3 class="ord-h">排程<span>${esc(sum)}</span></h3>
      ${rounds || '<p class="muted" style="margin:0">這週的批數都做完了。</p>'}
      ${q.seq.length > 1 ? '<p class="note">拖 ⠿ 或按 ▲▼ 換順序，時間會跟著重算；開工後那一輪就鎖住。後面的輪次照「上一輪做完就接著開工」算。</p>' : ''}
      <p class="note">開工會從庫存扣掉這一輪的原料，全部領取會把做好的加工品加進庫存。排程上限 ${L.queue == null ? '待補，先當 1 格' : `${q.size} 格，一次做一批`}。</p></div>`;
  }

  function overviewHTML() {
    const wk = shopWeek(), rows = A.rows;
    const full = rows.filter((o) => o.n >= o.qty).length;
    const alarms = A.mats.filter((m) => m.short).map((m) => { const n = nodeOfMat(m.name); return goHTML(n ? n.id : 'wh', `${esc(m.name)}原物料不足，缺 ${fmt(m.short)}`, `${esc(m.users.join('、'))}做不滿・點開看對策`); });
    const issues = [];
    if (BY.has('unknown')) issues.push(goHTML('unknown', '有原料來源待補', esc(BY.get('unknown').items.map((i) => i.name).join('、'))));
    for (const n of NODES) if (n.kind === 'machine' && n.lane.steps.some((s) => s.secs == null)) issues.push(goHTML(n.id, `${esc(n.title)}的時間待補`, '補上才能排時間'));
    for (const n of NODES) if (n.kind === 'machine' && n.lane.queue == null) issues.push(goHTML(n.id, `${esc(n.title)}的排程上限待補`, '先當一次排 1 批'));
    return `<div class="panel-head"><div class="kind">總覽</div><h2>訂單</h2></div>
      ${ordersHTML()}
      <div class="sec"><h3>本週進度</h3>${barHTML(PR.total ? PR.finished / PR.total : 0, 'done')}<p class="note">完成 ${fmt(PR.finished)}／${fmt(PR.total)} 項（買、採、加工、組裝每一項做滿算一項）</p></div>
      <div class="sec${alarms.length ? ' alert' : ''}"><h3>異常</h3>${alarms.length ? `<ul class="rows">${alarms.map((x) => `<li>${x}</li>`).join('')}</ul>` : '<p class="muted" style="margin:0">沒有異常，原物料都夠。</p>'}</div>
      ${issues.length ? `<div class="sec"><h3>待補</h3><ul class="rows">${issues.map((x) => `<li>${x}</li>`).join('')}</ul></div>` : ''}
      <div class="sec"><dl class="kv">
        <dt>本週</dt><dd>${esc(wk.range)}・還剩 ${esc(wk.left)}</dd>
        <dt>角色</dt><dd>${chars()} 隻${charsFromBoard() ? '（照佈告欄）' : ''}，每隻每店每樣 ${SHOP.limit} 個／週</dd>
        <dt>訂單</dt><dd>${full}／${rows.length} 道做得滿・可做 ${fmt(P.qty)}／${fmt(rows.reduce((t, o) => t + o.qty, 0))} 個</dd>
        <dt>加工</dt><dd>${(() => { const ps = procSummary(); return ps.busy ? `還有 ${ps.rounds} 輪、上線 ${ps.logins} 次・下次 ${esc(nextText(ps.next))}・${ps.finish != null ? `${esc(hm(ps.finish))} 全部做完` : '時間待補'}` : '加工都做完了'; })()}</dd>
      </dl></div>`;
  }

  function nodeHTML(n) {
    const st = statusOf(n);
    const head = `<div class="panel-head"><button class="back" type="button" data-go="">◀ 訂單</button><div class="kind">${esc(W[n.kind])}</div><h2>${esc(n.title)} ${badge(st)}</h2></div>`;
    // A station's actuals, the same as on the completion list.
    const mine = n.kind === 'machine' || n.kind === 'assembly' ? rowsOf(n) : [];
    const actual = mine.length ? `<div class="sec"><h3>${n.kind === 'machine' ? '已完成・要修正再改' : '實績・本週'}</h3>${mine.map((r) => (r.kind === 'assembled'
      ? doneRow(r, r.done >= r.plan ? '' : r.ready ? '<em class="go-on">可以組裝</em>' : `<em>等：${esc(r.waiting.join('、'))}</em>`, 'p', !r.ready && r.done < r.plan)
      : doneRow(r, r.kind === 'processed' && r.waiting.length && r.done < r.plan ? `<em>等料：${esc(r.waiting.join('、'))}還沒齊</em>` : '', 'p'))).join('')}</div>` : '';
    if (n.kind === 'shop') {
      return head + demandHTML((o) => rawParts(o, n.items.map((i) => i.name)), n.items.some((i) => i.mat.s.shops.length > 1) ? '數字是整張訂單要的量；同一樣東西在幾家店買的話，這家只買其中一部分，下面的「建議再買」才是這家的份。' : '')
        + buyHTML(n) + n.items.filter((i) => i.mat.short).map((i) => shortageHTML(i.mat)).join('');
    }
    if (n.kind === 'field' || n.kind === 'unknown') {
      return head + demandHTML((o) => rawParts(o, n.items.map((i) => i.name))) + `<div class="sec"><h3>庫存・還要${n.kind === 'field' ? '採' : '拿'}</h3>${n.items.map((i) => stockRow(i.mat, false)).join('')}
        ${n.kind === 'unknown' ? '<p class="note">還不知道在哪拿，先當成不限量。截道具卡給我就能補上。</p>' : '<p class="note">採集不受限購，花的是你的時間。採回來直接改庫存。</p>'}</div>`;
    }
    if (n.kind === 'warehouse') {
      return head + demandHTML((o) => rawParts(o, A.mats.map((m) => m.name))) + A.mats.filter((m) => m.short).map(shortageHTML).join('')
        + `<div class="sec"><h3>庫存・還要用</h3>${A.mats.filter((m) => m.need || m.want).map((m) => stockRow(m)).join('') || '<p class="muted" style="margin:0">這週不用原物料。</p>'}
          <p class="note">庫存照遊戲背包現在的數量填。商店填已購買、加工站開工和全部領取、訂單填已入庫，這裡都會自動加減；對不上時直接改，以你填的為準。</p></div>`;
    }
    if (n.kind === 'machine') {
      const L = n.lane, q = PL.get(L.name);
      return head + demandHTML((o) => stepParts(o, L.steps, '批')) + (q ? queueHTML(q) : '') + `<div class="sec"><h3>需求</h3><ul class="rows">${L.steps.map((s) => `<li><span>${nameHTML(s.name)}</span><span class="num">${fmt(s.batches)} 批</span>
          <span class="sub">每批 ${s.secs == null ? '時間待補' : esc(fmtDur(s.secs))}・一批 ${yieldOf(s.r)} 個・用 ${esc(s.r.inputs.map((i) => `${i.item} ×${i.qty}`).join('、'))}</span></li>`).join('')}</ul></div>
        ${actual}`;
    }
    if (n.kind === 'assembly') {
      const L = n.lane, need = new Map(), made = new Set(P.steps.map((s) => s.name));
      for (const s of L.steps) for (const i of s.r.inputs) need.set(i.item, (need.get(i.item) || 0) + s.batches * i.qty);
      return head + demandHTML((o) => stepParts(o, L.steps, '個')) + actual + `<div class="sec"><h3>需求・本週組裝</h3><ul class="rows">${L.steps.map((s) => `<li><span>${nameHTML(s.name)}</span><span class="num">${fmt(s.batches)} 個</span>
          <span class="sub">一個用 ${esc(s.r.inputs.map((i) => `${i.item} ×${i.qty}`).join('、'))}</span></li>`).join('')}</ul><p class="note">組裝只要十幾秒，不計時。</p></div>
        <div class="sec"><h3>要備齊的料</h3><ul class="rows">${[...need].map(([item, q]) => `<li><span>${nameHTML(item)}<span class="muted">${made.has(item) ? '・加工料，從加工站來' : '・直接料，先放這裡等'}</span></span><span class="num">${fmt(q)}</span></li>`).join('')}</ul></div>`;
    }
    // 訂單 is the panel's default view (see pick).
    return head;
  }

  function renderPanel() {
    const n = sel && BY.get(sel);
    $('panel').innerHTML = n ? nodeHTML(n) : overviewHTML();
  }

  // Status pills, andon lamps and the queue cells (the first round lined up) on the map.
  function paintStatus() {
    for (const n of NODES) {
      const [k, text] = statusOf(n);
      const pill = document.querySelector(`[data-pill="${CSS.escape(n.id)}"]`);
      if (pill) {
        const w = Math.max(48, [...text].reduce((t, ch) => t + (ch.charCodeAt(0) > 255 ? 14 : 8), 0) + 20);
        pill.querySelector('rect').setAttribute('x', -w / 2);
        pill.querySelector('rect').setAttribute('width', w);
        pill.querySelector('rect').setAttribute('fill', THEME.status[k]);
        const tx = pill.querySelector('text');
        tx.textContent = text;
        tx.setAttribute('fill', k === 'wait' ? '#3d2b00' : '#fff');
      }
      for (const lamp of ['bad', 'wait', 'ok']) {
        const el = document.querySelector(`[data-lamp="${CSS.escape(`${n.id}|${lamp}`)}"]`);
        if (el) el.setAttribute('fill', k === lamp ? THEME.status[lamp] : '#cfd5db');
      }
      if (n.kind === 'machine') {
        // the round on the station: yellow running, green made, grey lined up next
        const q = PL.get(n.lane.name), r = q && q.rounds[0], lined = r ? r.items.length : 0;
        const fill = !r ? '' : !q.run ? '#b9c3cd' : r.end != null && r.end <= Date.now() ? THEME.status.ok : THEME.status.wait;
        for (let i = 0; i < Math.max(1, n.lane.queue || 1); i++) {
          const el = document.querySelector(`[data-q="${CSS.escape(`${n.id}|${i}`)}"]`);
          if (el) el.setAttribute('fill', i < lined ? fill : '#eef1f4');
        }
      }
    }
  }

  /* ---------- the wish list and the materials it takes ---------- */
  const stepper = (key, value, label, step) => `<span class="stepper"><button class="btn" type="button" data-step="${key}|-${step}" aria-label="${label}少 ${step}">−${step}</button><input data-num="${key}" data-f="n:${key}" inputmode="numeric" value="${value}" aria-label="${label}"><button class="btn" type="button" data-step="${key}|${step}" aria-label="${label}多 ${step}">+${step}</button></span>`;
  // 訂單, the panel's default view: the wish list (the orders), what the week can make of each, and how many
  // are assembled into stock.
  function ordersHTML() {
    // A dish ordered on two lines is assembled as one; its stock is filled in on the first line.
    const first = new Map();
    for (const o of A.rows) if (!first.has(o.dish)) first.set(o.dish, o.i);
    const [inD, inP] = tally(PR.assemble);
    const rows = A.rows.map((o) => {
      const r = PR.assemble.find((x) => x.item === o.dish), own = first.get(o.dish) === o.i, cut = o.n < o.qty;
      const locked = !!r && !r.ready && r.done < r.plan;
      let st, wait = '';
      if (!r) st = ['bad', '做不了'];
      else if (!own) st = ['idle', `跟第 ${first.get(o.dish) + 1} 道一起入庫`];
      else if (r.done >= r.plan) st = ['ok', '已入庫'];
      else if (r.ready) st = ['wait', '可以組裝'];
      else { st = ['idle', PR.process.some((p) => p.done < p.plan) ? '等加工' : '等料']; wait = `等：${esc(r.waiting.join('、'))}`; }
      const note = (cut ? `<span class="ord-cut">想做 ${fmt(o.qty)}・卡在 ${esc(o.stuck.join('、'))}</span>${o.max > 0 ? fixButton(o) : ''}` : '') + (wait ? `<span>${wait}</span>` : '');
      return `<div class="ord-row">
        <span class="wish-n">${o.i + 1}</span>
        <span class="ord-top">
          <select data-odish="${o.i}" data-f="o:${o.i}:dish" aria-label="第 ${o.i + 1} 道要做什麼">${dishOptions(o.dish)}</select>
          <button class="btn" type="button" data-omove="${o.i}|-1" aria-label="往上移"${o.i ? '' : ' disabled'}>▲</button>
          <button class="btn" type="button" data-omove="${o.i}|1" aria-label="往下移"${o.i < S.orders.length - 1 ? '' : ' disabled'}>▼</button>
          <button class="btn" type="button" data-odel="${o.i}" aria-label="刪掉這道">✕</button>
        </span>
        <span class="ord-line"><span>訂單${stepper(`o${o.i}`, o.qty, `第 ${o.i + 1} 道訂單數`, 10)}</span>
          <span>可做<b${cut ? ' class="cut"' : ''}>${fmt(o.n)}</b>${o.max < Infinity ? `上限 ${fmt(o.max)}` : ''}</span></span>
        <span class="ord-line"><span>已入庫${r && own ? doneInput(r, 's', locked) + fillButton(r, locked) : '—'}</span>${badge(st)}</span>
        ${note ? `<span class="ord-note">${note}</span>` : ''}
      </div>`;
    }).join('');
    return `<div class="sec orders-sec"><h3 class="ord-h">入庫<span><b>${fmt(inD)}</b>／${fmt(inP)}</span></h3>
      ${barHTML(inP ? inD / inP : 0, 'done')}
      <p class="note">選料理、填訂單數，越上面越先分到限購材料；組裝好就填已入庫。</p>
      ${rows || '<p class="muted">還沒有訂單，先加一道菜。</p>'}
      <button class="btn" type="button" id="add-order">＋ 加一道菜</button>
    </div>`;
  }
  /* ---------- a station's finished counts ---------- */
  const FILL = { bought: '買齊', gathered: '採齊', processed: '全部完成', assembled: '全部入庫' };
  const UNIT = { bought: '個', gathered: '個', processed: '批', assembled: '個' };
  const doneInput = (r, where, locked) => `<input class="have" data-done="${r.kind}|${esc(r.key)}" data-f="${where}:${r.kind}|${esc(r.key)}" inputmode="numeric" value="${r.done || ''}" placeholder="0"${locked ? ' disabled' : ''} aria-label="${esc(r.item)} ${VERB[r.kind]}">`;
  const fillButton = (r, locked) => (r.done >= r.plan
    ? `<button class="btn small" type="button" data-donefill="${r.kind}|0|${esc(r.key)}">清除</button>`
    : `<button class="btn small" type="button" data-donefill="${r.kind}|${r.plan}|${esc(r.key)}"${locked ? ' disabled' : ''}>${FILL[r.kind]}</button>`);
  // One line: tick, what and where, the plan, the actual and a button that fills it to plan (or clears it).
  function doneRow(r, sub, where, locked = false) {
    const done = r.done >= r.plan;
    return `<div class="done-row${done ? ' is-done' : ''}${locked ? ' is-locked' : ''}">
      <span class="chk" aria-hidden="true">${done ? '✓' : ''}</span>
      <span class="what">${nameHTML(r.item)}${sub ? `<small>${sub}</small>` : ''}</span>
      <span class="plan">計畫 ${fmt(r.plan)} ${UNIT[r.kind]}</span>
      <label class="act">${VERB[r.kind]}${doneInput(r, where, locked)}</label>
      ${fillButton(r, locked)}
    </div>`;
  }
  const haveInput = (name, where = 'h') => `<input class="have" data-have="${esc(name)}" data-f="${where}:${esc(name)}" inputmode="numeric" value="${held(name) || ''}" placeholder="0" aria-label="${esc(name)} 庫存">`;
  function matsHTML() {
    const rank = (m) => (m.s.limited ? 0 : m.s.buyCap ? 1 : m.s.gather ? 2 : 3);
    const mats = A.mats.filter((m) => m.need || m.short).sort((a, b) => rank(a) - rank(b) || b.util - a.util || b.need - a.need);
    const rows = mats.map((m) => {
      const s = m.s, pct = Math.round(m.util * 100);
      const tag = m.short ? badge(['bad', `異常・缺 ${fmt(m.short)}`]) : s.limited ? badge([m.util >= 0.9 ? 'wait' : 'ok', '限購']) : s.gather ? badge(['idle', '可採集']) : s.unknown ? badge(['bad', '來源待補']) : '';
      const where = [...m.shops.map((sh) => `${sh.who} ${fmt(sh.qty)}`), m.get ? (s.gather ? `採：${s.src.find((x) => x.kind === 'gather').text}` : '來源待補') : ''].filter(Boolean);
      return `<tr>
        <th scope="row">${nameHTML(m.name)} ${tag}</th>
        <td class="num">${fmt(Math.max(0, m.need - m.used))}</td>
        <td>${haveInput(m.name)}</td>
        <td class="num">${s.buyCap ? `${fmt(m.buy)}<small>／${fmt(s.buyCap)}</small>${barHTML(m.util, pct >= 100 ? (s.limited ? 'full' : 'cap') : '')}` : '—'}</td>
        <td class="num">${m.get ? fmt(m.get) : '—'}</td>
        <td class="src">${esc(where.join('、') || '用庫存')}</td>
      </tr>`;
    }).join('');
    const made = P.steps.filter((s) => !P.dishSet.has(s.name)).map((s) => `<tr>
        <th scope="row">${nameHTML(s.name)}</th>
        <td class="num">${fmt(s.batches)} 批</td>
        <td>${haveInput(s.name)}</td>
        <td class="num">${fmt(s.made)}</td>
        <td class="num">${fmt(s.need)}</td>
        <td class="src">${esc(s.equip || '設備待補')}${A.pool.get(s.name) ? `・剩 ${fmt(A.pool.get(s.name))} 個留到下週` : ''}</td>
      </tr>`).join('');
    const sum = (f) => mats.reduce((t, m) => t + f(m), 0), rem = (m) => Math.max(0, m.need - m.used);
    return `<section class="card mats">
      <div class="mats-head"><h2>原物料</h2><span class="muted">${mats.length} 種，還要用 ${fmt(sum(rem))} 個：庫存有 ${fmt(sum((m) => Math.min(m.stock, rem(m))))}、建議買 ${fmt(sum((m) => m.buy))}、要採 ${fmt(sum((m) => m.get))}</span></div>
      ${rows ? `<div class="table-wrap"><table><thead><tr><th>原物料</th><th class="r">還要用</th><th>庫存</th><th class="r">建議買／還能買</th><th class="r">要採</th><th>去哪</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">這週不用原物料。</p>'}
      ${made ? `<h3>加工品</h3><div class="table-wrap"><table><thead><tr><th>加工品</th><th class="r">要做</th><th>庫存</th><th class="r">做出</th><th class="r">要用</th><th>設備</th></tr></thead><tbody>${made}</tbody></table></div>` : ''}
    </section>`;
  }

  // 區塊 or 地圖, remembered in this browser.
  const VIEW_KEY = 'mm-plant-view-v1';
  let view = readLS(VIEW_KEY) === 'map' ? 'map' : 'blocks';

  function render() {
    // Keep the focused field (by data-f) and its caret across the rebuild.
    const a = document.activeElement, f = a && a.dataset ? a.dataset.f : null;
    const caret = f && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
    const scroll = $('panel') ? $('panel').scrollTop : 0;
    plan();
    if (sel && !BY.has(sel)) sel = null;
    const wk = shopWeek();
    $('week-line').textContent = `本週 ${wk.range}`;
    const short = A.mats.filter((m) => m.short);
    // The summary's results open where they come from; the character count is edited right here.
    const shortNode = short.length ? nodeOfMat(short[0].name) : null;
    const station = NODES.find((n) => n.kind === 'machine'), ps = procSummary();
    const sum = (k, v, go, cls = '') => (go != null ? `<button class="sum ${cls}" type="button" data-go="${esc(go)}"><span class="k">${k}</span><b>${v}</b></button>` : `<span class="sum ${cls}"><span class="k">${k}</span><b>${v}</b></span>`);
    $('app').innerHTML = `<div class="card summary">
        <button class="sum" type="button" data-jump="wish"><span class="k">可做／訂單</span><b>${fmt(P.qty)}／${fmt(A.rows.reduce((t, o) => t + o.qty, 0))}</b></button>
        <button class="sum" type="button" data-jump="stock"><span class="k">入庫</span><b>${fmt(tally(PR.assemble)[0])}／${fmt(P.qty)}</b></button>
        ${sum('異常', short.length ? esc(short.map((m) => `${m.name}缺 ${fmt(m.short)}`).join('、')) : '沒有', shortNode ? shortNode.id : null, short.length ? 'bad' : '')}
        ${sum('下次上線', ps.busy ? esc(nextText(ps.next)) : '不用', station ? station.id : null)}
        ${sum('還要上線', `${ps.logins} 次`, station ? station.id : null)}
        ${sum('加工', !ps.busy ? '都做完了' : ps.finish != null ? `${esc(hm(ps.finish))} 做完` : '時間待補', station ? station.id : null)}
        <span class="sum edit"><span class="k">幾隻角色去買${charsFromBoard() ? '（照佈告欄）' : ''}</span>${stepper('chars', chars(), '角色數', 1)}</span>
        <p class="sum-hint">可做、異常、上線、加工是照你填的庫存、已購買、開工和入庫算出來的。點一下看是怎麼來的。角色最多 ${MAX_CHARS} 隻。</p>
      </div>
      <div class="layout">
        <div class="card map-card">
          <div class="view-bar"><h2>廠區</h2>
            <span class="tabs" role="group" aria-label="顯示方式"><button class="btn" type="button" data-view="blocks" aria-pressed="${view === 'blocks'}">區塊</button><button class="btn" type="button" data-view="map" aria-pressed="${view === 'map'}">地圖</button></span></div>
          ${view === 'map' ? `<p class="map-hint">地圖可以左右滑動；點建築看需求和狀態。</p><div class="map-scroll">${mapSVG()}</div>` : blocksHTML()}
          <div class="legend">${Object.entries(STATUS_TEXT).map(([k, text]) => `<span><i class="dot" style="background:${THEME.status[k]}"></i>${text}</span>`).join('')}<span>紅色「異常」是原物料不足，點商店看對策；點任何一格看需求、訂單需求和狀態。</span></div>
        </div>
        <aside class="card panel" id="panel"></aside>
        <div class="left">${matsHTML()}</div>
      </div>`;
    if (view === 'map') paintStatus();
    renderPanel();
    $('panel').scrollTop = scroll;
    if (f) {
      const el = document.querySelector(`[data-f="${CSS.escape(f)}"]`);
      if (el) { el.focus({ preventScroll: true }); if (caret && el.setSelectionRange) try { el.setSelectionRange(...caret); } catch (_) {} }
    }
  }

  function select(id) {
    sel = id || null;
    document.querySelectorAll('[data-node], [data-blk]').forEach((el) => el.classList.toggle('sel', (el.dataset.node || el.dataset.blk) === sel));
    renderPanel();
    if (window.matchMedia('(max-width: 1000px)').matches && sel) $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 'wish' and 'stock' bring the orders back into the panel and put the caret in the first order, or the first 已入庫
  // that can be filled in.
  function jumpTo(where) {
    select(null);
    const panel = $('panel'), first = panel.querySelector(where === 'stock' ? 'input[data-done]:not([disabled])' : 'input:not([disabled])');
    panel.scrollTop = 0;
    (first || panel).scrollIntoView({ behavior: 'smooth', block: first ? 'center' : 'start' });
    if (first) first.focus({ preventScroll: true });
  }
  // The 訂單 point is the order list, so it brings the orders back into the panel.
  const pick = (id) => (id === 'fg' ? jumpTo('stock') : select(id));

  /* ---------- a station's queue: moving, starting and collecting rounds ---------- */
  // Moves the batch at `from` in a station's queue to `to` (both places among the batches not yet started).
  function moveBatch(lane, from, to) {
    const q = PL.get(lane);
    if (!q || from === to) return;
    const seq = q.seq.slice(), [x] = seq.splice(from, 1);
    seq.splice(Math.max(0, Math.min(seq.length, to)), 0, x);
    setOrder(lane, seq);
    save();
    render();
  }
  function queueAction(b) {
    const lane = b.dataset.start || b.dataset.collect || b.dataset.unstart, q = lane && PL.get(lane);
    if (b.dataset.smove) {
      const v = b.dataset.smove, c = v.lastIndexOf('|'), a = v.lastIndexOf('|', c - 1);
      const from = Number(v.slice(a + 1, c));
      moveBatch(v.slice(0, a), from, from + Number(v.slice(c + 1)));
      return;
    }
    if (!q) return;
    if (b.dataset.start) {
      const r = q.rounds.find((x) => !x.running), inp = document.querySelector(`[data-startat="${CSS.escape(lane)}"]`);
      if (r) startRound(lane, r.items, (inp && fromTime(inp.value)) || Date.now(), q.seq.slice(r.items.length));
    } else if (b.dataset.collect) collectRound(lane);
    else cancelRound(lane);
    save();
    render();
  }
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (!t.dataset || !t.dataset.runat) return;
    const at = fromTime(t.value);
    if (at != null) { setRunAt(t.dataset.runat, at); save(); render(); }
  });
  // Dragging a batch by its ⠿ to another place on the same station; works with a mouse or a finger.
  let drag = null;
  const clearDrop = () => document.querySelectorAll('.slot.drop').forEach((x) => x.classList.remove('drop'));
  document.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest && e.target.closest('.grip');
    if (!grip || e.button > 0) return;
    const el = grip.closest('[data-slot]');
    e.preventDefault();
    drag = { el, lane: el.dataset.lane, from: Number(el.dataset.slot), x: e.clientX, y: e.clientY, id: e.pointerId, on: false, to: null };
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) < 5) return;
    drag.on = true;
    drag.el.classList.add('dragging');
    drag.el.style.transform = `translate(${dx}px, ${dy}px)`;
    const t = document.elementsFromPoint(e.clientX, e.clientY).map((x) => x.closest('[data-slot]')).find((x) => x && x !== drag.el);
    clearDrop();
    drag.to = t && t.dataset.lane === drag.lane ? Number(t.dataset.slot) : null;
    if (drag.to != null) t.classList.add('drop');
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    clearDrop();
    if (d.on && d.to != null && d.to !== d.from) moveBatch(d.lane, d.from, d.to);
    else { d.el.classList.remove('dragging'); d.el.style.transform = ''; }
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  // Running rounds come due by themselves: redraw now and then, unless something is being typed or dragged.
  setInterval(() => {
    const a = document.activeElement;
    if (!A || drag || (a && a.matches && a.matches('input, select'))) return;
    render();
  }, 30e3);

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const qb = e.target.closest('[data-start], [data-collect], [data-unstart], [data-smove]');
    if (qb) { queueAction(qb); return; }
    const all = e.target.closest('[data-buyall]');
    if (all) {
      const n = BY.get(all.dataset.buyall);
      if (n) for (const i of n.items) i.buy.per.forEach((_, c) => setBought(i.buy.key, c, SHOP.limit));
      save();
      render();
      return;
    }
    const node = e.target.closest('.node');
    if (node) { pick(node.dataset.node); return; }
    const go = e.target.closest('[data-go]');
    if (go) { pick(go.dataset.go); return; }
    const v = e.target.closest('[data-view]');
    if (v) { view = v.dataset.view; writeLS(VIEW_KEY, view); render(); return; }
    const jump = e.target.closest('[data-jump]');
    if (jump) { jumpTo(jump.dataset.jump); return; }
  });
  document.addEventListener('keydown', (e) => {
    const node = e.target.closest && e.target.closest('.node');
    if (node && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(node.dataset.node); }
    if (e.key === 'Escape' && sel) select(null);
  });
  wireList(render);
  // The planner may change the plan in another tab.
  addEventListener('storage', (e) => { if (e.key === 'mm-line-v1') location.reload(); });

  (async () => {
    try {
      await window.LineCore.load();
    } catch (_) {
      $('app').innerHTML = '<div class="card fail">這頁的配方是從佈告欄（index.html）讀進來的，要用網址開啟，例如 GitHub Pages；直接點開檔案的話瀏覽器不讓它讀。</div>';
      return;
    }
    render();
  })();
})();
</script>
</body>
</html>
